[package]
name = "camerata-secrets"
edition.workspace = true
license.workspace = true
authors.workspace = true
version = "0.0.0"

[lints]
workspace = true

# Leaf crate: the ONE secret-shape detector + redactor, shared by the gateway SEC arms, the scan
# floor, the chat scrubber and the export release gate. NO camerata-* dependencies, so any crate
# (checks, llm, gateway, server, cli) can depend on it without a cycle. See
# docs/design/2026-10-23_secret-redaction-and-release-gate.md.
[dependencies]
regex = "1"
# The JWT payload decode (the `role` claim) that separates a service-role key from the public anon key.
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
# T3 published-example allowlist is stored as SHA-256 digests, never as secret-shaped literals.
sha2 = { workspace = true }
