[package]
name = "camerata-checks"
edition.workspace = true
license.workspace = true
authors.workspace = true
version = "0.0.0"

[lints]
workspace = true

[dependencies]
camerata-core = { path = "../core" }
camerata-liveness = { path = "../liveness" }
camerata-rules = { path = "../rules" }
# The clone judge's input is redacted here, so it is safe whichever host assembled the files.
camerata-secrets = { path = "../secrets" }
# `io-util` for AsyncBufReadExt / BufReader in the streaming subprocess path.
tokio = { workspace = true, features = ["io-util"] }
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# Disk-headroom preflight guard before cargo builds (Decision: 2026-06-22_dogfood_disk_safety).
fs2 = { workspace = true }
# Structured logging for the build-artifact janitor's before-deletion audit trail
# (docs/design/2026-07-27_build-artifact-janitor.md) — this crate emits through the
# `tracing` facade like every other crate; only the server binary installs a subscriber.
tracing = { workspace = true }
# Manifest (.camerata/checks.toml) parsing (Decision: 2026-06-22_check_manifest_single_source_of_truth).
toml = "0.8"
# `NaiveDate` for the test-mode expiry recogniser (Firebase rules); already in the lockfile.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# AST extractor layer (Pass 4b-1, D1/D2 — docs/design/2026-07-27_ast-extractor-layer.md).
# `syn` (full AST + visitor) for Rust; `proc-macro2/span-locations` so visited nodes carry
# real line numbers instead of reporting line 0. Native tree-sitter grammars (cc-compiled,
# statically linked — NOT wasm) for TS/TSX, JS, Python. All four version-pinned together;
# the `tree-sitter` runtime and grammar crates must agree on ABI version (the one known
# upgrade foot-gun per the design doc — bump as a set).
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# `ToTokens` for the clone detector's Rust tokenizer (an item's token stream, macro bodies
# included). Already in the lockfile as a `syn` dependency.
quote = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
# Server-side syntax highlighting for the in-app code viewer (`extract::highlight`): the same
# 0.25 tree-sitter family, plus the Rust grammar (Rust parsing elsewhere is `syn`, which has no
# highlight queries). Decision: docs/OVERNIGHT_DECISIONS.md 2026-10-23.
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"

[dev-dependencies]
# subprocess streaming tests (spawn sh to emit lines and verify heartbeat fires).
tempfile = "3"
