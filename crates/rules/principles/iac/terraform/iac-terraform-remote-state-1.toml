id = "IAC-TERRAFORM-REMOTE-STATE-1"
version = 1
title = "Terraform state is kept in a remote backend with locking turned on"
domain = "iac:terraform"
layer = "platform"
enforcement = "structured"
kind = "defect"
inspectable = true
cwe = ["CWE-311"]
# Where this rule can apply, so the scan sends it only with Terraform files. The subject is the
# backend block of a Terraform root configuration.
applies_to = { paths = ["**/*.tf", "**/*.tf.json", "**/*.tfvars", "**/*.tfvars.json"] }
# Severity bounds. Local state leaves secrets in plain text on one machine and an unlocked state
# can be corrupted by two runs at once, but both need a second event to cause harm. Medium at
# least, high at most.
min_severity = "medium"
max_severity = "high"
default = true
verification = "grounded"
qualifies = "Applies to root configurations, the directories where `terraform apply` is run. A reusable module has no backend of its own and is outside the rule, as are example and test directories. A backend can also be supplied at run time through partial configuration (`-backend-config`) or generated by a wrapper such as Terragrunt. When the repository shows that is how the backend is set, the settings are not visible in the Terraform files and the rule is not judged from their absence. The `azurerm` and `gcs` backends lock state natively and so does HCP Terraform, so an explicit locking argument is required only for the `s3` backend. A missing `encrypt = true` on an `s3` backend is not a fault, because Amazon S3 encrypts new objects by default. Whether a state file has been committed cannot be seen from the Terraform files and is outside what this rule judges. No mechanical detector ships for this rule; coverage comes from reading the Terraform files."

[[sources]]
url = "https://developer.hashicorp.com/terraform/language/manage-sensitive-data"
title = "HashiCorp Terraform documentation: Manage sensitive data in your configuration"

[[sources]]
url = "https://developer.hashicorp.com/terraform/language/state/locking"
title = "HashiCorp Terraform documentation: State: Locking"

[[sources]]
url = "https://developer.hashicorp.com/terraform/language/backend/s3"
title = "HashiCorp Terraform documentation: Backend Type: s3 (state locking with the use_lockfile argument; the dynamodb_table argument is deprecated)"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/311.html"
title = "CWE-311: Missing Encryption of Sensitive Data"

[decision]
question = "Where is the Terraform state for each root configuration stored, and is it locked while a run is in progress?"
default = "state-in-a-locking-remote-backend"
why = """
Terraform state records every attribute of every resource it manages, and that includes values
marked sensitive: database passwords, generated keys and tokens are written to state in plain
text. State kept only on a laptop gives those secrets to anyone who can read that machine or its
backups, and nobody else on the team can apply safely. State is also the single record of what
Terraform owns. If two people or two pipeline runs apply at the same time against an unlocked
state, each overwrites the other's record, which can leave real resources that Terraform no
longer knows about or plans to destroy resources that are in use. A remote backend keeps state in
one access controlled place, and locking makes concurrent runs wait instead of corrupting the
record.
"""

[[option]]
id = "state-in-a-locking-remote-backend"
label = "Every root configuration stores its state in a remote backend with locking turned on"
directive = """
Every Terraform root configuration declares a remote backend or an HCP Terraform `cloud` block, so
state never lives only on one machine. An `s3` backend turns on locking with
`use_lockfile = true`. A `dynamodb_table` lock written before that argument existed also counts,
though the argument is deprecated and new configurations use `use_lockfile`.
"""
remediation = """
Add a remote backend to the `terraform` block in `<path>`, for example an `s3` backend with
`use_lockfile = true`. Then run `terraform init -migrate-state` to move the existing state into
it. Verify by confirming `terraform init` reports the remote backend. Then start a second
`terraform plan` while one is running and confirm it reports the state as locked.
"""
effort = "medium"
why = "Remote state keeps the secrets Terraform records off individual machines, and locking stops two runs from corrupting the record of what exists."

[[option]]
id = "state-stored-locally-or-without-locking"
violates = true
label = "Terraform state is stored locally or in a backend without locking"
directive = "A root configuration declares no remote backend, so its state stays on the machine that ran it. The same fault covers an `s3` backend declared without locking."
remediation = """
Add a remote backend to the `terraform` block in `<path>`, for example an `s3` backend with
`use_lockfile = true`. Then run `terraform init -migrate-state` to move the existing state into
it. Verify by confirming `terraform init` reports the remote backend. Then start a second
`terraform plan` while one is running and confirm it reports the state as locked.
"""
effort = "medium"
why = "State kept on one machine holds database passwords, keys and tokens in plain text for anyone who can read that machine or its backups. Without locking, two applies at the same time can overwrite each other's record and leave Terraform planning to destroy or duplicate live resources."
