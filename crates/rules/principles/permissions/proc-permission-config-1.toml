id = "PROC-PERMISSION-CONFIG-1"
version = 3
title = "A missing grant is configuration; a missing permission is code"
domain = "permissions"
layer = "universal"
enforcement = "prose"
kind = "defect"
inspectable = false
default = true
verification = "policy"

[[sources]]
url = "CONVENTIONS.md"
title = "Project policy: a missing grant is fixed by configuration and a missing permission is fixed by code"

[decision]
question = "When someone reports they cannot perform an action, how does the team decide whether the fix is a grant or new code?"
default = "a-missing-grant-is-configuration-a-missing-permission-is-code"
why = "The two failure modes look identical to the person filing the report ('I cannot do X'), but they have different fixes and different reviewers. Triaging by which category the gap falls into routes the work to the right tool and the right person, instead of defaulting to a code change because that is what engineers reach for first. Treating every access gap as a code change multiplies handoffs: every config-only issue gets a PR and a deploy when a single grant would have sufficed. Treating every access gap as a configuration change overlooks undefined permissions: ad-hoc grants get added without the schema or code to back them, drifting from the system's actual model."

[[option]]
id = "a-missing-grant-is-configuration-a-missing-permission-is-code"
label = "A missing grant is configuration; a missing permission is code"
directive = "When an access gap is reported, classify it before reaching for code. If the underlying permission already exists in the schema and the gap is that the role or user does not have it granted, the fix is a configuration change. The tool for making the grant varies by system (an admin UI when one exists, configuration-as-code, a role-seed migration, or a direct write to the role-permission table when no higher-level tool is available); the principle is just that this is configuration, not engineering work. If the underlying permission does not exist in the schema at all, the fix is code: the permission has to be defined and the migration that adds it has to seed grants for applicable roles."
remediation = """
Check whether the underlying permission already exists in the schema before opening a code change. If it exists and the gap is only that a role or user lacks the grant, make the grant through the admin UI or configuration tool instead of filing a PR; only write code when the permission itself doesn't exist yet. Verify by confirming the access gap is closed through a configuration change with no deploy, when the permission was already defined.
"""
why = "The two failure modes look identical to the person filing the report ('I cannot do X'), but they have different fixes and different reviewers."

# Design note (item 19, 2026-10-28): this rule previously carried two more `[[option]]`s,
# `every-access-gap-is-treated-as-a-code-change-acc` and
# `every-access-gap-is-treated-as-a-configuration-c`, both flagged `violates = true`. The rule is
# `inspectable = false` (pinned with its reason in w16_inspectable_gate.rs: compliance is how
# humans route reports, which no working-tree scan can see), so it is removed before arming and
# the flags could never fire. Of the two declarations, `inspectable = false` is the correct one;
# the flagged options were dead machinery and were removed. The rule stays `kind = "defect"`,
# because one triage practice is correct and both alternatives are faults; their rationale is
# stated in full in `[decision].why`. The rule still emits its directive to CONVENTIONS.md.
