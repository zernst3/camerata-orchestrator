id = "SUPABASE-EXPOSURE-MATVIEW-1"
version = 3
title = "A materialized view in an API-exposed schema cannot be row-secured; its exposure is all-or-nothing"
domain = "supabase:exposure"
layer = "platform"
enforcement = "structured"
kind = "defect"
inspectable = true
# Token-efficiency rank 7: where this rule can apply, so the scan sends it only with these files.
# SQL statement rule: the subject is CREATE POLICY / FUNCTION / VIEW / TABLE statements. They live in
# SQL files and migration folders, and also inside TypeORM / Knex / Alembic / Rails / sqlx migrations in
# other languages, which the `contains_any` markers catch wherever the file sits.
applies_to = { paths = ["**/*.sql", "**/migrations/**", "**/migrate/**", "**/migration/**", "**/db/**", "**/database/**", "**/schema/**", "**/schemas/**", "**/seeds/**", "**/*seed*", "**/alembic/**", "**/supabase/**", "**/*.psql", "**/*.pgsql", "**/*.ddl"], contains_any = ["create policy", "alter policy", "drop policy", "row level security", "security definer", "security invoker", "create or replace function", "create function", "create or replace procedure", "create procedure", "create view", "create or replace view", "create materialized view", "grant ", "alter table", "storage.objects", "auth.users", "search_path"] }
# Severity ceiling. Rationale: a rollup or aggregate materialized view is often genuinely meant
# to be public, so the exposure fact alone can never justify an automatic critical — the reader
# has to judge whether this view's all-or-nothing contents are appropriate for public access.
max_severity = "high"
# Severity floor. Rationale: Postgres gives materialized views no per-row policy hook at all, so
# an exposed one is unconditionally unscopeable — there is no partial remediation and no weaker
# reading of the fact. Floor and ceiling are both high: this rule is pinned at exactly high.
min_severity = "high"
default = true
verification = "grounded"
qualifies = "Enforced by a statement scan for CREATE MATERIALIZED VIEW targeting an API-exposed schema (public by default, or per SUPABASE-EXPOSURE-SCHEMAS-1's config parse). Postgres materialized views do not support Row Level Security at all — there is no policy mechanism to apply, so any exposed materialized view grants either full access to its contents or none. Conformance holds when materialized views are kept out of exposed schemas (moved to a non-exposed schema and accessed only through a RLS-capable wrapper, e.g. a security_invoker view or a function) or are deliberately, reviewably intended as fully public data."

[[sources]]
url = "https://supabase.com/docs/guides/database/database-advisors?lint=0016_materialized_view_in_api"
title = "Supabase Database Linter — 0016_materialized_view_in_api (\"Materialized view exposed in API\")"
linter = "splinter: materialized_view_in_api"

[decision]
question = "Does any materialized view sit in an API-exposed schema, where Postgres can apply no row-level security to it?"
default = "flag-exposed-materialized-views"
why = """
Row Level Security policies attach to TABLES and (via security_invoker) ordinary VIEWS — Postgres
provides no equivalent mechanism for MATERIALIZED views, which are physically-stored snapshots
with no per-row policy hook at all. This is Splinter's materialized_view_in_api lint (0016,
confirmed against the live database-advisors page): once a materialized view is reachable through
PostgREST, there is no way to scope which rows a given caller sees — it is either fully open to
whatever role can query it, or not exposed at all. This differs structurally from
SUPABASE-RLS-VIEW-INVOKER-1 (ordinary views, which CAN be fixed with security_invoker) — a
materialized view has no equivalent fix short of moving it out of the exposed schema or wrapping
its data behind a RLS-capable interface.

Because the finding is unconditional given the exposure fact (there is no partial-remediation
option beyond removing exposure or wrapping the data differently), the report should name the
specific materialized view and let the reader judge whether its (necessarily all-or-nothing)
content is appropriate for public access — often a rollup/aggregate view is genuinely meant to be
public, so this ships as a high-severity finding for review, not an automatic critical.
"""

[[option]]
id = "flag-exposed-materialized-views"
label = "Materialized views stay out of API-exposed schemas unless their full contents are meant to be public"
directive = """
Row Level Security attaches to tables and, through `security_invoker`, to ordinary views. Postgres
offers no equivalent for MATERIALIZED views: they are stored snapshots with no per-row policy hook,
so one reachable through PostgREST is either entirely readable by whatever role can query it or not
exposed at all. There is no middle setting to configure. Materialized views therefore live in a
schema that is not listed in `supabase/config.toml`'s `[api] schemas`, and anything the API needs
from them is read through a thin `security_invoker` view or a SECURITY DEFINER function that applies
its own row-scoping first. The exception is deliberate: a rollup or aggregate whose every row is
genuinely meant to be public can stay exposed, as a choice someone made rather than a default.
"""
remediation = """
Move `<matview>` to a schema that is NOT listed in `supabase/config.toml`'s `[api] schemas`, then
create a thin `security_invoker` view (or a SECURITY DEFINER function with its own row-scoping
check) in an exposed schema that reads from it, so RLS applies at that layer. If every row in
`<matview>` is genuinely meant to be public, no change is needed beyond confirming that
intentionally. Verify by confirming `<matview>` itself is no longer directly reachable through
the PostgREST API (only the wrapping view/function is).
"""
why = "The finding is unconditional given the exposure fact — there is no RLS mechanism a materialized view could adopt — so naming every instance and explaining the structural limitation is the correct, honest framing rather than a probabilistic guess."

