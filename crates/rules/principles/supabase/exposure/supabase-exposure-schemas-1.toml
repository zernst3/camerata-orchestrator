id = "SUPABASE-EXPOSURE-SCHEMAS-1"
version = 3
title = "Extra PostgREST-exposed schemas widen the API surface to tables that may never have been RLS-reviewed"
domain = "supabase:exposure"
layer = "platform"
enforcement = "structured"
kind = "defect"
inspectable = true
# Token-efficiency rank 7: where this rule can apply, so the scan sends it only with these files.
# Config rule: the subject is a value in supabase/config.toml (or the Terraform that sets it); a
# finding needs the value to be present and wrong.
applies_to = { paths = ["**/supabase/config.toml", "**/*.tf", "**/*.hcl"] }
# Severity floor. Rationale: an extra exposed schema widens the PostgREST surface to tables the
# team may still assume are unreachable, but it is a review prompt rather than a demonstrated
# exposure — whether those tables actually lack RLS is the neighbouring rules' question. Medium.
min_severity = "medium"
default = true
verification = "grounded"
qualifies = "Enforced by a config scan: the `[api] schemas = [...]` list in supabase/config.toml (default `[\"public\", \"storage\", \"graphql_public\"]`, per Supabase's own CLI config reference). Any schema named beyond the default set widens the tables reachable through PostgREST. This rule's parse result feeds every other supabase/rls/* and supabase/exposure/* rule's exposed-schema set — it is the source of truth for 'is this table/view/function API-reachable' rather than any rule hardcoding `public`. Conformance holds when the schemas list is either the default or every additional schema listed has been deliberately reviewed for RLS coverage on its tables."

[[sources]]
url = "https://supabase.com/docs/guides/api/using-custom-schemas"
title = "Supabase docs — Using custom schemas: exposing an additional schema via the API settings 'Exposed schemas' list"

[[sources]]
url = "https://supabase.com/docs/guides/cli/config"
title = "Supabase docs — CLI config reference: [api] schemas in supabase/config.toml"

[decision]
question = "Has every schema listed in [api] schemas beyond the default set been reviewed for RLS coverage on its tables?"
default = "flag-non-default-exposed-schemas-and-feed-scope"
why = """
Supabase's CLI config reference documents `[api] schemas` directly as "Schemas to expose in your
API. Tables, views and functions in this schema will get API endpoints," defaulting to
`["public", "storage", "graphql_public"]`. Every schema added to that list gets a PostgREST
endpoint for every table, view, and function inside it — the same access surface `public` has by
default, extended to tables that the rest of the team (and this scan's other rules) may still
implicitly assume are `public`-only. A team that adds a second schema for a new feature and never
mentally re-applies "does everything in here have RLS" has silently widened its attack surface
without a corresponding review step.

This rule has a load-bearing SECOND job beyond its own finding: its parse of `[api] schemas`
supplies the exposed-schema SET that SUPABASE-RLS-ENABLED-1, SUPABASE-RLS-POLICY-DISABLED-1,
SUPABASE-RLS-NO-POLICY-1, SUPABASE-RLS-VIEW-INVOKER-1, SUPABASE-AUTH-USERS-EXPOSED-1, and
SUPABASE-EXPOSURE-MATVIEW-1 all consume — none of those rules should hardcode `public` as the only
exposed schema; they should read this rule's parsed schema list instead, so a project with a
custom-schemas setup gets correctly-scoped findings across the whole group rather than false
negatives on tables in a second exposed schema.
"""

[[option]]
id = "flag-non-default-exposed-schemas-and-feed-scope"
label = "Every schema exposed through the API beyond the default set has been reviewed for RLS coverage"
directive = """
`[api] schemas` in `supabase/config.toml` lists the schemas PostgREST serves, defaulting to
`["public", "storage", "graphql_public"]`. Every schema added beyond that default gets an API
endpoint for every table, view and function inside it — the same reachability `public` has. So
adding one is paired with the review that goes with it: each table in the new schema has Row Level
Security enabled and policies held to the same standard as the `public` tables, rather than
inheriting an assumption, made when `public` was the only exposed schema, that nothing in here is
reachable. A schema that was exposed by accident is removed from the list instead.
"""
remediation = """
Either remove `<schema>` from the `[api] schemas` list in `supabase/config.toml` if it was
exposed unintentionally, or, if it needs to stay exposed, review every table in `<schema>` and
confirm each has Row Level Security enabled with policies that match the same standard as your
`public` schema tables. Verify by re-checking `supabase/config.toml`'s `[api] schemas` list
reflects only the schemas you intend PostgREST to serve.
"""
why = "A widened API surface via extra exposed schemas is a real, repo-detectable risk in its own right, and using this rule's parse as the single source of truth for 'what counts as exposed' keeps every other rule in the group correctly scoped instead of each independently (and inconsistently) assuming public is the only exposed schema."

# Design note (W22, 2026-10-20): this rule previously carried a second `[[option]]`
# describing a REJECTED scanner/corpus design, not a client-code state. Removed — a
# single-option defect is the right shape here, the fault is the absence of the option
# above. The rejected design was: " this produces false negatives on any project using Supabase's documented custom-schemas feature — a table in a legitimately-exposed second schema with no RLS would be silently skipped by every RLS r

