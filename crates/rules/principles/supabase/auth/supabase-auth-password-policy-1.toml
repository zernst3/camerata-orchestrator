id = "SUPABASE-AUTH-PASSWORD-POLICY-1"
version = 2
title = "Production projects set a minimum password length and a required character mix, rather than accepting the permissive default"
domain = "supabase:auth"
layer = "platform"
enforcement = "structured"
kind = "defect"
inspectable = true
# Severity floor. Rationale: this rule has TWO branches of unequal weight, and the floor is set
# to the LOWER of them because it is the only value that cannot inflate either. A missing or
# sub-8 `minimum_password_length` accepts a bare numeric PIN and is the high-severity branch; an
# unset or digits-only `password_requirements` is the medium one. A floor of high would silently
# raise the character-mix branch the author deliberately placed below it.
min_severity = "medium"
default = true
verification = "grounded"
qualifies = "Enforced by a scan over supabase/config.toml's `[auth] minimum_password_length` and `[auth] password_requirements` fields (the CLI's local names for the project's password-strength settings, pushed to the dashboard's Auth > Policies configuration via `supabase config push`). Conformance holds when `minimum_password_length` is at least 8 and `password_requirements` requires more than digits-only; it fails when `minimum_password_length` is absent/below 8, or `password_requirements` is unset/the weakest available option, with no accompanying evidence of an equivalent dashboard-set policy the repo cannot see."

[[sources]]
url = "https://supabase.com/docs/guides/auth/password-security"
title = "Supabase docs: Password Security: minimum length (8+ recommended), required character classes, and HaveIBeenPwned-backed leaked-password protection"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/521.html"
title = "CWE-521: Weak Password Requirements"

[decision]
question = "Does the project's auth configuration set a minimum password length of at least 8 characters and require more than digits alone, rather than leaving the permissive default in place?"
default = "set-minimum-length-and-character-requirements"
why = """
Supabase's own password-security guidance states an 8-character floor directly — 'anything less than 8 characters
is not recommended' — and separately exposes a `password_requirements` policy that can require a mix of lowercase,
uppercase, digits, and symbols rather than accepting any string of the minimum length. Left unset, a project accepts
short, low-entropy passwords (a bare numeric PIN satisfies a length-only or no-length-floor policy), which is
CWE-521 (Weak Password Requirements) — the credential-stuffing and brute-force risk this class of weakness
describes applies to Supabase Auth exactly as it would to any other password store.

This rule scopes to the two settings a repo scan can actually observe (`minimum_password_length`,
`password_requirements` in config.toml, pushed via the CLI). Supabase also offers leaked-password protection backed
by the HaveIBeenPwned Pwned Passwords API — a strong complementary control that rejects known-compromised
passwords outright — but it is a Pro-plan-and-above feature configured in the dashboard with no config.toml
representation at all, so a repo scan has no artifact to check it against; this rule's directive mentions it as a
recommended addition without asserting its absence as a finding, since there is nothing in the repository to assert
that from.
"""

[[option]]
id = "set-minimum-length-and-character-requirements"
label = "Passwords must be at least 8 characters and mix more than digits alone"
directive = """
The `[auth]` section of `supabase/config.toml` sets `minimum_password_length` to at least 8 (the
floor Supabase's own password-security guidance states), and sets `password_requirements` to demand
more than digits alone, so a bare numeric PIN cannot satisfy the policy. Both settings are pushed to
the project rather than left at whatever the scaffold allowed. Where the plan supports it,
leaked-password protection (HaveIBeenPwned-backed) is enabled as well; it is configured in the
dashboard with no representation in config.toml, so it is confirmed there directly rather than read
from the repository.
"""
remediation = """
In supabase/config.toml, set `minimum_password_length = 8` (or higher) and `password_requirements` to require at
least lowercase, uppercase, and digit characters (symbols optional depending on your UX tolerance), then push the
change to your project. If your plan supports it, also enable leaked-password protection in the dashboard's Auth >
Policies settings. Verify by attempting to sign up with a short or digits-only password and confirming it is
rejected.
"""
effort = "low"
why = "Supabase's own documentation states the 8-character floor and character-mix requirement directly; leaving the permissive default in place accepts low-entropy passwords that are the first thing a credential-stuffing or brute-force attempt exploits, for no benefit beyond skipping a one-line config change."

[[option]]
id = "accept-the-permissive-default-password-policy"
violates = true
label = "Password length and character requirements are unset, so short or digits-only passwords are accepted"
directive = "Neither `minimum_password_length` nor `password_requirements` is configured, so the project accepts whatever the permissive default allows, including passwords under 8 characters and passwords made of digits alone."
why = "Rejected: this is a one-line config change with no legitimate offsetting benefit (it does not improve conversion meaningfully over an 8-character floor, and most users' passwords already exceed it) against a well-documented, high-frequency attack surface: short or low-entropy passwords are the first thing credential-stuffing and brute-force tooling targets."
