id = "SUPABASE-AUTH-SERVICE-ROLE-BYPASS-1"
title = "A service_role-backed client used in a user-reachable request handler must re-implement authorization explicitly"
domain = "supabase:auth"
layer = "platform"
enforcement = "prose"
kind = "defect"
inspectable = true
# Severity floor. Rationale: service_role carries BYPASSRLS, so on that code path the handler IS
# the entire access-control layer. A missing check there is not a weaker version of an RLS gap,
# it is the complete absence of authorization on a user-reachable path — CWE-862. High.
min_severity = "high"
default = true
verification = "grounded"
qualifies = "Whether a user-reachable handler that constructs a service_role client also performs an explicit authorization check is a semantic judgment — it requires reading the handler's control flow, not matching a pattern — so this rule routes to the prose tier: the handler body and the client-construction call site are fed to Claude as evidence. Conformance holds when every such handler validates that the calling user is entitled to the specific action/row being performed before delegating to the service_role client; it fails when the handler trusts the caller's request parameters directly, since service_role bypasses RLS entirely and no database-level backstop exists on that path."

[[sources]]
url = "https://supabase.com/docs/guides/api/api-keys"
title = "Supabase docs — API keys: the service_role (secret) key bypasses Row Level Security and must never be exposed to end users"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/862.html"
title = "CWE-862: Missing Authorization"

[decision]
question = "Must a user-reachable request handler that uses a service_role-backed Supabase client implement its own explicit authorization check?"
default = "require-explicit-authz-on-service-role-paths"
why = """
Supabase documents service_role as a role that, by design, "has full access to your project's
data" and skips "any and all Row Level Security policies" (it carries the BYPASSRLS attribute).
That is the correct behavior for trusted server-side jobs (migrations, admin tooling, scheduled
tasks) — but the instant a service_role-backed client is constructed inside a handler that a
regular end user can reach (an API route, a server action, an Edge Function invoked from the
client), the database's entire access-control layer is switched off for that code path. Whatever
authorization the RLS policies would have enforced must now be re-implemented BY HAND in that
handler, because there is no other backstop. Skipping that re-implementation is CWE-862 (Missing
Authorization): the handler performs the action without checking whether the caller is entitled to
it.

This judgment cannot be expressed as a regex: "does this handler check that the request's user id
matches the row's owner before calling the service_role client" requires reading the handler's
actual logic, not just detecting that a service_role client exists in the file. The rule is
therefore prose-tier: the flag ("a user-reachable handler constructs a service_role client") is
cheap to detect, but the judgment is routed to Claude with the handler source and the
client-construction site as evidence, producing either "no authorization check found" (high
severity) or a description of the check that exists.
"""

[[option]]
id = "require-explicit-authz-on-service-role-paths"
label = "Every user-reachable handler that uses a service_role client performs its own authorization check"
directive = """
Any handler a regular end user can reach — an API route, a server action, an Edge Function — that
constructs or receives a service_role-backed Supabase client validates the caller's entitlement to
the specific action and row before performing it. service_role carries BYPASSRLS: the moment that
client is used, every Row Level Security policy that would have constrained the request stops
applying, and the handler's own logic becomes the only access control on that path. So the check
the policies would have made is made explicitly here instead — confirm the session identifies a
specific user, then confirm that user is entitled to the exact row or action requested. "It runs on
the server" is not that check; it answers only whether the key itself is reachable from the browser.
"""
remediation = """
In `<file>`, add an explicit authorization check before the service_role client performs its
privileged operation — confirm the caller's session identifies a specific user, then verify that
user is entitled to the exact row/action being requested (RLS will not do this for you on a
service_role connection). Verify by confirming a request from a legitimate but unentitled user
(e.g. one user trying to act on another user's data) is now rejected.
"""
why = "service_role bypassing RLS means the handler itself IS the entire access-control layer for that request; a missing check there is not a lesser version of an RLS gap, it is a complete absence of authorization on that path."

[[option]]
id = "trust-service-role-usage-in-any-server-side-code"
violates = true
label = "Service_role handlers treat running on the server as their authorization and check no caller entitlement"
directive = "User-reachable handlers construct a service_role client and act on it with no check of who is calling: being server-side code, rather than an explicit entitlement check, is what the handler relies on."
why = "Rejected: 'runs on the server' answers the SUPABASE-KEY-SERVICE-ROLE-CLIENT-1 exposure question (is the secret itself reachable by the browser) but says nothing about whether the SERVER CODE checks who is calling it before acting with full privileges on their behalf. A server-side handler with no auth check still lets any authenticated (or even unauthenticated) caller trigger service_role-privileged actions against arbitrary rows; conflating 'server-side' with 'authorized' is the exact gap this rule exists to close."
