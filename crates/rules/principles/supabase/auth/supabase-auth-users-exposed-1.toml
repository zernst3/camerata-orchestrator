id = "SUPABASE-AUTH-USERS-EXPOSED-1"
version = 2
title = "auth.users must never be exposed to anon/authenticated via a view, materialized view, or grant in an exposed schema"
domain = "supabase:auth"
layer = "platform"
enforcement = "structured"
kind = "defect"
inspectable = true
# Token-efficiency rank 7: where this rule can apply, so the scan sends it only with these
# files. SQL statement rule: it is about CREATE POLICY / FUNCTION / VIEW / TABLE statements in SQL files (plus supabase/config.toml, which names the API-exposed schemas); no other file kind holds the subject.
applies_to = { paths = ["**/*.sql", "**/supabase/config.toml"] }
# Severity floor. Rationale: there is no partial-exposure form of this defect. auth.users holds
# every account's email, phone and metadata, so ANY reference to it from an API-exposed object is
# a full account-directory leak through PostgREST — and the correct pattern (a curated
# application-owned profiles table) exists precisely to avoid it. Critical, with no carve-out.
min_severity = "critical"
default = true
verification = "grounded"
qualifies = "Enforced by a statement-granular scan for SQL referencing auth.users inside a CREATE VIEW, CREATE MATERIALIZED VIEW, or GRANT statement whose target object lives in an API-exposed schema (public by default, or per SUPABASE-EXPOSURE-SCHEMAS-1). auth.users carries every account's email, phone number, and metadata; exposing any of it through PostgREST is a full account-directory leak. Conformance holds when no exposed-schema object selects from or grants access to auth.users directly — legitimate app-level user data belongs in an application-owned public.profiles-style table populated via trigger, never a direct view over auth.users."

[[sources]]
url = "https://supabase.com/docs/guides/database/database-advisors?lint=0002_auth_users_exposed"
title = "Supabase Database Linter — 0002_auth_users_exposed (\"User data exposed through a view\")"
linter = "splinter: auth_users_exposed"

[decision]
question = "Does any view, materialized view, or grant in an API-exposed schema read from auth.users directly?"
default = "flag-any-exposed-auth-users-reference"
why = """
auth.users is Supabase's own internal identity table — it holds every user's email, phone number,
and raw_user_meta_data, none of which is meant to be readable through the public API surface. A
view or materialized view defined in an exposed schema that selects from auth.users (commonly
created so app code can "join user info" conveniently) or a GRANT that hands anon/authenticated
direct SELECT on auth.users itself makes the entire user directory readable through PostgREST —
this is Splinter's auth_users_exposed lint (0002, confirmed against the live database-advisors
page: "User data exposed through a view... inadvertently expose personal information"). There is
no partial-exposure version of this finding that is acceptable: any reference from an exposed
object to auth.users is a full account-list leak, so it ships as an unconditional critical with no
needs_review carve-out.

The correct pattern (which the finding's remediation text should point at) is a separate,
application-owned public.profiles table (or similar), populated by a trigger on auth.users insert,
exposing only the columns the application actually needs to share — never a live view over the
auth schema itself.
"""

[[option]]
id = "flag-any-exposed-auth-users-reference"
label = "No API-exposed view, materialized view, or grant reads from auth.users"
directive = """
Nothing in an API-exposed schema selects from `auth.users` or grants access to it. That table is
Supabase's internal identity store — every account's email, phone number and `raw_user_meta_data` —
and any exposed object reading it makes the whole user directory readable through PostgREST, which
is a full account-list leak rather than a partial one. Where the application needs user information
of its own, it keeps an application-owned table (a `public.profiles` or similar) populated by a
trigger on `auth.users` inserts, exposing only the specific columns the product actually shares.
Convenience joins "to get user info" are written against that table, never against the auth schema.
"""
remediation = """
Drop or restrict the exposed-schema object referencing `auth.users` in `<file>`. Replace it with
an application-owned `public.profiles` table, populated by a trigger on `auth.users` inserts,
that exposes only the specific non-sensitive columns your app actually needs (never email or
other identifying fields unless the feature requires them). Verify by confirming no exposed-schema
view, materialized view, or grant references `auth.users` directly anymore.
"""
why = "There is no legitimate reason for an exposed-schema object to reference auth.users directly — the correct pattern (a curated profiles table) exists precisely to avoid this, so an unconditional critical with no carve-out is the right severity."

[[option]]
id = "allow-column-restricted-views-over-auth-users"
violates = true
label = "An API-exposed view reads from auth.users but limits its column list to non-identifying fields such as id"
directive = "An exposed-schema view selects from `auth.users` with its column list restricted to non-identifying fields such as `id`, on the basis that no email, phone or metadata column is included."
why = "Rejected: even an id-only view over auth.users still confirms which UUIDs exist as real accounts (an enumeration primitive) and, more importantly, is a fragile pattern that silently widens the moment someone adds `select *` or another column to the same view later — a change a reviewer is unlikely to recognize as security-relevant since the view already existed. The application-owned profiles-table pattern achieves the same legitimate need (referencing a user by id) without ever exposing the auth schema itself."
