id = "SUPABASE-AUTH-EDGE-JWT-1"
version = 2
title = "An Edge Function with JWT verification disabled must have a compensating auth check in the function body"
domain = "supabase:auth"
layer = "platform"
enforcement = "mechanical"
kind = "defect"
inspectable = true
# Severity ceiling. Rationale: `verify_jwt = false` is a legitimate, Supabase-documented pattern
# for public webhook receivers and intentionally public endpoints, so the finding can never be
# an unconditional critical — that would be a false positive on every correctly-built webhook
# handler. High is the ceiling for the genuinely uncompensated case; a function with a real
# compensating check is informational, below the ceiling and unaffected by it.
max_severity = "high"
default = true
verification = "grounded"
qualifies = "Two-stage rule. Stage one (mechanical, always emitted): a regex scan over supabase/config.toml for a `[functions.<name>]` block setting `verify_jwt = false`, and over deploy scripts/CI for `--no-verify-jwt` on the CLI — this flag detection is near-zero-FP and fires unconditionally whenever the setting is present. Stage two (prose, evidence-fed): whether the function body implements its OWN compensating auth check is a semantic judgment not expressible as a regex, so the mechanical finding is escalated to prose review with the function source attached as evidence. Conformance holds when every verify_jwt = false function either legitimately needs to be public (a genuinely unauthenticated endpoint, e.g. a public webhook receiver that verifies the provider's own signature) or implements an equivalent auth check inline; it fails when the flag is off with no compensating check and no documented reason."

[[sources]]
url = "https://supabase.com/docs/guides/functions/auth"
title = "Supabase docs: Edge Functions auth guide (verify_jwt default and disabling it for public/webhook functions)"

[[sources]]
url = "https://supabase.com/docs/guides/cli/config"
title = "Supabase docs: CLI config reference (functions.<name>.verify_jwt in supabase/config.toml)"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/306.html"
title = "CWE-306: Missing Authentication for Critical Function"

[decision]
question = "When an Edge Function disables JWT verification (verify_jwt = false / --no-verify-jwt), does the function body implement its own compensating authentication check?"
default = "mechanical-flag-plus-prose-escalation"
why = """
Supabase Edge Functions default to `verify_jwt = true`, which rejects any request without a valid
JWT before the handler code ever runs. Setting `verify_jwt = false` (per-function, in
`supabase/config.toml`'s `[functions.<name>]` block, or via `--no-verify-jwt` at deploy time) is a
legitimate, documented pattern for genuinely public endpoints — Stripe/webhook receivers that
verify the provider's own signature instead, or endpoints meant to be called by unauthenticated
visitors. It is also the single most common accidental-exposure shape in a vibe-coded functions
directory: a developer disables the flag to get past a local development friction point (or an AI
coding assistant does it to make a demo "just work") and never adds anything in its place.

The flag itself (verify_jwt = false present) is a mechanical, near-zero-FP fact — a config regex.
Whether the function body implements an equivalent check (validating a webhook signature, checking
a shared secret, or intentionally requiring nothing because the endpoint is meant to be public) is
a SEMANTIC judgment that no regex can make reliably: it requires reading the function's control
flow. This rule therefore always emits the mechanical flag finding, and separately routes the
flagged function's source to prose evaluation with the flag as evidence, so the report can say
either "this function has no compensating check" (high severity) or "this function is disabled by
design and verifies X instead" (informational, not a finding).
"""

[[option]]
id = "mechanical-flag-plus-prose-escalation"
label = "Every Edge Function that disables JWT verification authenticates callers itself, or is deliberately a public endpoint"
directive = """
Edge Functions keep Supabase's `verify_jwt = true` default, which rejects any request without a
valid JWT before the handler runs. Where a function genuinely needs to accept unauthenticated
requests (a webhook receiver, a deliberately public endpoint) `verify_jwt = false` is set for
that one function in `supabase/config.toml`'s `[functions.<name>]` block (or `--no-verify-jwt` at
deploy time) AND the handler performs its own check in place of the one it turned off: verifying
the calling provider's webhook signature, checking a shared secret, or documenting that the
endpoint is intentionally open to anyone. Disabling verification to get past a local development
friction point, and leaving nothing in its place, means the function accepts requests from anyone
on the internet with no check of any kind.
"""
remediation = """
Re-enable `verify_jwt` for `<function-name>` in supabase/config.toml, or add an explicit
authenticated-user check (e.g. verify `auth.uid()` is present) at the top of the handler. Verify
by confirming the function rejects an unauthenticated request with 401.
"""
effort = "medium"
why = "Splitting mechanical evidence-gathering (the flag, which is deterministic and cheap) from the semantic judgment (does the body compensate, which needs an LLM reading real control flow) gives the report both completeness (every disabled-verification function is looked at) and precision (only genuinely uncompensated functions get the high-severity framing)."

[[option]]
id = "edge-function-disables-jwt-without-compensating-check"
violates = true
label = "An Edge Function disables JWT verification and its handler performs no compensating auth check"
directive = "An Edge Function sets `verify_jwt = false` (or deploys with `--no-verify-jwt`) and its handler body performs no equivalent check of its own (no verified signature, no shared-secret check, no explicit authenticated-user gate) so it accepts requests from anyone on the internet."
why = "Rejected: a function with JWT verification off and nothing in its place is unauthenticated by definition. The deliberately-public case (a webhook that validates the provider's own signature instead) carries that check inline; this is the case where nothing does."
