id = "SUPABASE-FUNC-PRIVILEGED-NO-AUTHZ-1"
version = 1
title = "A SECURITY DEFINER function that writes data and is granted EXECUTE to anon/public/authenticated must check caller identity/role/ownership before writing"
domain = "supabase:database-functions"
# General Postgres/PostgREST, not just Supabase: a SECURITY DEFINER function that performs a write
# and is reachable by a broad role with no caller-identity check is exploitable in any Postgres
# database exposed through PostgREST (or any RPC layer that calls functions on the caller's
# behalf), whether or not the repo also uses Supabase's folder layout. `extra_domains` is the
# general mechanism (identical to this folder's siblings SUPABASE-FUNC-SEARCH-PATH-1 and
# SUPABASE-FUNC-DYNAMIC-SQL-INJECTION-1): this rule stays filed under supabase/database-functions/
# (keeping its existing supabase:* grouping/behavior), but ALSO matches any repo whose stack
# carries the `sql` domain.
extra_domains = ["sql"]
layer = "platform"
enforcement = "architectural"
kind = "defect"
inspectable = true
# Severity floor. Rationale: a mutating SECURITY DEFINER function reachable by a broad role with
# no identity check is a privilege-escalation primitive — the RLS that would gate the write is
# bypassed by the DEFINER privileges, and nothing inside the function replaces it (CWE-862). High,
# and deliberately no ceiling: a privileged write with no authorization at all can warrant more.
min_severity = "high"
default = true
verification = "grounded"
qualifies = "Enforced by a statement-splitter-aware scan over CREATE FUNCTION/PROCEDURE bodies correlated against GRANT EXECUTE statements anywhere in the same scanned SQL corpus (the same cross-file correlation SUPABASE-FUNC-DYNAMIC-SQL-INJECTION-1 already depends on): a function declared SECURITY DEFINER, whose body contains a standalone INSERT/UPDATE/DELETE/TRUNCATE/MERGE statement, that is GRANTed EXECUTE to anon/public/authenticated, and whose body contains none of the recognized authorization-predicate idioms (auth.uid()/auth.jwt()/current_user/session_user/a JWT-claims read, a role-or-ownership-check function CALL, or a shared-secret/signature comparison) is flagged. This is deterministic once a function body is isolated as a whole and its signature/grants are known facts about the same scanned corpus, and the match-set has a documented, bounded false-negative surface (a predicate's mere presence is accepted as evidence of gating, without verifying it actually guards the write) rather than an unbounded false-positive one — making this a floor-tier candidate on the same statement-splitter infrastructure its siblings already depend on. Conformance holds when every mutating SECURITY DEFINER function reachable by a broad grant checks the caller's identity, role, or ownership (or a shared-secret/signature) before writing."

[[sources]]
url = "https://cwe.mitre.org/data/definitions/862.html"
title = "CWE-862: Missing Authorization"

[[sources]]
url = "https://owasp.org/www-project-application-security-verification-standard/"
title = "OWASP Application Security Verification Standard (ASVS) — V4 Access Control"

[[sources]]
url = "https://supabase.com/docs/guides/database/functions#security-definer-vs-invoker"
title = "Supabase docs — Database Functions: SECURITY DEFINER runs with the privileges of the user that created it, bypassing the caller's own row-level security"

[decision]
question = "Must a SECURITY DEFINER function that writes data and is granted EXECUTE to anon/public/authenticated check the caller's identity, role, or ownership (or a shared secret) before writing?"
default = "require-authz-predicate-in-privileged-mutating-functions"
why = """
Supabase's own documentation is explicit about the mechanism this rule targets: a SECURITY
DEFINER function "runs with the privileges of the user that created it," which means it executes
with elevated privileges regardless of who calls it and regardless of row-level security policies
that would otherwise constrain the caller directly. That is precisely the shape CWE-862 (Missing
Authorization) describes: a privileged operation performed without a server-side check that the
requester is entitled to perform it. When such a function is additionally GRANTed EXECUTE to
`anon`, `public`, or `authenticated` — Supabase/PostgREST's own broad, unauthenticated-or-any-
authenticated-caller roles — it is reachable directly over the PostgREST RPC endpoint by any
caller matching that grant. A mutating SECURITY DEFINER function with no identity/role/ownership
check inside its own body is therefore a privilege-escalation primitive: the row-level security
policies that would normally gate a write never run (the DEFINER's privileges bypass them), and
nothing inside the function substitutes for that missing gate.

A UI/client-side check is never a substitute for this: OWASP ASVS's access-control chapter (V4)
requires that access-control decisions be enforced on a trusted service layer, not trusted to the
client — and PostgREST's RPC endpoint reaches the function directly regardless of what any UI
does or does not render.

Three shapes are deliberately treated as satisfying this requirement because they are genuine
server-side authorization controls, even though only the first is a classic "role or ownership"
check: a session/JWT identity read (`auth.uid()`, `auth.jwt()`, `current_user`, `session_user`, a
`request.jwt` claims read) compared against an owner/role column; a call to a role/ownership/
permission-check function (`has_role(...)`, `is_owner(...)`, `check_permission(...)`); or a
caller-supplied shared secret/signature compared against a stored or configured value (a webhook-
style compensating control, where the secret itself — never visible to the UI — is what
authorizes the call). A function gated by any of these is not the defect this rule targets.
"""

[[option]]
id = "require-authz-predicate-in-privileged-mutating-functions"
label = "A SECURITY DEFINER function that writes, and is granted to a broad role, checks the caller before writing"
directive = """
A SECURITY DEFINER function executes with its creator's privileges whoever calls it, so the Row
Level Security policies that would gate a write never run. When such a function performs an
INSERT, UPDATE, DELETE, TRUNCATE or MERGE and is granted EXECUTE to `anon`, `public` or
`authenticated` — roles reachable straight from the PostgREST RPC endpoint — its own body carries
the authorization check, as the first statement, before the write. Three shapes satisfy that, all
genuine server-side controls: a session or JWT identity read (`auth.uid()`, `auth.jwt()`,
`current_user`, `session_user`, a `request.jwt` claims read) compared against an owner or role
column; a call to a role, ownership or permission-check function; or a caller-supplied shared
secret or signature compared against a stored value, as a webhook-style control where the secret
itself is what authorizes. Where no end-user role should be able to invoke the function at all,
the grant is revoked instead and the function is called only from a trusted server-side path.

A check in the UI is not one of these. Access-control decisions are enforced on the server, and the
RPC endpoint reaches the function regardless of what any interface renders.
"""
remediation = """
For `<function-name>`, add a server-side authorization check as the FIRST statement in the
function body, before any write: compare `auth.uid()` (or `current_user`/`session_user`, or a
custom JWT claim read via `current_setting('request.jwt.claims', true)`) against the row's
owner/tenant column and `raise exception` on mismatch, or call a role-check helper (e.g.
`has_role(auth.uid(), 'admin')`) and `raise exception` when it returns false. If the function is
not meant to be callable by any end-user role at all, instead run `revoke execute on function
<function-name> from anon, authenticated, public;` and invoke it only from a trusted server-side
context. A UI-only disable/hide of the triggering button is never sufficient — the function is
still reachable directly via the PostgREST RPC endpoint regardless of what the UI renders. Verify
by confirming a direct RPC call from a caller who does not own/is not entitled to the target row
is rejected before any row is written.
"""
effort = "medium"
why = "Postgres already has the primitives this fix needs (auth.uid()/current_user/session_user, a role-check function, or REVOKE) — the fix is adding one guard clause (or narrowing the grant), not introducing new infrastructure."

[[option]]
id = "privileged-mutating-function-without-authz-check"
violates = true
label = "A broadly-granted SECURITY DEFINER function writes with no identity, role, or ownership check"
directive = "A SECURITY DEFINER function whose body performs an INSERT/UPDATE/DELETE/TRUNCATE, granted to anon/public/authenticated, checks nothing about the caller before writing — no identity, no role, no ownership, no validated secret."
why = "Rejected: the DEFINER's privileges bypass RLS, so nothing else gates the write, and the PostgREST RPC endpoint reaches the function directly regardless of what the UI exposes."
