id = "SUPABASE-KEY-SERVICE-ROLE-CLIENT-1"
version = 3
title = "A service_role / sb_secret_ key must never be wired into client-bundle-delivered code"
domain = "supabase:secrets"
layer = "platform"
enforcement = "mechanical"
kind = "defect"
inspectable = true
# Severity floor. The service_role key bypasses every RLS policy, so a key wired into the browser
# bundle hands every visitor full read and write access to the project's data. Neither prong of
# the match set has a benign use (see the default option's `why`), so the floor is critical with
# no carve-out, the same bound SUPABASE-AUTH-USERS-EXPOSED-1 uses for its full-exposure case.
min_severity = "critical"
default = true
verification = "grounded"
qualifies = "This rule expresses the EXPOSURE axis that SEC-NO-VENDOR-TOKEN-1 cannot: not whether a service_role/sb_secret_ value is hardcoded (that is the vendor-token rule's job), but whether it is wired to reach the browser at all — via a client-bundle-prefixed env var name (NEXT_PUBLIC_*, VITE_*, REACT_APP_*, EXPO_PUBLIC_*) combined with SERVICE_ROLE/sb_secret in the name, or a service_role/sb_secret_-shaped value referenced from a frontend source directory. This match-set is near-zero-FP (the prefix+role-name combination has no legitimate benign use) and is a floor-port candidate. Conformance holds when no client-bundle-prefixed variable name or frontend-source reference carries a service_role/sb_secret_ identity. FP carve-out (load-bearing): the ANON/publishable key is DESIGNED to be public and must never be flagged by this rule merely for appearing in client code — its risk lives entirely downstream in RLS quality (SUPABASE-RLS-*), not in its own presence."

[[sources]]
url = "https://supabase.com/docs/guides/api/api-keys"
title = "Supabase docs: API keys: service_role bypasses RLS and must never be exposed in the browser; new sb_secret_ key format"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/798.html"
title = "CWE-798: Use of Hard-coded Credentials"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/200.html"
title = "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"

[decision]
question = "Is any service_role / sb_secret_ identity wired into code that reaches the browser bundle — through a client-bundle-prefixed env var name, or a reference from frontend source?"
default = "flag-client-bundle-service-role-wiring"
why = """
Supabase's own docs state it plainly: the service_role/secret key "has full access to your
project's data," bypasses RLS via the BYPASSRLS attribute, and must never be exposed in the
browser — "Never expose your secret keys publicly... Do not: Add it to web pages, public
documents, source code, bundle in executables or packages for mobile, desktop or CLI apps." A
service_role value being present-and-hardcoded (SEC-NO-VENDOR-TOKEN-1's job) is a different fact
from a service_role value being WIRED TO REACH THE CLIENT BUNDLE at all — the latter is true even
when the value itself is loaded correctly from an env var at runtime, if that env var's name
carries a client-bundle-inlining prefix (Next.js NEXT_PUBLIC_*, Vite VITE_*, Create React App
REACT_APP_*, Expo EXPO_PUBLIC_*), because those frameworks inline any variable with that prefix
directly into the shipped JS bundle at build time, secret or not. A vendor-token-shape scan alone
misses this: the value may never appear as a literal in source, only as a build-time substitution
downstream of a poorly-named env var.

The match-set is therefore two-pronged and near-zero-FP: (1) an env var NAME combining a
client-bundle prefix with SERVICE_ROLE or sb_secret, and (2) a service_role JWT (base64 payload
decodes to "role":"service_role", the same decode-at-match-time technique used by
SEC-NO-VENDOR-TOKEN-1's legacy-key carve-out) or an sb_secret_-prefixed value literally referenced
from a frontend source directory (components/, pages/, app/ client boundary, src/ under a Vite/CRA
root, etc.). Both prongs have no legitimate counter-example, which is why this is a floor-port
candidate.

FP carve-out (must be preserved): the anon/publishable key is DESIGNED to ship in the browser — it
is meaningless to flag its mere presence in client code, and doing so would be exactly the kind of
naive-scanner mistake that would embarrass this report. The anon key's actual risk surface is
entirely downstream, in whether the RLS policies it authenticates against are sound — that is
SUPABASE-RLS-*'s job, not this rule's.
"""

[[option]]
id = "flag-client-bundle-service-role-wiring"
label = "No client-bundle-prefixed env var or frontend source carries a service_role / sb_secret_ identity"
directive = """
The service_role (`sb_secret_`) key never reaches the browser bundle. Two wiring mistakes put it
there, and both are avoided. First, no environment variable combines a client-bundle prefix (`NEXT_PUBLIC_`, `VITE_`, `REACT_APP_`, `EXPO_PUBLIC_`) with `SERVICE_ROLE` or `SB_SECRET` in its
name: those frameworks inline any variable carrying that prefix straight into the shipped JS at
build time, so the name alone ships the secret even when the value is loaded correctly from the
environment at runtime. Second, no service_role-shaped value (a JWT whose payload decodes to
`"role":"service_role"`, or an `sb_secret_`-prefixed string) is referenced from frontend source.
Privileged operations that need that key live in a server-only route or Edge Function.

The anon / publishable key is a different thing and belongs in client code by design: it is meant
to be public, and its presence in the bundle is correct. What governs its safety is the quality of
the RLS policies it authenticates against, not where it appears.
"""
remediation = """
Rotate the service_role key immediately in the Supabase dashboard (API settings): treat it as
compromised, since it has likely already shipped to every visitor's browser. Remove it from
`<file>` and any client-bundle-prefixed environment variable (`NEXT_PUBLIC_`, `VITE_`,
`REACT_APP_`, `EXPO_PUBLIC_`), and move whatever privileged operation needed it into a
server-only route or Edge Function. Verify by confirming the new key never appears in your
built frontend bundle (search the built output, not just the source).
"""
effort = "low"
why = "The client-bundle prefix + service-role-name combination, and a service_role-shaped literal in frontend source, both have no legitimate benign use — either shape means the secret reaches every visitor's browser, which is the single most severe finding class this audit produces."

[[option]]
id = "service-role-identity-in-client-bundle"
violates = true
label = "A client-bundle-exposed env var or frontend source carries a service_role / sb_secret identity"
directive = "An environment variable combines a client-bundle-inlining prefix (`NEXT_PUBLIC_`, `VITE_`, `REACT_APP_`, `EXPO_PUBLIC_`) with a `SERVICE_ROLE`/`SB_SECRET` name, or a service_role-shaped value is referenced from frontend source."
why = "Rejected: those prefixes inline the variable into the shipped JS at build time, secret or not, so the RLS-bypassing master key reaches every visitor's browser. The anon/publishable key is the one designed to ship there and is unaffected."
