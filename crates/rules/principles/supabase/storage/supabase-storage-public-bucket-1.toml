id = "SUPABASE-STORAGE-PUBLIC-BUCKET-1"
title = "A storage bucket created public bypasses auth/RLS for object retrieval; every public bucket is named and reviewed"
domain = "supabase:storage"
layer = "platform"
enforcement = "structured"
kind = "defect"
inspectable = true
# Severity ceiling. Rationale: public buckets are a completely standard, intentional pattern —
# avatars, product photos, marketing assets. A scanner asserting critical on every one of them
# would be wrong most of the time in a typical app, so the publicness fact alone can never reach
# critical; whether THIS bucket's contents should be public is a judgement left to the reader.
max_severity = "high"
# Severity floor. Rationale: a public bucket bypasses access control entirely for reads — every
# object in it is downloadable by anyone who has or guesses the URL, with no signed URL, no auth
# header and no RLS evaluation on that path (CWE-732 when the contents are sensitive). That fact
# is worth naming every time. Floor and ceiling are both high: this rule is pinned at exactly
# high, with review routing — not a lower severity — carrying the uncertainty.
min_severity = "high"
default = true
verification = "grounded"
qualifies = "Enforced by a scan for bucket-publicness declarations: `insert into storage.buckets (...) values (..., true, ...)` / `update storage.buckets set public = true` in migrations, and `createBucket(name, { public: true })` (or the dashboard-equivalent flag) in application code. A public bucket serves every object inside it to anyone holding or guessing the URL, with no auth check and no RLS evaluation for GET/download. Conformance holds when every public bucket is deliberately, reviewably public (avatars, public assets); it fails — flagged with `needs_review`, not an automatic critical — when a bucket holding what looks like private data (its name or referencing code suggests documents, uploads, invoices, etc.) is public, since public buckets are also a common and legitimate pattern this report must not cry wolf on."

[[sources]]
url = "https://supabase.com/docs/guides/storage/buckets/fundamentals"
title = "Supabase docs — Storage bucket fundamentals: a public bucket bypasses access control for retrieving/serving files"

[[sources]]
url = "https://supabase.com/docs/guides/storage/security/access-control"
title = "Supabase docs — Storage access control (RLS on storage.objects; public buckets skip it for reads)"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/732.html"
title = "CWE-732: Incorrect Permission Assignment for Critical Resource"

[decision]
question = "Is every bucket marked public one whose entire contents are meant to be downloadable by anyone with the link?"
default = "flag-public-buckets-needs-review"
why = """
Supabase's own bucket-fundamentals docs state it directly: "When a bucket is designated as
'Public,' it effectively bypasses access controls for both retrieving and serving files within the
bucket." That means every object in a public bucket is downloadable by anyone with (or able to
guess) its URL — no signed URL, no auth header, no RLS policy evaluation happens on that read
path, regardless of what storage.objects policies exist (they still gate upload/delete/move, but
not public reads). This is CWE-732 (Incorrect Permission Assignment for Critical Resource) when the
bucket's contents are actually sensitive.

The critical honesty point (per the design's public-bucket FP carve-out): public buckets are also
a completely standard, intentional pattern — avatar images, public product photos, marketing
assets. A scanner that flags every public bucket as a vulnerability would be wrong most of the
time in a typical app and would train the reader to ignore the report. The correct behavior is to
NAME every public bucket and ASK, using signals available in the repo (the bucket's name,
referencing code paths) to prioritize which ones look worth a second look, but never assert
certainty the scanner does not have — `needs_review`, not an automatic critical.
"""

[[option]]
id = "flag-public-buckets-needs-review"
label = "Every bucket marked public holds only content meant to be downloadable by anyone with the link"
directive = """
Marking a bucket public — `public = true` in a `storage.buckets` insert or update, or
`createBucket(name, { public: true })` — bypasses access control for retrieving and serving its
files. Every object inside becomes downloadable by anyone who has or can guess its URL: no signed
URL, no auth header, and no RLS evaluation on that read path, whatever policies exist on
`storage.objects` (those still gate upload, delete and move, but not public reads).

So publicness is a per-bucket decision about contents, made deliberately. Avatars, product photos
and marketing assets are genuinely public and belong in a public bucket. Anything a user would
expect to be theirs — documents, invoices, uploads — goes in a private bucket with owner-scoped
policies for the operations the app actually performs, and is served through signed URLs. A bucket
whose name says `avatars` but holds user documents is private; the contents decide, not the name.
"""
remediation = """
Confirm whether every file in the `<bucket>` bucket is meant to be publicly downloadable by
anyone with the link. If not, set it to private (`update storage.buckets set public = false
where id = '<bucket>'`) and add owner-scoped storage policies for the operations your app
actually needs. If the bucket is genuinely public by design (e.g. avatars, public assets), no
change is needed beyond confirming that intentionally. Verify by confirming an unauthenticated
request for a file in `<bucket>` is rejected once the bucket is private.
"""
why = "Public buckets are a legitimate, common Supabase pattern; naming every one and asking rather than asserting keeps the report honest and prevents an avatar bucket from being reported with the same alarm as an exposed documents bucket, while still surfacing every case for the human reviewer to judge."

# Design note (W22, 2026-10-20): this rule previously carried a second `[[option]]`
# describing a REJECTED scanner/corpus design, not a client-code state. Removed — a
# single-option defect is the right shape here, the fault is the absence of the option
# above. The rejected design was: " a name-based filter both under- and over-reports. A bucket literally named `avatars` can still contain user-uploaded private documents if the developer repurposed it; a bucket named `uploads` might 

