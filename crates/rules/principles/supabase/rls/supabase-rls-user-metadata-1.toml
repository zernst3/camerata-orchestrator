id = "SUPABASE-RLS-USER-METADATA-1"
version = 6
title = "An RLS policy predicate must never authorize against user_metadata / raw_user_meta_data"
domain = "supabase:rls"
layer = "platform"
enforcement = "mechanical"
kind = "defect"
inspectable = true
# Token-efficiency rank 7: where this rule can apply, so the scan sends it only with these files.
# SQL statement rule: the subject is CREATE POLICY / FUNCTION / VIEW / TABLE statements. They live in
# SQL files and migration folders, and also inside TypeORM / Knex / Alembic / Rails / sqlx migrations in
# other languages, which the `contains_any` markers catch wherever the file sits.
applies_to = { paths = ["**/*.sql", "**/migrations/**", "**/migrate/**", "**/migration/**", "**/db/**", "**/database/**", "**/schema/**", "**/schemas/**", "**/seeds/**", "**/*seed*", "**/alembic/**", "**/supabase/**", "**/*.psql", "**/*.pgsql", "**/*.ddl"], contains_any = ["create policy", "alter policy", "drop policy", "row level security", "security definer", "security invoker", "create or replace function", "create function", "create or replace procedure", "create procedure", "create view", "create or replace view", "create materialized view", "grant ", "alter table", "storage.objects", "auth.users", "search_path"] }
# Token-efficiency rank 8: the deterministic locator that finds this rule's candidate sites, so
# the scan sends it those statements with context instead of whole files. Every SQL statement that
# can be its subject is a site (the token sits in a policy predicate, or in a helper function or view that predicate reads); a file the locator cannot parse, or a non-SQL file, is still
# sent whole.
candidates = { locator = "sql_policies_routines_and_views" }
# Severity floor. Rationale: user_metadata / raw_user_meta_data are writable by the user they
# describe, through the standard update-user API. A policy authorizing on either lets any
# authenticated account grant itself that privilege with one call — CWE-269 in its most literal
# form, the actor setting their own privilege level. No benign counter-example exists, so this is
# critical unconditionally rather than a needs_review carve-out.
min_severity = "critical"
default = true
verification = "grounded"
qualifies = "Enforced by a match over CREATE POLICY statement bodies: the literal tokens `user_metadata` or `raw_user_meta_data` appearing inside a policy's USING or WITH CHECK clause (whether reached via auth.jwt() or a join against auth.users) are flagged. This match is near-zero false-positive — there is no legitimate reason for a policy predicate to read user-editable profile data as an authorization input — which is why this rule is a floor-port candidate (mechanical, always-block-worthy) rather than merely advisory. Conformance holds when no policy predicate anywhere in the corpus references either token."

[[sources]]
url = "https://supabase.com/docs/guides/database/postgres/row-level-security"
title = "Supabase docs: Row Level Security guide, auth.jwt() helper: user_metadata / raw_user_meta_data is user-editable and unsafe for authorization"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/269.html"
title = "CWE-269: Improper Privilege Management"

[decision]
question = "May an RLS policy predicate ever authorize an action (e.g. an admin check) based on user_metadata or raw_user_meta_data?"
default = "never-authorize-on-user-metadata"
why = """
Supabase's own Row Level Security guide explicitly warns that relying on the `user_metadata` claim
(and its underlying `raw_user_meta_data` column on auth.users) in an RLS policy "can create
security issues" because that field is updatable by the authenticated user themselves via the
standard update-user-metadata API — it is profile data, not a server-issued claim. A policy that
reads `(auth.jwt() -> 'user_metadata' ->> 'is_admin')::boolean` or joins to
`auth.users.raw_user_meta_data` for an authorization decision lets any authenticated user grant
themselves that privilege with a single API call: this is CWE-269 (Improper Privilege Management)
in its most literal form — the actor sets their own privilege level.

The match-set is a single token check inside a CREATE POLICY body: `user_metadata` or
`raw_user_meta_data` appearing anywhere in USING/WITH CHECK. There is no legitimate use of either
field as an authorization input — Supabase's correct pattern is a separate, non-user-writable table
(e.g. a `user_roles` table only service-role or an admin policy can write) or the JWT's
`app_metadata` claim, which ordinary users cannot edit. Because the match has no known benign use
and requires no cross-file replay (it is a fact about a single CREATE POLICY statement), it is a
floor-port candidate: near-zero FP and always-block-worthy, pending the statement-splitter
infrastructure the floor requires.
"""

[[option]]
id = "never-authorize-on-user-metadata"
label = "No RLS policy predicate reads user_metadata or raw_user_meta_data as an authorization input"
directive = """
Neither `user_metadata` nor `raw_user_meta_data` appears in any policy's `USING` or `WITH CHECK`
clause, whether reached through `auth.jwt()` or a join against `auth.users`. Those fields are
profile data: the authenticated user updates them about themselves through the ordinary
update-user API. A predicate like
`(auth.jwt() -> 'user_metadata' ->> 'is_admin')::boolean` therefore lets any account grant itself
that privilege with a single call: the actor setting their own privilege level.

Authorization-relevant claims live where the user cannot reach them: the JWT's `app_metadata`,
which only a service_role client or the dashboard can write, or a dedicated roles table with its
own RLS policy. An extra application-layer check does not rescue the unsafe predicate: RLS exists
precisely so no code path that forgets, or gets it wrong, can bypass it.
"""
remediation = """
Rewrite the policy predicate to read `auth.jwt() -> 'app_metadata' ->> 'role'` (or an equivalent
`app_metadata` claim) instead of `user_metadata` / `raw_user_meta_data`: `app_metadata` can only
be written by a service_role client or the Supabase dashboard, never by the user themselves. If
you need richer role logic, move it to a dedicated roles table with its own RLS policy instead.
Verify by confirming that editing your own profile's metadata through the normal client SDK no
longer changes what the policy grants you.
"""
effort = "medium"
why = "user_metadata / raw_user_meta_data are user-writable by design; using either as an authorization input is a structural privilege-escalation vector with no legitimate counter-example, so an unconditional flag is correct rather than a needs_review carve-out."

[[option]]
id = "allow-with-additional-server-side-validation"
violates = true
label = "Policy predicates authorize on user_metadata, with an application-layer check before privileged actions"
directive = "Policies read `user_metadata` / `raw_user_meta_data` as an authorization input, and the application layer performs its own server-side check before treating the user as privileged."
why = "Rejected: RLS is the database's OWN access-control layer specifically so that no code path (including one that forgets or gets the extra check wrong) can bypass it. Requiring a compensating server-side check to make an unsafe policy predicate 'safe' reintroduces exactly the footgun RLS exists to remove, and a static scan cannot verify the compensating check exists, is complete or survives the next refactor. The safe alternative (app_metadata or a dedicated roles table) provides the same capability with no such fragility."
