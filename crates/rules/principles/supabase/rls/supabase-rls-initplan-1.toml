id = "SUPABASE-RLS-INITPLAN-1"
version = 4
title = "RLS policy predicates should wrap auth.uid()/auth.jwt() in a scalar subselect so they evaluate once per query, not once per row"
domain = "supabase:rls"
layer = "platform"
enforcement = "structured"
kind = "decision"
inspectable = true
# Token-efficiency rank 7: where this rule can apply, so the scan sends it only with these files.
# SQL statement rule: the subject is CREATE POLICY / FUNCTION / VIEW / TABLE statements. They live in
# SQL files and migration folders, and also inside TypeORM / Knex / Alembic / Rails / sqlx migrations in
# other languages, which the `contains_any` markers catch wherever the file sits.
applies_to = { paths = ["**/*.sql", "**/migrations/**", "**/migrate/**", "**/migration/**", "**/db/**", "**/database/**", "**/schema/**", "**/schemas/**", "**/seeds/**", "**/*seed*", "**/alembic/**", "**/supabase/**", "**/*.psql", "**/*.pgsql", "**/*.ddl"], contains_any = ["create policy", "alter policy", "drop policy", "row level security", "security definer", "security invoker", "create or replace function", "create function", "create or replace procedure", "create procedure", "create view", "create or replace view", "create materialized view", "grant ", "alter table", "storage.objects", "auth.users", "search_path"] }
# Severity ceiling, transcribed from this rule's own prose: "emit a medium-severity, opt-in-only
# finding"; the rejected option reports it "at the same tier as the security-relevant RLS
# findings", rejected because it "conflates a performance optimization with a security defect
# in a report whose entire credibility rests on precise severity framing".
max_severity = "medium"
# Severity floor, transcribed from this rule's own prose: "When found, emit a
# medium-severity, opt-in-only finding". Floor and ceiling are both medium: the prose pins
# this performance rule at exactly medium.
min_severity = "medium"
default = true
opt_in_only = true
verification = "grounded"
qualifies = "Enforced by a statement-granular scan of CREATE POLICY bodies: an un-wrapped call to auth.uid() or auth.jwt() inside a USING/WITH CHECK clause is re-evaluated by the Postgres planner once PER ROW, instead of once per query when wrapped as (select auth.uid()) — a documented query-planner optimization (the `initplan` re-use), not a security property. This is a PERFORMANCE rule, not a security rule, so it is opt-in only: it must never be pre-checked at onboarding even though it is grounded, and the architect opts in deliberately. Conformance holds when policy predicates wrap auth.*() calls in a scalar subselect; it fails (functionally, not insecurely) when they are called bare."

[[sources]]
url = "https://supabase.com/docs/guides/database/database-advisors?lint=0003_auth_rls_initplan"
title = "Supabase Database Linter: 0003_auth_rls_initplan (\"Slow security policy detected\")"
linter = "splinter: auth_rls_initplan"

[decision]
question = "Should RLS policies wrap auth.uid() / auth.jwt() calls in a scalar subselect ((select auth.uid())) to get per-query rather than per-row evaluation, and is this ever pre-checked automatically?"
default = "auth-calls-wrapped-in-a-scalar-subselect"
why = """
An un-wrapped `auth.uid()` (or `auth.jwt()`) inside a policy's USING/WITH CHECK clause is
re-evaluated by the Postgres planner for EVERY ROW the policy filters, because the planner cannot
prove the function call is stable across rows without an explicit hint. Wrapping the same call as
`(select auth.uid())` lets the planner treat it as an initplan — evaluated once per query and
reused — which is Splinter's own documented fix for its auth_rls_initplan lint (0003, confirmed
against the live database-advisors page: "Slow security policy detected... execute checks on every
row rather than once per query"). This is purely a QUERY-PERFORMANCE finding: a table with 100 rows
never notices; a table with 10 million rows measurably slows down on every RLS-filtered query. It
carries zero security implication either direction — the un-wrapped and wrapped forms are
semantically identical, only their cost differs.

Because it is performance, not security, this rule is `opt_in_only = true`: even though the
detection is grounded and the match-set (un-wrapped auth.uid()/auth.jwt() inside a policy body) is
mechanically precise, it must never be pre-ticked in an onboarding proposal alongside genuine
security findings — an architect opts in deliberately when performance at scale is already a
concern, not by default alongside the security-tier RLS rules.
"""

[[option]]
id = "auth-calls-wrapped-in-a-scalar-subselect"
label = "RLS policies wrap auth.*() calls in a scalar subselect so they evaluate once per query"
directive = """
Every `auth.uid()` / `auth.jwt()` call inside a policy's `USING` or `WITH CHECK` clause is
written in the scalar-subselect form `(select auth.uid())` / `(select auth.jwt())`. Postgres
then evaluates it once per query through its initplan mechanism instead of once per row, so
the policy's cost stays flat as the table grows rather than scaling with the row count.
"""
remediation = """
In the affected policy on `<table>`, replace bare `auth.uid()` / `auth.jwt()` calls in the
`USING`/`WITH CHECK` clause with the scalar-subselect form `(select auth.uid())` /
`(select auth.jwt())`. This is a same-day, purely mechanical rewrite with no behavior change.
Verify by re-running `EXPLAIN ANALYZE` on a representative query against `<table>` and confirming
the auth function no longer appears once per row in the plan.
"""
why = "The rewrite is zero-risk and purely mechanical, and it removes a per-row cost that is invisible on a small table and dominant on a large one."

[[option]]
id = "bare-auth-calls-in-policy-predicates"
label = "RLS policies call auth.*() directly in their predicates, re-evaluating per row"
directive = """
Policy predicates call `auth.uid()` / `auth.jwt()` directly, and the planner re-evaluates the
call for every row it tests.
"""
remediation = """
Leave the predicates as they are. Revisit if `<table>` grows past the point where the per-row
auth call shows up in `EXPLAIN ANALYZE` as a material share of query time.
"""
why = "Correct while the tables these policies guard stay small: the per-row evaluation is real but immaterial at low row counts, and the rewrite can be applied later with no behaviour change. It becomes the wrong choice once a guarded table grows, because the cost scales with the row count rather than with the result size."
