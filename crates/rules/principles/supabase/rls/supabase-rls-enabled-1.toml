# describing a REJECTED scanner/corpus design, not a client-code state. Removed — a
# single-option defect is the right shape here, the fault is the absence of the option
# above. The rejected design was: per-file regex cannot express state that changes ACROSS files. It produces false positives (flagging a table as unprotected when a LATER migration enables RLS the scanner never correlates to the same 

