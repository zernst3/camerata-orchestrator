id = "SUPABASE-RLS-PERMISSIVE-TRUE-1"
version = 5
title = "A policy with USING (true) / WITH CHECK (true) targeting anon or public is a hole shaped like a policy"
domain = "supabase:rls"
layer = "platform"
enforcement = "structured"
kind = "defect"
inspectable = true
# Token-efficiency rank 7: where this rule can apply, so the scan sends it only with these files.
# SQL statement rule: the subject is CREATE POLICY / FUNCTION / VIEW / TABLE statements. They live in
# SQL files and migration folders, and also inside TypeORM / Knex / Alembic / Rails / sqlx migrations in
# other languages, which the `contains_any` markers catch wherever the file sits.
applies_to = { paths = ["**/*.sql", "**/migrations/**", "**/migrate/**", "**/migration/**", "**/db/**", "**/database/**", "**/schema/**", "**/schemas/**", "**/seeds/**", "**/*seed*", "**/alembic/**", "**/supabase/**", "**/*.psql", "**/*.pgsql", "**/*.ddl"], contains_any = ["create policy", "alter policy", "drop policy", "row level security", "security definer", "security invoker", "create or replace function", "create function", "create or replace procedure", "create procedure", "create view", "create or replace view", "create materialized view", "grant ", "alter table", "storage.objects", "auth.users", "search_path"] }
# Token-efficiency rank 8: the deterministic locator that finds this rule's candidate sites, so
# the scan sends it those statements with context instead of whole files. Every SQL statement that
# can be its subject is a site (the true predicate and the TO roles are facts of one CREATE or ALTER POLICY statement); a file the locator cannot parse, or a non-SQL file, is still
# sent whole.
candidates = { locator = "sql_policies" }
# Severity ceiling. Rationale: public read access under a true predicate is a routine, often
# intentional pattern (catalogs, published posts, reference tables), so this rule can never reach
# critical — a uniform critical would alarm identically on a products table and an open write
# path to `payments`, which is how a report loses the reader on its most common finding class.
max_severity = "high"
# Severity floor. Rationale: this rule has TWO branches of unequal weight and the floor is set to
# the LOWER so it cannot inflate either. A true predicate on INSERT/UPDATE/DELETE, or any
# WITH CHECK (true), means anyone can WRITE and is the high branch — there is no legitimate
# "public write everything" pattern. A SELECT-only USING (true) means anyone can READ, which is
# frequently deliberate, so it sits at the medium floor and is routed to human review. A floor of
# high would silently raise the read side the author deliberately downgraded.
min_severity = "medium"
default = true
verification = "grounded"
qualifies = "Enforced by a statement-granular scan of CREATE POLICY statements (once SQL is split into statements, this is regex-grade — no timeline replay required, since a `true` predicate is a per-statement fact): a policy whose USING or WITH CHECK clause is the literal boolean `true`, targeting `anon` or `public` (an absent TO clause defaults to `public`), is flagged. Write-side matches (INSERT/UPDATE/DELETE, or WITH CHECK (true)) are high severity; read-side matches (SELECT, or USING (true) with no WITH CHECK) are medium and carry `needs_review`, since public read access to reference/lookup data is a legitimate, common pattern. Conformance holds when no exposed-schema policy grants unconditional true access without an explicit, reviewed justification."

[[sources]]
url = "https://supabase.com/docs/guides/database/postgres/row-level-security"
title = "Supabase docs: Row Level Security guide (CREATE POLICY syntax: USING, WITH CHECK, TO roles)"

[[sources]]
url = "https://owasp.org/Top10/2021/A01_2021-Broken_Access_Control/index.html"
title = "OWASP Top 10:2021: A01 Broken Access Control"

[decision]
question = "Does any policy targeting anon or public carry an unconditional USING (true) / WITH CHECK (true) predicate?"
default = "flag-true-predicate-severity-split"
why = """
A policy is not a comment describing intended access control — it is the ACTUAL access control,
and `USING (true)` / `WITH CHECK (true)` means "this predicate always passes." Combined with a
missing or explicit `TO anon`/`TO public` role clause (Postgres's CREATE POLICY defaults an absent
TO clause to `public`, per the RLS guide's policy syntax), this grants unconditional access to
every anonymous request. The match-set is a per-statement fact once migrations are split into
individual SQL statements: scan each CREATE POLICY, extract its USING/WITH CHECK text and its TO
role list, and flag a literal `true` targeting anon/public.

Severity split is deliberate: WITH CHECK (true) or a true predicate on an INSERT/UPDATE/DELETE
policy means anyone can WRITE — that is unconditionally high severity, there is no legitimate
"public write everything" pattern. A true predicate on a SELECT-only policy (no WITH CHECK) means
anyone can READ — this is a common and often intentional pattern (public product catalogs,
published blog posts, reference/lookup tables), so it ships at medium with `needs_review` rather
than an automatic critical: the finding names the table and asks "should `<table>` really be
publicly readable?" rather than asserting a vulnerability.

FP carve-out: this rule is about POLICY predicates, not about the anon key's existence in client
code — the anon key is designed to be public (see SUPABASE-KEY-SERVICE-ROLE-CLIENT-1's qualifies
for that boundary). The risk this rule expresses is entirely about what the anon key is ALLOWED to
do once it authenticates, which is exactly what RLS policies define.
"""

[[option]]
id = "flag-true-predicate-severity-split"
label = "No policy reachable by anon or public grants access through an unconditional true predicate"
directive = """
A policy is not a comment describing intended access: it is the access control itself, and
`USING (true)` / `WITH CHECK (true)` means the predicate always passes. Combined with a `TO anon`
or `TO public` clause, or no `TO` clause at all (Postgres defaults an absent one to `public`), that
grants every anonymous request whatever the policy covers.

Write access is never granted this way. A true predicate on an INSERT, UPDATE or DELETE policy, or
any `WITH CHECK (true)`, means anyone can write, and there is no version of that which is the right
design. Predicates scope to the actual owner or role instead: `using (auth.uid() = user_id)`.

Read access under a true predicate is a real choice rather than an automatic fault: a public
product catalog, published posts, a reference or lookup table are all legitimately world-readable.
Where it appears, it is because someone decided this table's rows are public, not because the
predicate was left wide while the policy was being written.
"""
remediation = """
Rewrite the policy's `USING`/`WITH CHECK` clause on `<table>` to scope it to the actual owner or
role, for example `using (auth.uid() = user_id)` instead of `using (true)`, or, if every row on
`<table>` is genuinely meant to be public (a catalog, published content), keep `true` for SELECT
only and make sure no INSERT/UPDATE/DELETE policy also carries an unconditional `true`. Verify by
confirming an authenticated request for another user's row is rejected, and that only the
intended public data remains readable by anon.
"""
why = "Write access under an unconditional true predicate has no legitimate justification and warrants an unqualified high-severity finding; read access under the same predicate is routinely intentional (public catalogs, reference data), so it is downgraded and routed to human review rather than asserted as a vulnerability."

[[option]]
id = "anon-or-public-policy-grants-write-via-true-predicate"
violates = true
label = "A policy reachable by anon or public grants write access through an unconditional true predicate"
directive = "A policy with `USING (true)` / `WITH CHECK (true)` on an INSERT/UPDATE/DELETE action (or an absent TO clause defaulting to public) lets anyone write every row."
why = "Rejected: a true predicate on a write policy reachable by anon/public is an unconditional grant of write access to the world. A SELECT-only `USING (true)` for genuinely public data is the default option's reviewed case, not this."
