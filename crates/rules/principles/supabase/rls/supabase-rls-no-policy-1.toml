id = "SUPABASE-RLS-NO-POLICY-1"
version = 4
title = "A table with Row Level Security enabled but zero policies denies all anon/authenticated access"
domain = "supabase:rls"
layer = "platform"
enforcement = "architectural"
kind = "defect"
inspectable = true
# Token-efficiency rank 7: where this rule can apply, so the scan sends it only with these files.
# SQL statement rule: the subject is CREATE POLICY / FUNCTION / VIEW / TABLE statements. They live in
# SQL files and migration folders, and also inside TypeORM / Knex / Alembic / Rails / sqlx migrations in
# other languages, which the `contains_any` markers catch wherever the file sits.
applies_to = { paths = ["**/*.sql", "**/migrations/**", "**/migrate/**", "**/migration/**", "**/db/**", "**/database/**", "**/schema/**", "**/schemas/**", "**/seeds/**", "**/*seed*", "**/alembic/**", "**/supabase/**", "**/*.psql", "**/*.pgsql", "**/*.ddl"], contains_any = ["create policy", "alter policy", "drop policy", "row level security", "security definer", "security invoker", "create or replace function", "create function", "create or replace procedure", "create procedure", "create view", "create or replace view", "create materialized view", "grant ", "alter table", "storage.objects", "auth.users", "search_path"] }
# Severity ceiling. Rationale: RLS enabled with zero policies is deny-by-default — nobody gets
# rows. That is an availability and architecture smell, not a data exposure, so it must sit below
# the missing-RLS and policy-disabled findings rather than competing with them for alarm.
max_severity = "medium"
# Severity floor. Rationale: it is still a real, repo-detectable signal with two possible causes
# (a silently broken feature, or a service_role client reading the table and bypassing RLS
# entirely), and the second is an architectural risk worth surfacing. Floor and ceiling are both
# medium: diagnostic value, no direct exposure.
min_severity = "medium"
default = true
verification = "grounded"
qualifies = "Enforced by the same migration-timeline replay pass as SUPABASE-RLS-ENABLED-1: for a table whose replayed end-state has RLS enabled but has zero CREATE POLICY statements anywhere in its history, Postgres denies ALL access to anon/authenticated roles (RLS enabled with no policy is deny-by-default). Conformance holds when every RLS-enabled table has at least one policy; a zero-policy table is either a broken feature or a sign the application reads that table exclusively via the service_role key, which bypasses RLS entirely. Medium severity — this is an availability/architecture smell, not a direct exposure, so it is a lower severity than the missing-RLS and policy-disabled findings."

[[sources]]
url = "https://supabase.com/docs/guides/database/postgres/row-level-security"
title = "Supabase docs: Row Level Security guide (deny-by-default with RLS enabled and no policy)"

[[sources]]
url = "https://supabase.com/docs/guides/database/database-advisors?lint=0008_rls_enabled_no_policy"
title = "Supabase Database Linter: 0008_rls_enabled_no_policy (\"No access rules defined\")"
linter = "splinter: rls_enabled_no_policy"

[decision]
question = "Does every table with Row Level Security enabled also carry at least one policy?"
default = "flag-zero-policy-as-medium"
why = """
RLS enabled with no CREATE POLICY is deny-by-default in Postgres: anon and authenticated roles get
zero rows and zero writes. This is Splinter's rls_enabled_no_policy lint (0008, confirmed). Unlike
SUPABASE-RLS-ENABLED-1 and SUPABASE-RLS-POLICY-DISABLED-1, this is NOT a direct data-exposure
finding — it is one of two things: (a) a broken feature (the table is legitimately used by the
anon/authenticated roles and something is silently failing), or (b) a sign the application only
ever touches the table through a service_role-backed client, which bypasses RLS entirely and
therefore makes the table's own policies moot — in which case the REAL risk lives in whichever code
path constructs that service_role client (see SUPABASE-AUTH-SERVICE-ROLE-BYPASS-1), not in this
table's RLS configuration. The finding's value is diagnostic rather than a direct vulnerability, so
it ships at medium severity and its remediation text should point the reader at both possibilities
rather than assuming one.
"""

[[option]]
id = "flag-zero-policy-as-medium"
label = "Every table with Row Level Security enabled carries at least one policy"
directive = """
RLS enabled with no `CREATE POLICY` is deny-by-default in Postgres: the `anon` and `authenticated`
roles get zero rows and zero writes. So a table in that state is carrying a lock with no key cut
for anyone, and it means one of two things, both worth knowing. Either a feature is silently
failing because the roles it depends on were never granted anything, or the application only ever
touches the table through a service_role-backed client, which bypasses RLS entirely and makes the
table's own policies moot, moving the real access-control question into whichever handler
constructs that client.

Every RLS-enabled table therefore carries at least one policy scoping exactly which requests may
read or write it. Where the table is genuinely only reached through a service_role path, RLS stays
on with no policy deliberately, and the handler using that client carries the explicit
authorization check instead.
"""
remediation = """
Add a `CREATE POLICY` for `<table>` scoping exactly which anon/authenticated requests may read
or write it. If the app instead reads `<table>` through a service_role (master-key) client and
does not need per-row access rules, leave RLS enabled with no policy and instead add an explicit
authorization check in the server code that uses that client. Verify by confirming a normal
(anon or authenticated-role) request can perform the operations the feature actually needs.
"""
effort = "medium"
why = "The finding is a genuine repo-detectable signal (deny-by-default RLS) but its root cause is ambiguous from static analysis alone; medium severity plus a two-branch remediation is the honest framing rather than guessing which branch applies."

[[option]]
id = "treat-zero-policy-as-non-finding"
violates = true
label = "Tables are left RLS-enabled with zero policies, treated as an intentional, already-secure lockdown"
directive = "Tables may stay RLS-enabled with no policy at all, the deny-by-default state being taken as an intentional and already-secure configuration rather than as a sign that a feature is broken or that access runs through a service_role client."
why = "Rejected: a zero-policy table is exactly the shape a vibe-coded app produces when the developer enabled RLS (perhaps prompted by Supabase's dashboard nudge) and then gave up on writing policies, routing all access through the service_role key instead, which is a real architectural risk this report exists to surface, not a state to stay silent about. Silence here would mean the report misses the single clearest signal that a service_role bypass is in play."
