id = "SUPABASE-RLS-POLICY-DISABLED-1"
version = 2
title = "A table with CREATE POLICY statements must have Row Level Security enabled in its replayed end-state"
domain = "supabase:rls"
layer = "platform"
enforcement = "architectural"
kind = "defect"
inspectable = true
# Token-efficiency rank 7: where this rule can apply, so the scan sends it only with these
# files. SQL statement rule: it is about CREATE POLICY / FUNCTION / VIEW / TABLE statements in SQL files (plus supabase/config.toml, which names the API-exposed schemas); no other file kind holds the subject.
applies_to = { paths = ["**/*.sql", "**/supabase/config.toml"] }
# Severity floor. Rationale: this is the more dangerous variant of a missing-RLS finding, not a
# milder one. Written policies make the table LOOK protected in code review and in the migration
# diff while Postgres never evaluates them, so the false sense of security is itself part of the
# defect — Splinter's 0007. Critical.
min_severity = "critical"
default = true
verification = "grounded"
qualifies = "Enforced by the same migration-timeline replay pass as SUPABASE-RLS-ENABLED-1: once a table's final RLS-enabled/disabled state and its final policy set are both known, this rule flags a table that has one or more CREATE POLICY statements in its history but whose replayed end-state has RLS disabled — the policies were authored but are silently inactive. Conformance holds when every table carrying at least one policy also has RLS enabled in the same end-state; it fails when policies exist over a table whose RLS is off. Carries the same repo-vs-production honesty caveat as SUPABASE-RLS-ENABLED-1."

[[sources]]
url = "https://supabase.com/docs/guides/database/postgres/row-level-security"
title = "Supabase docs — Row Level Security guide (CREATE POLICY semantics)"

[[sources]]
url = "https://supabase.com/docs/guides/database/database-advisors?lint=0007_policy_exists_rls_disabled"
title = "Supabase Database Linter — 0007_policy_exists_rls_disabled (\"Security policy not enforced\")"
linter = "splinter: policy_exists_rls_disabled"

[decision]
question = "Does any table carry CREATE POLICY statements while Row Level Security itself is left disabled?"
default = "flag-policy-exists-rls-disabled"
why = """
This is a more dangerous variant of SUPABASE-RLS-ENABLED-1: the codebase LOOKS protected — a
developer wrote CREATE POLICY statements that read as access control — but because RLS itself was
never enabled (or was disabled after the policies were written), Postgres never evaluates those
policies at all. The table is fully open in production while the code review and the migration
diff both show what appears to be a security control. This exact shape is Splinter's
policy_exists_rls_disabled lint (0007, confirmed against the live database-advisors page).

Detection requires the same end-state replay as SUPABASE-RLS-ENABLED-1 (policies and the
ENABLE/DISABLE state must both be resolved against the ordered timeline, not a single file) plus
one additional correlation: at least one CREATE POLICY targeting the table exists anywhere in the
replayed history. The buyer-facing framing is deliberately sharper than the bare missing-RLS case
because the false sense of security is itself the finding: "You wrote access rules for `orders`,
but they are switched off. The table looks protected in your code and is fully open in
production." Same honesty caveat as SUPABASE-RLS-ENABLED-1: this is what the migration history
shows, not a live-database assertion.
"""

[[option]]
id = "flag-policy-exists-rls-disabled"
label = "Every table that carries policies also has Row Level Security enabled, so the policies actually run"
directive = """
A `CREATE POLICY` statement does nothing on its own. Postgres only evaluates a table's policies
once `ALTER TABLE <table> ENABLE ROW LEVEL SECURITY;` is in force, so a table with policies written
but RLS never enabled — or disabled again afterwards — is fully open, while the migration diff and
the code review both show what reads as working access control.

Every table carrying at least one policy therefore also has RLS enabled at the end of the
migration history. Policies and the enable statement are authored together, and when a migration
turns RLS off for a table that has policies, the re-enable goes in with it.
"""
remediation = """
Add `ALTER TABLE <table> ENABLE ROW LEVEL SECURITY;` in a new migration — the policies already
defined for `<table>` do not take effect until RLS itself is turned on, so this is usually the
entire fix; no new policy needs writing. Verify by confirming the Supabase dashboard's
Authentication > Policies page shows `<table>` as RLS-enabled, and that an anon-key request
outside the existing policies' scope is now rejected.
"""
effort = "low"
why = "Policies-with-RLS-off is a distinct failure mode from bare missing-RLS: it indicates a developer BELIEVES the table is protected, which changes both the remediation message (enable RLS; the policies are likely already correct) and the report's credibility (naming the exact gap between intent and reality is the paid-audit value)."

# Design note (W22, 2026-10-20): this rule previously carried a second `[[option]]`
# describing a REJECTED scanner/corpus design, not a client-code state. Removed — a
# single-option defect is the right shape here, the fault is the absence of the option
# above. The rejected design was: " collapsing the two cases loses the highest-value signal in a vibe-coded audit — that the developer already wrote correct-looking policies and only needs RLS switched on, versus a table with no acces

