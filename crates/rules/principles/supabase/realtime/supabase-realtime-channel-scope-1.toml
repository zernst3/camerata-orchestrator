id = "SUPABASE-REALTIME-CHANNEL-SCOPE-1"
version = 1
title = "A channel topic must not be a guessable/enumerable identifier or an unvalidated client-supplied string standing in for an authorization check"
domain = "supabase:realtime"
layer = "platform"
enforcement = "prose"
kind = "defect"
inspectable = true
# Severity floor. Rationale: both branches land in the same place and neither is the lesser. An
# enumerable topic lets an attacker iterate adjacent values into channels meant for other users;
# a raw client-controlled topic with no server-side entitlement binding is the same
# user-controlled-key shape (CWE-639) applied to a pub/sub identifier. High for both.
min_severity = "high"
default = true
verification = "grounded"
qualifies = "Whether a channel's topic string is constructed in a way that an attacker could guess, enumerate, or directly control is a semantic judgment over the client code constructing the topic, not a pattern match — so this rule routes to prose: the `supabase.channel('<topic-expression>')` call site is fed to Claude with the question: is the topic built from a sequential/predictable id, or from a raw client-controlled value (a route param, query string, user-editable field) with no server-side validation that the caller is entitled to that specific topic? Conformance holds when topic construction either embeds an unguessable identifier (a UUID) scoped by an authorization check (SUPABASE-REALTIME-AUTHORIZATION-1's realtime.messages policy) that binds the connecting user to that specific topic, or the topic value itself is server-issued rather than client-chosen; it fails when the topic is built from a sequential integer id, a freely client-editable string with no server-side ownership/membership binding, or treated as if secrecy of the topic name were itself an access control."

[[sources]]
url = "https://supabase.com/docs/guides/realtime/channels"
title = "Supabase docs — Channels: topics are arbitrary client-chosen strings (e.g. 'realtime:chat-room'); for public channels, the documentation provides no restriction beyond knowing the topic name — topic secrecy is not an access control, only `private: true` plus a realtime.messages policy is"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/639.html"
title = "CWE-639: Authorization Bypass Through User-Controlled Key — a sequential or client-controlled channel topic is the same user-controlled-key shape applied to a pub/sub identifier instead of a database row"

[decision]
question = "Is every channel topic either server-issued or built from an unguessable identifier that a realtime.messages RLS policy actually authorizes, rather than a sequential id or a client-controllable string treated as if its secrecy were itself the access control?"
default = "topics-are-unguessable-and-authorization-checked"
why = """
Supabase's own channel documentation describes topics as arbitrary strings the CLIENT chooses — there is no
server-side issuance step by default, and for a channel left in public mode, the documentation gives no indication
that anything beyond knowing the topic name is required to join it. Two distinct, related failure modes follow: a
channel topic built from a sequential or otherwise predictable identifier (`room-42`, an incrementing order id) is
directly ENUMERABLE — an attacker can iterate nearby values and join channels they were never given access to,
exactly CWE-639's user-controlled-key shape, just applied to a pub/sub topic rather than a row id. The second,
subtler failure mode is a developer treating topic-name secrecy itself as the access control ('nobody will guess
this UUID, so I don't need a realtime.messages policy either') — which only holds until the UUID leaks through any
of the ordinary channels a client-visible value leaks through (a shared link, a browser history entry, a referrer
header, a support ticket screenshot), at which point there is still no authorization check behind it, because
`private`/the matching policy was never configured in the first place.

The durable fix is layered, and mirrors SUPABASE-REALTIME-AUTHORIZATION-1 rather than substituting for it: an
unguessable identifier (a UUID, ideally server-issued rather than client-constructed) makes the topic hard to
stumble onto by brute force, AND a `private: true` channel with a matching realtime.messages policy makes knowing
the topic name insufficient on its own — the connecting user still has to be authorized for that specific topic.
Either alone is incomplete: an unguessable topic with no RLS policy is security-through-obscurity; an authorized but
sequentially-numbered topic is still trivially enumerable by anyone who IS authorized for their own topic and tries
adjacent numbers.
"""

[[option]]
id = "topics-are-unguessable-and-authorization-checked"
label = "Channel topics are server-issued or unguessable, and every non-public topic is authorization-checked"
directive = """
A channel topic is an arbitrary string the client picks, so two properties are established
deliberately rather than assumed.

The topic is not enumerable: it embeds an unguessable identifier such as a UUID tied to the
resource, never a sequential integer or other predictable pattern that lets someone iterate adjacent
values into channels meant for other users. And the server, not the client, decides which topics a
given authenticated user may request — a raw route parameter or query string is never passed
through as a topic without a server-side check that the caller is entitled to that resource.

Unguessability is not the access control, though. Topic names leak through entirely ordinary paths —
a shared link, browser history, a referrer header, a support screenshot, a log line — so every
non-public topic is also a `private: true` channel with a matching `realtime.messages` policy, so
that knowing the name is insufficient on its own. The two solve different problems: an unguessable
topic with no policy is obscurity, and an authorized but sequentially-numbered topic is still
trivially enumerable by anyone authorized for their own.
"""
remediation = """
Construct `<topic>` from a server-issued or genuinely unguessable identifier (a UUID tied to the resource, not a
sequential id), and ensure the client never gets to choose an arbitrary topic string outright — the server should
be the one that decides, for a given authenticated user, which topic(s) they are allowed to request. Pair this with
a realtime.messages RLS policy (SUPABASE-REALTIME-AUTHORIZATION-1) so that even a leaked topic name does not grant
access on its own. Verify by attempting to join a channel for another user's resource using a guessed or adjacent
identifier and confirming the connection is rejected.
"""
effort = "medium"
why = "Topic secrecy and topic authorization solve different problems and neither substitutes for the other — an unguessable topic with no RLS policy is obscurity, not access control, while an RLS-protected but sequentially-numbered topic is still enumerable by anyone otherwise authorized to try adjacent values; the fix requires both."

[[option]]
id = "treat-an-unguessable-topic-name-as-sufficient-access-control"
violates = true
label = "Channel topics are unguessable UUIDs, and that unguessability is the channel's only access control"
directive = "Topics are built from unguessable identifiers such as UUIDs, and nothing further gates the channel: it is not marked private and no matching `realtime.messages` policy exists, so knowing the topic name is sufficient to join."
why = "Rejected: this is security through obscurity applied to a value that routinely leaks through entirely ordinary channels a developer doesn't think of as a secret-disclosure path — a shared link, browser history, a referrer header, a support screenshot, a logging pipeline that happens to capture the URL. Once the identifier is known to anyone outside the intended audience, there is no second check behind it, because the whole point of this option is that no realtime.messages policy exists to catch that case."
