id = "INTEGRATION-AUTH-SEAM-1"
title = "Every UI-gated affordance maps to a guarded endpoint"
domain = "integration"
layer = "universal"
enforcement = "mechanical"
kind = "default_with_exceptions"
inspectable = true
default = false
opt_in_only = true
layer3_only = false
verification = "grounded"

qualifies = "Checked across the whole assembled system: each consumed endpoint call is marked as UI-gated where a permission or auth check guards the affordance that triggers it, then matched against the producing endpoint's own server-side guard; a UI-gated affordance whose endpoint has no matching guard fails. A stack with no extractor is reported review-tier for human QA."

