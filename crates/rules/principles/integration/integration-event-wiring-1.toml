id = "INTEGRATION-EVENT-WIRING-1"
version = 3
title = "Every emitted event has a consumer and every subscription is emitted"
domain = "integration"
layer = "universal"
enforcement = "mechanical"
kind = "decision"
inspectable = true
default = false
opt_in_only = true
layer3_only = false
verification = "policy"

qualifies = "Checked across the whole assembled system in both directions: a per-stack extractor normalizes each repo into emitted events and subscriptions, and every emit must have a matching subscribe and vice versa. A stack with no extractor is reported review-tier for human QA."

[[sources]]
url = "docs/decisions/2026-06-15_cross_agent_integration_gate.md"
title = "Design decision: a check over the whole assembled system confirms that every connection between components has both ends"

[[sources]]
url = "docs/decisions/2026-07-05_integration-gate-generic-engine.md"
title = "Design decision: one reconciliation engine compares what each component emits with what the others consume, with one extractor per language stack"

[decision]
question = "How does the project verify that events wired across the agent seam have no dangling ends (an emit with no consumer, or a subscription with no emitter)?"
why = "Event wiring is a cross-agent invariant: the emitter agent and the subscriber agent each ship a clean diff, but only the assembled whole reveals whether an emitted event is actually consumed and whether a subscribed event is actually emitted. A dangling emit is dead signal; a dangling subscription is a consumer waiting on something that never fires. Neither per-agent gate can see the other side of the seam."

[[option]]
id = "reconcile-event-emit-vs-consume"
label = "Reconcile emitted events against subscriptions (both directions, deterministic)"
directive = "Every event the system emits has at least one subscriber somewhere in it, and every subscription corresponds to an event that is actually emitted: checked across all components, so neither a dangling emit (a signal nothing listens for) nor a dangling subscription (a consumer waiting on an event nobody sends) ships."
remediation = """
Add the missing consumer for an event that is emitted but never subscribed to, or add the missing producer/emit call for a subscription that is waiting on an event nothing ever publishes. Remove the dead emit or dead subscription instead if it turns out to be leftover from removed functionality. Verify by re-running the integration gate's event reconciliation on the assembled tree and confirming every emitted event now has at least one matching consumer and every subscription has a matching emitter.
"""
effort = "low"
why = "The wiring-completeness check runs on the integrated whole — the only place both the emit and the subscribe are visible at once — as a deterministic comparison of neutral event records, not an LLM guessing whether the ends connect."

[[option]]
id = "no-event-wiring-check"
label = "No cross-agent event-wiring check"
directive = "Emitted events and subscriptions are not reconciled across the system, so a dangling emit or a dangling subscription ships undetected."
why = "Without the integration gate the dangling end surfaces only at runtime, when the expected event never arrives or an emitted event is silently dropped, exactly the wiring gap this tier exists to close."
