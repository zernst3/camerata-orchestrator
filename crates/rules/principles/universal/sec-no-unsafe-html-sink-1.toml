id = "SEC-NO-UNSAFE-HTML-SINK-1"
version = 6
title = "User- or attacker-influenced data is never rendered through a raw-HTML sink without sanitization"
domain = "universal"
layer = "universal"
enforcement = "structured"
kind = "defect"
inspectable = true
cwe = ["CWE-79"]
default = true
verification = "grounded"
qualifies = "A mix of a deterministic search and the model's own read. Source files in a language the preview checks cover are matched by a taint-tracking cross-site scripting search (semgrep taint-xss rules) for the common raw-HTML sinks. Server-side templates and HTML pages (EJS, ERB, Handlebars, Pug, Nunjucks, Jinja and plain HTML) are outside those rules, which cover source languages only, so the raw-output syntax of each template engine is judged by the model's semantic read of the template and has no deterministic check behind it. A template finding is therefore a judgment, reported at the line of the raw-output tag, and a template with no finding is not proof that no attacker-influenced value reaches it from the code that renders it."

[[sources]]
url = "https://cwe.mitre.org/data/definitions/79.html"
title = "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"

[[sources]]
url = "https://react.dev/reference/react-dom/components/common#dangerously-setting-the-inner-html"
title = "React docs: dangerouslySetInnerHTML: rendering raw HTML bypasses React's default escaping"

[[sources]]
url = "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html"
title = "OWASP Cross Site Scripting Prevention Cheat Sheet"

# Source note: States that `<%=` escapes the value and `<%-` outputs the unescaped value.
[[sources]]
url = "https://github.com/mde/ejs/blob/main/README.md"
title = "EJS documentation: `<%=` escapes output and `<%-` outputs the unescaped value"

# Source note: States that `raw` outputs a string without escaping it by marking it HTML safe.
[[sources]]
url = "https://api.rubyonrails.org/classes/ActionView/Helpers/OutputSafetyHelper.html"
title = "Rails API: OutputSafetyHelper#raw outputs a string without escaping it"

# Source note: States that String#html_safe marks a string as trusted so it is inserted into HTML with no additional escaping.
[[sources]]
url = "https://api.rubyonrails.org/classes/String.html"
title = "Rails API: String#html_safe inserts a string into HTML with no additional escaping"

# Source note: States that `<%==` inserts a value as is, equivalent to calling the `raw` helper.
[[sources]]
url = "https://guides.rubyonrails.org/active_support_core_extensions.html"
title = "Rails Guides: Active Support Core Extensions: `<%==` is equivalent to `raw` and html_safe performs no escaping"

# Source note: States that `{{ }}` values are HTML-escaped and that the triple-stash `{{{ }}}` produces raw output.
[[sources]]
url = "https://handlebarsjs.com/guide/expressions.html"
title = "Handlebars guide: expressions HTML-escape by default and `{{{ }}}` outputs raw values"

# Source note: States that `=` escapes buffered code and that `!=` does not escape, so it is unsafe for user input.
[[sources]]
url = "https://pugjs.org/language/code.html"
title = "Pug documentation: unescaped buffered code (`!=`) performs no escaping and is unsafe for user input"

# Source note: States that `!{}` buffers an unescaped value into the template and warns that this is risky for user content.
[[sources]]
url = "https://pugjs.org/language/interpolation.html"
title = "Pug documentation: `!{}` buffers an unescaped value into the template"

# Source note: States that a Jinja Environment enables HTML autoescaping only when its `autoescape` option is set.
[[sources]]
url = "https://jinja.palletsprojects.com/en/stable/api/"
title = "Jinja API documentation: the Environment autoescape option enables HTML autoescaping"

# Source note: Defines the `<%=` tag as replaced with the result of the Ruby expression, with no escaping step.
[[sources]]
url = "https://docs.ruby-lang.org/en/master/ERB.html"
title = "Ruby ERB documentation: `<%=` replaces the tag with the result of the expression"

# Source note: States that autoescaping is on only for templates ending in .html, .htm, .xml and .xhtml and for .svg under render_template(), so other template names are not escaped by default.
[[sources]]
url = "https://flask.palletsprojects.com/en/stable/templating/"
title = "Flask documentation: autoescaping is enabled by default only for .html, .htm, .xml, .xhtml and .svg templates"

# Source note: A test in the Handlebars repository stating that `{{&` expressions are not escaped.
[[sources]]
url = "https://github.com/handlebars-lang/handlebars.js/blob/master/spec/basic.js"
title = "Handlebars test suite: expressions written with `{{&` are not escaped"

# Source note: Describes the `|safe` filter, the autoescape default and the `{% autoescape false %}` block.
[[sources]]
url = "https://jinja.palletsprojects.com/en/stable/templates/"
title = "Jinja documentation: HTML escaping, the `|safe` filter and the `{% autoescape false %}` block"

# Source note: States that autoescaping escapes all output and that the `safe` filter marks output as not to be escaped.
[[sources]]
url = "https://mozilla.github.io/nunjucks/templating.html"
title = "Nunjucks documentation: autoescaping and the `safe` filter"

[decision]
question = "Is user- or attacker-influenced data ever written into the DOM through a raw-HTML sink (dangerouslySetInnerHTML, innerHTML, document.write, v-html, an autoescape-disabled template block, a Jinja Environment created without autoescape or a raw-output template tag such as EJS `<%-`, Rails ERB `raw`, `html_safe` or `<%==`, plain ERB `<%=`, Handlebars `{{{ }}}` or `{{& }}`, Pug `!=` or `!{}` or Jinja and Nunjucks `|safe`) without first passing through an HTML sanitizer?"
default = "sanitize-before-raw-html-sink"
why = """
A raw-HTML sink renders its argument as markup, not text: React's dangerouslySetInnerHTML, plain
DOM innerHTML, Vue's v-html and template-engine "safe"/"raw"/autoescape-off filters all skip the
framework's default output-encoding. Server-side template engines spell the same escape hatch in
their own syntax. EJS uses `<%-`. Rails ERB uses `raw`, `html_safe` and `<%==`. Handlebars uses
`{{{ }}}` and `{{& }}`. Pug uses `!=` and `!{}`. Jinja and Nunjucks use the `|safe` filter. Plain ERB (outside
Rails) inserts the result of every `<%=` tag as is, so every `<%=` there is a raw sink.
Jinja `{% autoescape false %}` switches escaping off for a whole block. A Jinja Environment created
without autoescape (the library default) leaves every template unescaped, and Flask autoescapes only
.html, .htm, .xml, .xhtml and .svg templates, so .j2, .jinja and .jinja2 files are unescaped there
too. A Nunjucks environment with autoescaping turned off does the same for every template. When the value passed to one of these sinks contains any
attacker-influenced substring (a stored comment, an uploaded profile field, a query-string
parameter echoed back), the attacker's own <script>/onerror=/onclick= markup executes in the
victim's browser session: classic stored or reflected cross-site scripting (CWE-79). The fix is
never "trust this one input" case by case; it is to run the value through an allowlist HTML
sanitizer (DOMPurify or equivalent) immediately before the sink, or to avoid the raw-HTML sink
entirely in favor of the framework's default escaped-text rendering.
"""

[[option]]
id = "sanitize-before-raw-html-sink"
label = "Sanitize with an allowlist HTML sanitizer immediately before any raw-HTML sink"
directive = "Any value reaching dangerouslySetInnerHTML, innerHTML, document.write, v-html, an EJS `<%-` tag, a Rails ERB `raw` call, `html_safe` call or `<%==` tag, a plain ERB `<%=` tag (which does not escape outside Rails), a Handlebars `{{{ }}}` or `{{& }}` expression, a Pug `!=` line or `!{}` interpolation, a Jinja or Nunjucks `|safe` filter, an autoescape-disabled template block (Jinja `{% autoescape false %}`) or a template environment with escaping off (a Jinja Environment created without autoescape, which is the library default, or a Nunjucks environment with autoescaping off) is passed through an allowlist HTML sanitizer (e.g. DOMPurify) at the point of use; content that never needs to carry real markup is rendered as plain escaped text instead of routed through a raw-HTML sink at all."
remediation = """
Wrap the value passed to the raw-HTML sink (dangerouslySetInnerHTML, innerHTML, an autoescape-disabled template block, EJS `<%-`, Rails ERB
`raw`, `html_safe` or `<%==`, plain ERB `<%=`, Handlebars `{{{ }}}` or `{{& }}`, Pug `!=` or `!{}`
or Jinja and Nunjucks `|safe`) in an
allowlist sanitizer such as DOMPurify.sanitize(...) at the point of use. If the content never
needs to carry real markup, switch to the engine's default escaped output instead (EJS `<%=`,
Rails ERB `<%=` without `raw`, plain ERB with an HTML escape helper such as `ERB::Util.html_escape` around the value, Handlebars
`{{ }}`, Pug `=` and `#{}` or Jinja and Nunjucks with autoescape turned on and no `|safe`). Verify by confirming a payload like
<img src=x onerror=alert(1)> renders as inert text or is stripped, never executes.
"""
why = "An allowlist sanitizer run at the point of use is the only fix that survives the value being edited or re-sourced later; per-caller manual escaping is easy to forget on the next code path that reaches the same sink."
