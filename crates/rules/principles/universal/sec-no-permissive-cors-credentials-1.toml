id = "SEC-NO-PERMISSIVE-CORS-CREDENTIALS-1"
title = "A CORS policy never combines a reflected or wildcard Access-Control-Allow-Origin with Access-Control-Allow-Credentials: true"
tag = "universal"
domain = "universal"
layer = "universal"
enforcement = "structured"
default = true
verification = "grounded"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/942.html"
title = "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"

[[sources]]
url = "https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS"
title = "MDN — Cross-Origin Resource Sharing (CORS)"

[[sources]]
url = "https://cheatsheetseries.owasp.org/cheatsheets/REST_Security_Cheat_Sheet.html"
title = "OWASP REST Security Cheat Sheet — CORS: never pair a reflected/wildcard origin with credentialed requests"

[decision]
question = "Does the CORS policy ever set Access-Control-Allow-Origin to a wildcard (*) or to a value reflected verbatim from the request's own Origin header, WHILE also setting Access-Control-Allow-Credentials: true?"
default = "never-combine-wildcard-or-reflected-origin-with-credentials"
why = """
Access-Control-Allow-Credentials: true tells the browser it is safe to send cookies and
Authorization headers on a cross-origin request and to expose the response to the calling page.
Pairing that with a wildcard origin is rejected outright by the CORS spec in credentialed mode,
which is why misconfigured servers instead REFLECT the request's own Origin header back verbatim to
satisfy the browser's same-value requirement while still accepting every origin. The result is
functionally identical to a wildcard: any website the victim's browser visits can issue a
credentialed request to the API and read the authenticated response, because the server will always
echo back whatever Origin the malicious page sent. The fix is an explicit, finite allowlist of
trusted origins checked before Access-Control-Allow-Origin is set, never a wildcard or an
unconditional reflection, whenever credentials are allowed.
"""

[[option]]
id = "never-combine-wildcard-or-reflected-origin-with-credentials"
label = "Check the Origin header against an explicit allowlist before ever allowing credentials"
directive = "Access-Control-Allow-Credentials: true is only ever set alongside an Access-Control-Allow-Origin value that came from checking the request's Origin header against an explicit, finite allowlist of trusted origins; a wildcard (*) or an unconditional reflection of the request's Origin header is never combined with credentialed CORS."
remediation = """
Replace the wildcard or unconditional Origin reflection with a lookup against an explicit allowlist
of trusted origins; only set Access-Control-Allow-Origin to the request's Origin header when it
matches an allowlist entry, and omit Access-Control-Allow-Credentials entirely for any origin that
does not. Verify by sending a request with an arbitrary, non-allowlisted Origin header and
confirming the response no longer reflects it back with credentials allowed.
"""
why = "A credentialed CORS response is exactly as powerful as a same-origin one; the allowlist check is the only mechanism that keeps 'any site can ask, with cookies attached' from being true for every visitor's browser."
