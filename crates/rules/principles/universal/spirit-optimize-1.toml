id = "SPIRIT-OPTIMIZE-1"
version = 3
title = "Optimization by default"
domain = "universal"
layer = "universal"
enforcement = "prose"
kind = "defect"
inspectable = true
default = true
# `policy`, not `grounded`: the CWE pages below define the inefficiency weaknesses to avoid (N+1
# style data access, excessive loop resource consumption); none of them says new code should be
# built with parallel async, caching or indexing from day one. That default is this project's own
# stance, and CWE-1089 in fact warns against too many indices. Only the owner sets `verified`.
verification = "policy"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/1073.html"
title = "MITRE CWE-1073: Non-SQL Invokable Control Element with Excessive Number of Data Resource Accesses"
relevance = "Defines the N+1 style weakness the default option's batched-queries wording avoids (a function that issues a large number of data accesses through a data manager instead of using efficient database capabilities). It describes a weakness to avoid; it does not say the efficient pattern must be built in from day one."

[[sources]]
url = "https://cwe.mitre.org/data/definitions/1050.html"
title = "MITRE CWE-1050: Excessive Platform Resource Consumption within a Loop"
relevance = "Defines the weakness of a loop body or condition that consumes platform resources such as sessions, locks or file descriptors. Supports avoiding per-iteration resource use; it says nothing about caching or parallelism as a default."

[[sources]]
url = "https://cwe.mitre.org/data/definitions/1049.html"
title = "MITRE CWE-1049: Excessive Data Query Operations in a Large Data Table"
relevance = "Defines the weakness of a query with many joins and sub-queries on a large table. Related to the query-shape half of the rule; it does not prescribe indexing, and CWE-1089 (a large table with an excessive number of indices) shows the standard treats over-indexing as a weakness too."

[[sources]]
url = "AGENTS.md"
title = "Project policy: performant patterns such as parallel async work, caching, indexing and avoiding N+1 queries are the default shape of new code"

[decision]
question = "When are performant patterns such as parallel async, caching, and indexing introduced into new code?"
default = "optimization-by-default"
why = "When AI carries the cost of writing the performant version, the Knuth-era 'premature optimization' calculus flips: the optimization is now nearly free and prevents the firefighting that reactive perf work costs later (5x+). Reactive optimization after problems surface is the known-expensive negative case: by the time a perf problem is observable to users or operators, the bad pattern has usually been copied across the codebase and the cleanup has to follow it everywhere, at far higher cost than baking the performant pattern in from day one."

[[option]]
id = "optimization-by-default"
label = "Optimization by default"
directive = "Bake performant patterns (parallel async, caching, indexing, no N+1) into conventions from day one, as the default shape of new code, not a reactive fix after profiling."
remediation = """
Bake the performant pattern (parallel async calls, caching, indexing, batched queries instead of N+1) into this code's default shape now, rather than shipping the naive version and waiting for profiling to justify fixing it later. Verify by confirming the new code already uses the performant pattern before it ships, not as a follow-up fix after a production slowdown.
"""
why = "When AI carries the cost of writing the performant version, the Knuth-era 'premature optimization' calculus flips: the optimization is now nearly free and prevents the firefighting that reactive perf work costs later (5x+)."

[[option]]
id = "performant-patterns-are-added-reactively-after-p"
violates = true
label = "Add performant patterns reactively after profiling"
directive = "performant patterns are added reactively after problems surface, with code written in whatever shape is convenient first and tuned later when profiling identifies the hot path"
why = "Reactive optimization is the known-expensive case: by the time a perf problem is observable to users, the bad pattern has typically been copied across the codebase and the cleanup has to follow it everywhere, at far higher cost than baking the performant pattern in from day one."
