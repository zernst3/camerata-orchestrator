[decision]
question = "How does the project name a helper that several modules need?"
default = "one-concept-has-one-name"
why = "A helper that exists under two names, in one module or in two, leaves every reader asking whether the two do the same thing, and every change has to be made twice or risks making them differ. A single implementation under the name that says what it does means a search for the name finds the one definition, new code reuses it instead of writing a third copy, and a fix lands everywhere at once."

[[option]]
id = "one-concept-has-one-name"
label = "Each helper exists once, under one name that says what it does, and modules do not carry their own copies of it"
directive = "Give a helper that does one thing a single implementation under a single name that says what it does, and import it wherever it is needed. Do not write a second helper with the same body under a different name, and do not keep two utility modules that each hold their own copy of the same functions. When duplicates already exist, keep one, re-export it from the old location while callers move, and delete the other."
remediation = """
Keep one implementation, under the name that says what it does. Re-export it from the old location while callers move to it, then delete the other copy. Where the listed bodies already differ, decide which version is correct before merging them. Verify by searching the repository for both names: only one definition should remain, and the project should still build and its tests pass.
"""
effort = "low"
why = "Keeping one implementation and re-exporting it during the move is a small, mechanical edit. Afterwards a search for the helper finds one definition, and a fix cannot be applied to one copy and forgotten in the other."

[[option]]
id = "the-same-helper-exists-under-several-names"
violates = true
label = "The same helper exists under several names, in one module or in different ones"
directive = "Write a new helper for each module that needs the behaviour, naming it as that module sees fit."
why = "When one helper exists under two names, a reader cannot tell whether the two behave the same, so people copy a third version or fix one and miss the other. The bodies drift apart without any error to show for it, and code that should behave identically starts to differ because it happens to call a different name."
