id = "SEC-CSRF-SERVER-RENDERED-FORMS-1"
version = 1
title = "A state-changing form or endpoint served to a browser with cookie-based sessions is protected by an anti-forgery token, a required custom header with restricted CORS, Fetch Metadata rejection or SameSite cookies plus an Origin or Referer check"
domain = "universal"
layer = "universal"
enforcement = "structured"
kind = "defect"
inspectable = true
cwe = ["CWE-352"]
default = true
verification = "grounded"
qualifies = "Applies to a server that renders HTML forms, or accepts form posts and scripted requests, from a browser that holds a session cookie, in any language or template engine (EJS, ERB, Handlebars, Pug, Jinja, Nunjucks, plain HTML and others). The fault is a state-changing request (a POST, PUT, PATCH or DELETE request or a GET request that changes data) that the server accepts on the strength of the session cookie alone, so a page on another site can make the visitor's browser send it. The request is protected when any one of these holds. The server checks an anti-forgery token that the form or script carries (a synchronizer token or a signed double-submit cookie). The server requires a custom request header on AJAX or API endpoints and the CORS policy does not allow other origins to send that header, so no token is needed. The server uses Fetch Metadata request headers (Sec-Fetch-Site) to reject cross-site requests, with an Origin or Referer check as the fallback for browsers that do not send them. The session cookie is SameSite=Strict, or SameSite=Lax with the __Host- prefix and no state change behind any GET handler, the application shares no registrable domain with a host or service its owner does not fully control. The server also verifies the Origin or Referer header against its own origin on state-changing endpoints. OWASP treats SameSite alone as enough only in narrow deployments that meet those conditions and as a defense in depth layer everywhere else. Not reported: an endpoint that authenticates only with a Bearer token, API key or signed request header that a browser does not attach on its own (no session cookie is involved), a webhook verified by a signature and a form that changes nothing on the server. Code that Rails or Django governs is left to RUBY-RAILS-CSRF-1 and PYTHON-DJANGO-CSRF-AUTH-1 when those rules are selected, so one fault is not reported twice; this rule applies to every other stack and to a Rails or Django project that those rules are not selected for. Coverage is the reviewed semantic read of the code; Camerata ships no deterministic check for this rule, because whether a token or header is verified on the server depends on middleware and framework configuration that a syntax check does not follow."

# Source note: Defines the weakness this rule carries in `cwe`: a server that does not confirm a request was deliberately made by its sender.
[[sources]]
url = "https://cwe.mitre.org/data/definitions/352.html"
title = "CWE-352: Cross-Site Request Forgery (CSRF)"

# Source note: Describes the synchronizer token pattern, custom request headers for AJAX and API endpoints, Fetch Metadata and Origin or Referer verification, and SameSite cookies as a defense in depth layer that is sufficient alone only in narrow deployments.
[[sources]]
url = "https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html"
title = "OWASP Cross-Site Request Forgery Prevention Cheat Sheet"

[decision]
question = "Does the server accept a state-changing request from a browser on the strength of the session cookie alone, with none of the protections below (an anti-forgery token, a required custom header with restricted CORS, Fetch Metadata rejection or SameSite plus an Origin or Referer check)?"
default = "cross-site-request-protection"
why = """
A browser attaches the visitor's session cookie to every request sent to the site, including a
request that a page on another site triggers by submitting a hidden form or loading a URL. If the
server treats the cookie as proof that the visitor meant to act, an attacker can change the
visitor's email address, move money or delete data by getting them to open one malicious page
(CWE-352). The fix is to require something a cross-site page cannot supply. That can be a random
anti-forgery token that the server generated, put in the form and verifies on submit. It can be a
custom request header that the server requires on AJAX or API endpoints, with a CORS policy that
keeps other origins from sending it. It can be Fetch Metadata headers that let the server reject
cross-site requests. It can be a SameSite cookie together with a server-side check that the Origin
or Referer header names the site's own origin. Requests that authenticate with a header the
browser never adds by itself, such as a Bearer token, do not have this weakness.
"""

[[option]]
id = "cross-site-request-protection"
label = "Every state-changing request from a cookie-authenticated browser is protected by a server-verified anti-forgery token, a custom request header, Fetch Metadata checks or a SameSite session cookie with an Origin or Referer check"
directive = "Every state-changing request that a browser sends with a session cookie is protected in one of four ways. It carries an anti-forgery token that the server generated and verifies before acting, sent in a hidden form field or a request header and never in the URL. It carries a custom request header that the server requires on AJAX or API endpoints, with a CORS policy that does not let other origins send it. The server rejects cross-site requests using Fetch Metadata (the Sec-Fetch-Site header), falling back to an Origin or Referer check for browsers that do not send it. Or the session cookie is SameSite=Strict (or SameSite=Lax with the __Host- prefix and no state change behind a GET handler), the application shares no registrable domain with a host it does not fully control. In that case the server also checks that the Origin or Referer header matches its own origin. Endpoints that authenticate only with a header a browser does not attach on its own may skip these checks."
remediation = """
Generate an anti-forgery token per session, render it into every state-changing form (or send it
in a request header from scripts) and reject any POST, PUT, PATCH or DELETE whose token is missing
or does not match, using your framework's CSRF middleware where one exists. If you rely on
SameSite cookies, set SameSite=Strict (or Lax with the __Host- prefix), confirm that no GET
handler changes data and that the application shares no registrable domain with a host you do
not fully control, and add an Origin or Referer check on state-changing endpoints. Verify by submitting
the form from a page on a different origin without a token and confirming the server rejects it.
"""
why = "A token, a custom header, a Fetch Metadata verdict or an origin check is something a page on another site cannot supply, so it separates a deliberate action from one the visitor's browser sent on an attacker's behalf."
