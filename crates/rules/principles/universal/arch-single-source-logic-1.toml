[decision]
question = "How does the project keep an application decision, such as a price, a fee, a status or a permission check, that several places need?"
default = "each-decision-is-implemented-once"
why = "A decision that is written out in more than one place has no single owner. When the rule changes, the copy that is corrected leaves the old rule running in the others, and nothing fails to show it: two screens quote different prices, or one path grants access that another denies. A single function in the module that owns the concept gives the decision one address, so a change to a rate, a threshold or a rule is one edit and a search for the function finds every user."

[[option]]
id = "each-decision-is-implemented-once"
label = "Each application decision is implemented once, in one function that every place needing it calls"
directive = "Implement each application decision (a price, a fee, a status derivation, a display name, a permission check, a tier or bucket computation) once, as one function in the module that owns the concept, and call that function wherever the decision is needed. Do not copy the logic into a second file. When a second copy already exists, move the logic into the owning module and replace every copy with a call, so a change to a rate, a threshold or a rule is one edit."
remediation = """
Move the logic into one exported function in the module that owns the concept, call it at every site listed in the finding, and delete the copies. Where the listed copies already differ, decide which version is correct before merging them, because the merged function will apply that version everywhere. Verify by searching the repository for the distinctive operator or value: only the one implementation should remain, and the project should still build and its tests pass.
"""
effort = "medium"
why = "The fix is an extraction with a clear check: one implementation, one call per site. After it, a corrected rule cannot be left running in a forgotten copy."

[[option]]
id = "the-same-decision-is-written-in-several-places"
violates = true
label = "The same application decision is written out in several places"
directive = "Write an application decision again in each file that needs it."
why = "Copies of one decision drift apart. When the rule changes, the copy that is corrected in one place leaves the old rule running in the others, and nothing fails to show it: two screens quote different prices, or one path grants access that another denies. A reader cannot tell which copy is the rule, so each change has to find every copy by text search, and a copy that is missed silently keeps the old behaviour."
