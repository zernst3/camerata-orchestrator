url = "docs/OVERNIGHT_DECISIONS.md"
title = "Decision record: the check works on whole files; unused individual exports are a separate rule"

[decision]
question = "What does the project do with a source file that no other file imports and nothing loads?"
default = "every-source-file-is-reachable"
why = "A source file that nothing imports or loads still has to be read, searched, type-checked and kept compiling, and it answers every search for the names it defines, so engineers change it, copy from it or build on it believing it is live. It hides which code is actually used, keeps its own dependencies alive, and misleads anyone estimating what a change can affect. Because it never runs, nothing fails when it drifts, so the first sign of trouble is a person trusting it. Deleting a file that is still referenced is caught by the build; keeping a file that nothing references is caught by no one, which is why the project states the rule."

[[option]]
id = "every-source-file-is-reachable"
label = "Every source file is imported by another file, loaded by a framework, build tool, manifest or test by convention, or carries a keep-file comment saying how it is loaded"
directive = "Every source file is imported by another file, is an entry point that a framework, build tool, manifest or test loads by convention, or carries a `keep-file:` comment in its first lines saying how it is loaded. When code stops being used, delete its file in the same change that removes its last use, and delete the files that only it imported. In Rust, every module file is declared by a `mod` statement in its crate."
remediation = """
Delete the file after confirming that nothing loads it: search the whole repository for its name, build and CI configuration included, and check that the build and the tests still pass without it. If something loads it in a way the repository does not show, such as a plugin host that reads a folder or a consumer outside this repository, say so in a `keep-file:` comment in the first lines of the file so the reason travels with the code. In Rust, either delete the file or add the `mod` declaration that was meant to bring it into the build.
"""
effort = "low"
why = "Deleting an unused file, or recording why it is kept, is a small edit with a clear check. It removes a source of confusion for every later reader and keeps searches and dependency lists honest."

[[option]]
id = "unreachable-files-are-kept"
violates = true
label = "Source files that no file imports and nothing loads are kept in the repository"
directive = "Leave a source file in place after nothing imports it and nothing loads it."
why = "A file that nothing imports or loads is still read, searched and maintained, and it turns up in every search for the names it defines, so engineers change it, copy from it or build on it believing it is live. It keeps its own dependencies alive and hides which code is actually used. Because it never runs, nothing fails when it drifts out of date, and the first sign of a problem is a person trusting it."
