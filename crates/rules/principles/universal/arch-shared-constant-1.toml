id = "ARCH-SHARED-CONSTANT-1"
version = 5
title = "A domain value such as a queue name, a route or a rate is defined once as a named constant and imported wherever it is used, never repeated as a bare literal across modules"
domain = "universal"
layer = "universal"
enforcement = "architectural"
kind = "defect"
inspectable = true
# Severity ceiling, transcribed from the rule's own framing: a domain value repeated across
# modules is a consistency problem that makes later changes harder, not a live fault in current
# behavior. The deterministic check emits at medium (a checker never emits low directly); this
# ceiling brings the exported finding down to low. It stays low even when the repeated copies
# disagree: whether two different values are meant to be the same fee is a judgment this check
# does not make.
max_severity = "low"
default = true
# `grounded`: CWE-1106 states the principle, that a literal used where a named constant belongs
# is a maintainability weakness. The cross-module form and the narrow four-shape definition of a
# domain value specified here are this project's own.
# Related controls (not citations, and deliberately not in `[[sources]]`): SonarSource S1192
# ("String literals should not be duplicated") counts repeats per file against a threshold of
# three, and eslint `no-magic-numbers` flags unnamed numbers per file; neither states the
# cross-file rule for a domain value, and neither separates a queue name from a translation key
# or a class name.
# Only the owner sets `verified`.
verification = "grounded"
qualifies = "Deterministically checkable, with no judgment involved, but deliberately narrow: only four kinds of value are treated as domain values, so the check misses most of what a person would call one rather than reporting something that is not. The four are a lowercase name split by a hyphen, a colon or a slash (a queue, topic, channel, bucket, feature flag, cache-key prefix or analytics event such as `orders-high` or `user:signup`), a route template (`/api/v1/orders`, `/orders/:id`), a multi-word upper-case token (`ORDER_CREATED`), and a decimal rate strictly between 0 and 1 with at least two significant digits (so `0.12` and `0.075`, not `0.9` or `0.001`; never 0.5, 0.25 or 0.75) that appears only as an operand of arithmetic (`total * 0.12`; string concatenation is not arithmetic). A value qualifies when it is written as a bare literal in at least two files of the same language family and the same package, or when it already has a named constant and is written as a bare literal in at least one other file of that package. A package is the nearest directory with a package manifest, or one application of a monorepo (`apps/web`, `packages/api`); two applications that cannot share code are not compared. The same text in two different languages is a shared contract, not a shared constant, and is never reported. A constant counts as the home when it is the initializer of a module-level constant, including inside an object or array, through `as const`, `Object.freeze`, a lazily initialised static, an enum member, a namespace member, a default or CommonJS export, a function that only returns the value, or an attribute of a module-level class. A file that holds the constant is not counted as a copy of it, and a constant defined in a configuration file counts as the home although copies in configuration files are never counted. Not reported: protocol text (header names, MIME types, encodings, cache and fetch tokens, locale tags, version numbers, identifiers), platform names, translation keys (a value passed to a translation function, or present as a key in a translation catalogue), CSS class names, utility class names and CSS keywords, HTML attribute values other than a route, DOM element ids and selectors, environment variable names (including those read from a request's metadata), URL names passed to a reverse or redirect call, cipher, model, region and error-code identifiers, members of a type union, enum or literal type, module specifiers, logger and span names, query-builder fragments, DOM and runtime event names, the keys of an object or a subscript, attribute arguments other than routes, file paths and URLs. Test code (test files and test-only modules and functions), fixture, seed, configuration and settings files, migrations, scripts, documentation, examples, generated code, declaration files and committed build output are not counted. Single words, dotted keys, snake_case strings and integers are out of scope, as are values inside Rust macro bodies, interpolated strings and string concatenations. A value that has two or more named homes and no bare copy is not reported. No off-the-shelf linter rule compares a domain value across modules, so this check has no external equivalent."

[[sources]]
url = "https://cwe.mitre.org/data/definitions/1106.html"
title = "MITRE CWE-1106: Insufficient Use of Symbolic Constants (literal values used where a named constant belongs make the code harder to maintain)"

[[sources]]
url = "docs/design/2026-10-21_w29-detector-implementation.md"
title = "Design notes: how the check finds a domain value repeated as a bare literal across modules, and the cases it must not report"

[[sources]]
url = "CORPUS_WORK_ORDER_CONSISTENCY_RULES.md"
title = "Project policy: a domain value has one named home"

[[sources]]
url = "docs/OVERNIGHT_DECISIONS.md"
title = "Decision record: only four narrow shapes count as a domain value, and two named homes with no bare copy are not a finding"

[decision]
question = "Where does the codebase define a queue name, a route, an event name or a rate that several modules use?"
default = "domain-literals-have-one-exported-home"
why = "A value that several modules write out as a literal has no single address. Changing it means finding every copy by text search, a copy that is missed keeps the old value, and the modules then disagree about a queue name, a route or a fee without any error to show for it. A named constant gives the value one definition that every user imports, so a change is one edit and a search for the constant's name finds every user."

[[option]]
id = "domain-literals-have-one-exported-home"
label = "Each queue name, route, event name and rate that several modules use is defined once as a named constant and imported wherever it is used"
directive = "Define each domain value that more than one module uses (a queue, topic, channel or bucket name, a feature flag, a route, an event name, a fee or other rate) once, as a named constant in the module that owns the concept, and export it. Import that constant at every use instead of writing the literal again, so that changing the value is one edit and a search for the constant's name finds every user. Protocol text, translation keys, class names, environment variable names, enum and union members and per-environment configuration are not domain values and stay where their framework expects them."
remediation = """
Define the value once, as a named constant, in the module that owns the concept, and export it. Replace each bare copy listed in the finding with an import of that constant. Verify by searching the repository for the quoted value: the only remaining occurrence should be the constant's definition, and the project should still build and its tests pass.
"""
effort = "low"
why = "The fix is a mechanical edit: one definition and one import per listed location. The result is a single address for the value, so a later change cannot leave two modules disagreeing."

[[option]]
id = "domain-literals-are-repeated-as-bare-values"
violates = true
label = "A queue name, route, event name or rate is written out as a bare literal in several modules"
directive = "Modules may write a domain value such as a queue name, a route or a rate directly as a literal wherever they need it."
why = "A value repeated as a literal in several modules has no single address. Changing it means finding every copy by text search, and a copy that is missed keeps the old value, so two modules silently disagree about a queue name, a route or a fee. The copies drift apart without any error to show for it, and a reader cannot tell which module owns the value."
