id = "SEC-NO-HARDCODED-SECRETS-1"
title = "Credential literals (API keys, tokens, passwords) are never hardcoded in source; they live in environment variables or a secrets manager"
tag = "universal"
domain = "universal"
layer = "universal"
enforcement = "mechanical"
default = true
verification = "grounded"

[[sources]]
url = "docs/ENFORCEMENT.md"
title = "docs/ENFORCEMENT.md — RULE_REGISTRY §SEC-NO-HARDCODED-SECRETS-1 (enforced gate rule)"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/798.html"
title = "CWE-798: Use of Hard-coded Credentials"

[[sources]]
url = "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
title = "OWASP Secrets Management Cheat Sheet"

[decision]
question = "Where do provider-agnostic credential literals (a key/secret/token/password assigned to a named variable) live?"
default = "env-or-secrets-manager"
why = """
`SEC-NO-VENDOR-TOKEN-1` catches known vendor-specific token SHAPES (AWS AKIA, GitHub gh*_, Stripe
sk_live_, …). This rule catches the provider-agnostic case those fixed-prefix patterns miss: a
long opaque literal assigned to an identifier whose name itself carries key/secret/token/
password/credential vocabulary (e.g. a Finnhub or other third-party API key with no distinctive
prefix of its own). The gate matches on the NAME-then-VALUE pattern rather than a vendor prefix,
so it generalizes to any provider without a dedicated shape rule. Once matched, the same remedy
applies regardless of vendor: the literal does not belong in source, and having been committed,
it must be treated as already disclosed.
"""

[[option]]
id = "env-or-secrets-manager"
label = "Credential literals live in env vars or a secrets manager, never source"
directive = "A quoted literal of 24+ contiguous alphanumeric characters assigned near an identifier containing key/secret/token/password/credential vocabulary is never written into a source or config file committed to the repository. Tests that need a credential value use an environment variable, a secrets manager fetched at test startup, or a clearly-fake placeholder that cannot be mistaken for the shape of a real key. The gate enforces this with a heuristic match (identifier vocabulary + a nearby long opaque literal) — it is not an entropy/AST analysis, so it complements rather than replaces a dedicated secret-scanning tool."
remediation = """
Remove the hardcoded credential literal from the source or config file, and load it from an environment variable or secrets manager instead. Rotate the exposed value, since it was committed to version control and must be treated as disclosed. Verify by searching the codebase for the literal value and confirming it no longer appears, while the integration still authenticates using the externally-loaded value.
"""
effort = "low"
finding_headline = "Your `<path>` file has a credential value hardcoded directly in the source."
finding_detail = """
A secret written directly into source code ships to everyone who can read this repository — including its full git history — rather than staying somewhere access can be revoked without a code change. The value in `<path>` is <gitignore-status> and is <history-status>. Move it to an environment variable or secrets manager, and rotate the exposed credential.
"""
why = "A hardcoded credential is disclosed the moment the commit is pushed, whether or not the repository is public today — a repository's visibility can change, forks persist independently, and CI logs/artifacts routinely echo file contents. Name-vocabulary + opaque-literal matching catches providers with no fixed token shape of their own, closing the gap `SEC-NO-VENDOR-TOKEN-1`'s prefix-anchored patterns leave open."

[[option]]
id = "allow-hardcoded-for-internal-tools"
label = "Allow hardcoded credentials in internal-only tooling"
directive = "credential literals may be hardcoded in scripts or tools that are never deployed externally, on the assumption that only trusted engineers can read the repository"
why = "Rejected: repository access scope changes over time (new hires, contractors, an accidental visibility flip, a fork), and a credential hardcoded 'for now' outlives the assumption that justified it. The environment-variable/secrets-manager pattern costs one extra line at call time and removes the assumption entirely."
