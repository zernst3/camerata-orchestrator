id = "JAVASCRIPT-REACT-EFFECT-CLEANUP-1"
version = 2
title = "An effect that starts an interval, a listener, a subscription or a connection returns a cleanup function that stops it"
domain = "javascript:react"
layer = "framework"
# `architectural`: a native checker (`EffectCleanupChecker`, crates/checks) answers the precise
# half of this rule and no off-the-shelf linter rule does (eslint-plugin-react-hooks has no
# cleanup rule). The checker opts into advisory coexistence, so the semantic read still covers
# the judgment half.
enforcement = "architectural"
kind = "defect"
inspectable = true
# Severity, transcribed from the work order: a leaked interval, listener or channel duplicates
# handlers, grows memory and keeps network connections open, a fault in running behavior that is
# not on its own a security or data-loss fault, so it ships at medium. The checker emits medium.
min_severity = "medium"
max_severity = "medium"
default = true
cwe = ["CWE-772"]
# `grounded`: React's own documentation states the contract (an effect that connects,
# subscribes or starts a timer returns a cleanup function, and React calls it before the next
# run and on unmount) and shows the leak in development's double mount. Only the owner sets
# `verified`.
verification = "grounded"
# Routing: only ECMAScript files (the JAVASCRIPT- id prefix) that mention an effect hook are
# sent this rule. `layouteffect` and `effect(` also admit wrapper hooks such as
# useIsomorphicLayoutEffect, useUpdateEffect and useDeepCompareEffect.
applies_to = { contains_any = ["useeffect", "layouteffect", "effect("] }
qualifies = "Applies to React function components and custom hooks. One shape is checked deterministically, with no judgment involved, in JavaScript, JSX, TypeScript and TSX files where useEffect or useLayoutEffect comes from react (or from Preact's hooks): a synchronous effect callback with a block body that, in its own body (not inside a nested callback), calls setInterval, addEventListener, subscribe, onAuthStateChange, onAuthStateChanged, onIdTokenChanged or onSnapshot, or constructs a WebSocket or an EventSource, and has no return statement that hands React a value. Not reported by the deterministic check: any effect that returns a value (the check does not judge whether the cleanup is complete); an expression-bodied arrow effect, which returns the subscription's own result; an async effect callback; work started only inside a nested callback; an effect that calls clearInterval, removeEventListener, unsubscribe, removeChannel, close or abort anywhere; a handle stored on a member such as a ref for another effect to stop; a listener added with once set to true, or on an object the effect itself created; setTimeout; test, story, generated, vendored and minified files. Everything else this rule covers (a one-shot timeout that sets state after the component unmounts, a ResizeObserver or IntersectionObserver never disconnected, a third-party widget never destroyed, a fetch whose response is applied after unmount with no abort or ignore flag, a cleanup that stops only part of what the effect started) is a judgment, and is assessed by the reviewed semantic read of the code rather than by the deterministic check. No off-the-shelf linter rule reports a missing effect cleanup: the React Hooks plugin checks hook order and dependency arrays only."

# Source note: Step 3 of the guide states that an effect which connects, subscribes or starts
# work returns a cleanup function, and shows the duplicate connection in development's double mount.
[[sources]]
url = "https://react.dev/learn/synchronizing-with-effects#step-3-add-cleanup-if-needed"
title = "React docs: Synchronizing with Effects: Step 3: Add cleanup if needed"

# Source note: The reference documents the setup function's optional cleanup return and when React
# calls it (before every re-run with changed dependencies and after unmount).
[[sources]]
url = "https://react.dev/reference/react/useEffect"
title = "React docs: useEffect (the setup function may return a cleanup function)"

# Source note: The Supabase realtime client documents removeChannel as the call that unsubscribes
# and removes a channel, the cleanup a channel opened in an effect needs.
[[sources]]
url = "https://supabase.com/docs/reference/javascript/removechannel"
title = "Supabase JavaScript reference: removeChannel (unsubscribe and remove a Realtime channel)"

# Source note: The recognised weakness code for a resource that is not released after the end
# of its useful lifetime; the code this rule carries in `cwe`.
[[sources]]
url = "https://cwe.mitre.org/data/definitions/772.html"
title = "CWE-772: Missing Release of Resource after Effective Lifetime"

[decision]
question = "When an effect starts an interval, a listener, a subscription or a connection, does it return a cleanup function that stops it?"
default = "effects-return-a-cleanup-for-what-they-start"
why = "React runs an effect after the component renders and runs it again whenever a dependency changes; in development it also mounts every component twice to expose exactly this fault. The only way React can stop what an effect started is the function the effect returns, which it calls before the next run and when the component unmounts. An effect that adds a window listener, starts an interval, subscribes to a realtime channel or store, or opens a socket and returns nothing leaves that work running: each re-run adds another copy, so a handler fires two, three or ten times per event, memory grows with every navigation, intervals keep polling after the page is gone and realtime connections stay open against the project's connection quota. Nothing throws, so the fault shows up as duplicated side effects, slowly rising memory and network usage that is hard to trace back to one missing return."

[[option]]
id = "effects-return-a-cleanup-for-what-they-start"
label = "Every effect that starts an interval, a listener, a subscription or a connection returns a cleanup function that stops it"
directive = "An effect that starts long-lived work returns a cleanup function that stops exactly what it started: `clearInterval` or `clearTimeout` for a timer, `removeEventListener` with the same handler for a listener, `unsubscribe` (or `supabase.removeChannel(channel)`) for a subscription or realtime channel, `close` for a socket or event source, `disconnect` for an observer, and an abort or an ignore flag for a request whose result is applied to state. The cleanup is returned on every path that starts the work, not only the main one. Long-lived work is never started inside an async effect callback, whose returned promise is not a cleanup."
remediation = """
In the effect at <path> that starts the interval, listener, subscription or connection named in the finding, keep the handle it returns and return a cleanup function that stops it: `const id = setInterval(...); return () => clearInterval(id);`, `window.addEventListener('resize', onResize); return () => window.removeEventListener('resize', onResize);` or `const channel = supabase.channel(...).subscribe(); return () => { supabase.removeChannel(channel); };`. Verify in development with React's Strict Mode on: the work is started once per mount (for example one interval tick per second, one realtime connection) and stops when you navigate away from the component.
"""
effort = "low"
why = "React calls the returned function before every re-run and on unmount, so each start is paired with exactly one stop and nothing outlives the component."

[[option]]
id = "effects-start-work-they-never-stop"
violates = true
label = "An effect starts an interval, a listener, a subscription or a connection and returns no cleanup function"
directive = "Effects may start intervals, add listeners, subscribe to channels or open connections without returning a cleanup function, relying on the component never re-rendering or unmounting."
why = "React can only stop what an effect started by calling the function the effect returns, so with no return the interval, listener, subscription or connection keeps running after the component unmounts, and every re-run of the effect adds another one. Handlers fire more than once per event, memory and open connections grow with every navigation, and state updates land on components that are gone. Nothing throws, so the fault appears as duplicated side effects and rising resource usage rather than as an error."
remediation = """
Return a cleanup function from the effect at <path> that stops the work it starts (`clearInterval`, `removeEventListener`, `unsubscribe`, `supabase.removeChannel(channel)` or `close`). Verify with React's Strict Mode on that the work runs once per mount and stops on unmount.
"""
effort = "low"
