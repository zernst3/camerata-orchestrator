id = "JAVASCRIPT-PUBLIC-ENV-PREFIX-SECRET-1"
title = "A bundler's public-env-var prefix (NEXT_PUBLIC_, VITE_, REACT_APP_, VUE_APP_, GATSBY_, PUBLIC_) is reserved for values safe to ship to every visitor; secrets never carry that prefix"
tag = "stack"
domain = "javascript"
layer = "universal"
enforcement = "mechanical"
default = true
verification = "grounded"
qualifies = "Deterministically checkable as a NAME-then-CONTEXT heuristic (a known public-prefix environment variable name, e.g. NEXT_PUBLIC_*, VITE_*, REACT_APP_*, VUE_APP_*, GATSBY_*, PUBLIC_* under SvelteKit's $env/static/public, whose own name or assigned value carries secret/key/token/password vocabulary) rather than an AST/build-output analysis — Camerata ships no detector for this; a project wiring an actual CI gate would need to grep source and .env files for the prefix pattern combined with secret-vocabulary matching, or inspect the built client bundle for the literal value, since the whole defect is that the bundler inlines the value at BUILD time with no runtime indirection. Conformance holds when no environment variable carrying a bundler's public prefix is ever assigned a credential, API secret, signing key, or database connection string; it fails when any public-prefixed variable name or its assigned value matches that vocabulary, regardless of whether the variable happens to be unused by current code (an unused secret-shaped public-prefixed variable is still inlined into the built bundle by some bundlers at build time if referenced anywhere, and is a landmine for the next person who reads it)."

[[sources]]
url = "https://nextjs.org/docs/app/guides/environment-variables#bundling-environment-variables-for-the-browser"
title = "Next.js docs — Environment Variables: 'any environment variable prefixed with NEXT_PUBLIC_... is inlined into the JavaScript bundle during build time, and distributed to the browser'"

[[sources]]
url = "https://vite.dev/guide/env-and-mode.html#env-variables"
title = "Vite docs — Env Variables: 'only variables prefixed with VITE_ are exposed to your client source code' — the explicit converse being that un-prefixed variables are NOT exposed, i.e. the prefix is an opt-in exposure mechanism"

[[sources]]
url = "https://create-react-app.dev/docs/adding-custom-environment-variables/"
title = "Create React App docs — Adding Custom Environment Variables: 'any other variables [besides NODE_ENV] are ignored... Any variables... starting with REACT_APP_ will be embedded in the JS bundle'"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/200.html"
title = "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"

[decision]
question = "Is a bundler's public-env-var prefix (NEXT_PUBLIC_, VITE_, REACT_APP_, VUE_APP_, GATSBY_, PUBLIC_) treated as an opt-in exposure mechanism reserved for values safe for every visitor to read, or does a secret ever get assigned to a variable carrying one of these prefixes?"
default = "public-prefix-reserved-for-non-secret-values"
why = """
Every mainstream JS bundler/framework ships a convention where an environment variable is invisible to client code
UNLESS its name carries a specific prefix, at which point the bundler inlines its literal value directly into the
built JavaScript bundle at BUILD TIME — Next.js's NEXT_PUBLIC_, Vite's VITE_, Create React App's REACT_APP_, Vue
CLI's VUE_APP_, Gatsby's GATSBY_, and SvelteKit's $env/static/public. The convention exists precisely so a developer
can opt specific, intentionally-public values (an analytics site id, a public API base URL, a publishable/anon key
meant to be visible) into the client bundle while everything else stays server-only by default.

The trap is that this looks exactly like the generic hardcoded-secrets problem SEC-NO-HARDCODED-SECRETS-1 and
SEC-NO-VENDOR-TOKEN-1 already catch, but it is a DIFFERENT mechanism and neither of those rules' matching logic sees
it: the value is correctly loaded from an environment variable (not a literal in source), the code looks completely
idiomatic (`process.env.NEXT_PUBLIC_STRIPE_SECRET_KEY`), and there is no hardcoded string anywhere in the
repository for a secret-literal scanner to find. The defect is entirely in the NAME: whoever named the variable
reached for the public prefix out of habit, or because it was the only prefix they knew made an env var 'work' on
the client, with no understanding that the prefix is specifically an inlining instruction to the bundler. The
secret gets baked into every bundle the build produces and shipped to every visitor's browser, readable by anyone
who opens devtools' Sources panel — no breach, no exfiltration technique, no attacker sophistication required at
all, just reading the file the site already serves them.
"""

[[option]]
id = "public-prefix-reserved-for-non-secret-values"
label = "Public-prefixed env vars never hold secrets; anything secret-shaped is renamed to drop the prefix and re-read server-side only"
directive = """
Scan environment variable declarations (`.env*` files, deployment config, process.env reads) for a name carrying a
bundler's public-exposure prefix (NEXT_PUBLIC_, VITE_, REACT_APP_, VUE_APP_, GATSBY_, PUBLIC_) whose name or
assigned value carries secret/key/token/password/credential vocabulary (a live API secret key, a database connection
string, a signing secret, a service-role key) — distinct from an intentionally-public value like a publishable/anon
key, a public analytics id, or a public API base URL, which legitimately belong under the prefix. Any secret-shaped
value found under a public prefix is renamed to drop the prefix (making it server-only by the bundler's own
convention) and re-read only from server-side code (a Server Component, an API route, a build-time script that
never ships its output to the client), never from client-side code that would need the public prefix to read it at
all.
"""
remediation = """
Rename the environment variable to drop the bundler's public-exposure prefix, and move the code that reads it from
client-side code to server-side-only code (a Server Component, an API route handler, a server-side build script) —
client code should never need to read a true secret at all. Confirm the old public-prefixed name is removed from
every .env file and deployment config, not merely renamed in one place while the old variable lingers. Verify by
rebuilding the client bundle and grepping the built output for the secret's literal value, confirming it no longer
appears anywhere the bundler emits to the client.
"""
effort = "low"
why = "The public prefix is a build-time inlining instruction, not a runtime-conditional one — once a secret-shaped value carries it, every build ships that literal value to every visitor's browser with no further action required by an attacker, which is categorically worse than a value merely being READABLE if accessed (it is pushed to everyone, proactively, on every page load)."

[[option]]
id = "secret-shaped-value-assigned-a-public-prefixed-variable"
label = "A credential, API secret key, or connection string is assigned to a variable carrying the bundler's public-exposure prefix"
directive = "An environment variable holding a live secret key, database connection string, or signing secret is named with the bundler's public-exposure prefix (NEXT_PUBLIC_*, VITE_*, REACT_APP_*, or equivalent) because that is the convention needed for SOME value in the codebase to be readable from client-side code, with no distinction made between values that are actually meant to be public and values that merely needed the developer's code to compile."
why = "Rejected: the prefix is a bundler-level instruction to inline the literal value into every build artifact shipped to every visitor's browser — it is not a runtime permission check, not an access-controlled endpoint, and not reversible after the fact by rotating application logic. A secret assigned this prefix is exposed to literally everyone who loads the page, discoverable with nothing more sophisticated than the browser's own built-in devtools, the moment the build that included it first shipped."

[[option]]
id = "secret-correctly-un-prefixed-but-read-from-client-side-code-anyway"
label = "The secret is correctly named without the public prefix, but client-side code attempts to read it anyway (reading as undefined at runtime)"
directive = "A secret environment variable is named without the bundler's public-exposure prefix (so the bundler does not inline it), but client-side code still attempts to read it via process.env or import.meta.env, receiving undefined at runtime rather than ever seeing the actual value."
why = "This is not itself a secret-exposure defect (the un-prefixed naming already prevents the bundler from inlining the value, so the client-side read genuinely receives undefined and the secret is never shipped) — but it is a sign of exactly the confusion that produces the real defect: a developer reaching for a value from client-side code without understanding the server/client boundary at all is one prefix-addition away from 'fixing' the undefined by adding the public prefix, which is when the actual exposure occurs. Treat a client-side read of a correctly-server-only variable as a prompt to move that code server-side, not as a cue to add the public prefix."
