id = "ARCH-ONE-IMPORT-PATH-1"
title = "A symbol has one import path — code outside a barrel imports it from one home, not from both the barrel and the file that defines it"
domain = "javascript"
layer = "language"
enforcement = "architectural"
kind = "defect"
inspectable = true
# Severity ceiling, transcribed from the rule's own framing: a split import path is a consistency
# problem that makes later moves and renames harder, not a live fault in current behavior. The
# deterministic check emits at medium (a checker never emits low directly); this ceiling brings
# the exported finding down to low.
max_severity = "low"
default = true
verification = "grounded"
qualifies = "Deterministically checkable from the repository's module graph, with no judgment involved: the check follows every named and default import through the re-exports (including aliased and star re-exports) to the file that actually defines the symbol, then reports a symbol only when code outside the re-exporting module's own folder reaches it through two or more different files. Files inside a barrel's folder importing their siblings directly, test files, and two spellings of the same file (a relative path versus a configured path alias) are not splits and are never reported. Namespace imports, dynamic imports and require calls are not followed, and a symbol whose re-export chain is ambiguous or circular is skipped, so a split they hide goes unreported rather than guessed at. A re-export that sits in the repository's root folder covers the whole repository and so suppresses the check for that symbol. No off-the-shelf linter rule detects a symbol reachable by two paths: rules that restrict which folders may be imported from limit reaching into a module, but do not compare the paths used for one symbol across files."

# Source scope, for the next author: the first establishes the mechanism only (an export-from gives a
# binding a second import path; it states no convention about which path callers use). The second
# supports the barrel facet (a folder's entry point is the intended outside path) but does not compare
# the paths used for one symbol across files, so it is a related control, not a substitute.
[[sources]]
url = "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/export"
title = "MDN Web Docs — export statement (re-exporting / aggregating modules: a re-export gives a binding a second import path)"

[[sources]]
url = "https://github.com/import-js/eslint-plugin-import/blob/main/docs/rules/no-internal-modules.md"
title = "eslint-plugin-import — no-internal-modules (prevent importing the submodules of other modules, so callers use a module's public entry point)"

[decision]
question = "When a symbol is both defined in one file and re-exported from a barrel, which import path does the code outside that barrel's folder use for it?"
default = "one-import-home-per-symbol"
why = "A symbol that outside code imports from two different files has two public addresses. A rename, a move or a split of the symbol must then be chased through both paths, callers drift to whichever path they last copied, and the barrel stops being the public surface because other code reaches around it. Files inside the barrel's own folder importing their siblings directly is the normal way to avoid import cycles and is not part of this problem; the problem is outside callers disagreeing with each other about where a symbol lives."

[[option]]
id = "one-import-home-per-symbol"
label = "Code outside a barrel's folder imports each symbol from one home, either the file that defines it or the barrel, never both"
directive = "Import each symbol from one home: either the file that defines it or a single barrel that re-exports it. Code outside a barrel's own folder uses the same path for a given symbol everywhere, while files inside the barrel's folder may import their siblings directly. When a symbol is reachable by both its defining file and a barrel, choose one path, update every outside caller to use it, and remove the other path."
remediation = """
Choose one import path for the symbol, usually the barrel when the folder already has one, and change every import of it from outside that folder to use the chosen path. If nothing should go through the barrel, remove its re-export of the symbol instead, so only the defining file remains. Verify by confirming every import of the symbol from outside the barrel's folder now names the same file, and that the project still builds and its tests pass.
"""
effort = "low"
why = "The fix is a mechanical edit of import lines, so the cost is small and the result is a single address for the symbol that later renames and moves can follow."

[[option]]
id = "a-symbol-is-imported-from-both-its-barrel-and-its-defining-file"
violates = true
label = "A symbol is imported from both a barrel that re-exports it and the file that defines it"
directive = "Callers outside a barrel's folder may import a re-exported symbol from either the barrel or the file that defines it, whichever they prefer."
why = "Two import paths to one symbol mean a rename, move or split of that symbol has to be chased through both, and a path left unchanged breaks only the callers that happened to use it. The barrel stops being the public surface because other code reaches around it, and each new caller copies whichever path it saw last, so the split widens over time."
