id = "FIREBASE-RULES-OWNERSHIP-1"
version = 2
title = "Update rules compare the caller to the owner recorded on the stored document, not to an owner field the caller sends"
domain = "firebase"
layer = "platform"
enforcement = "architectural"
kind = "defect"
inspectable = true
cwe = ["CWE-639"]
max_severity = "high"
min_severity = "medium"
default = true
verification = "grounded"
qualifies = "The incoming only comparison is checked mechanically; whether a collection is per user is reviewed. Mechanical part: an allow for update or write whose condition compares request.auth.uid only to the incoming document (request.resource.data.<field>), with no comparison to the stored document (resource.data.<field>) or to the path wildcard and no condition that pins that field, is reported as high. A field is pinned by comparing it to the stored value or to the path wildcard, forcing it to a constant, an affectedKeys().hasOnly or keys().hasOnly list that excludes it, a negated affectedKeys().hasAny or keys().hasAny list that names it, or unchangedKeys().hasAll naming it; any other affectedKeys, unchangedKeys or hasAny construct is not modelled and silences the rule. The incoming document is whatever the caller sends, so the rule lets any signed in user take over a document by sending their own id. Create only rules, rules with an alternative joined by or, and helper functions that read the stored document are never reported. Judgment part for the semantic pass: look for paths whose wildcard is a user id (userId, uid) or whose parent is users, profiles or accounts, with reads or writes that reference neither the wildcard nor an owner field, and report those as advisory findings. A rules file that firebase.json does not name (found only by its conventional name, or in a repository with no firebase.json) or that sits under an examples, example, samples, sample or docs folder is held for review with the reason stated, never asserted, and a critical severity is lowered to high. Rules edited in the Firebase console never land in the repository, so a repository scan reads only the rules file the project deploys."

[[sources]]
url = "https://firebase.google.com/docs/rules/basics"
title = "Basic Security Rules"

[[sources]]
url = "https://firebase.google.com/docs/rules/rules-language"
title = "Security Rules language"

[decision]
question = "Do update rules compare the caller to the stored owner or to the owner field the caller sends?"
default = "owner-compared-to-the-stored-document-on-update"
why = "In a Firestore rule, request.resource is the document as the caller sends it and resource is the document as stored. An update rule that checks the owner against the incoming document trusts the caller's own claim of who owns it. Firebase's content owner example checks resource.data for update and delete."

[[option]]
id = "owner-compared-to-the-stored-document-on-update"
label = "Update rules compare the caller to the owner recorded on the stored document"
directive = "An update or delete rule checks request.auth.uid against the owner field of the stored document (resource.data) or against the path wildcard. A create rule may check the incoming document (request.resource.data), because no stored document exists yet. When an update also looks at the incoming owner field, it requires that field to equal the stored one."
remediation = "On `<path>`, compare the caller to `resource.data.ownerId` (the stored document) for update and add `request.resource.data.ownerId == resource.data.ownerId` so the owner cannot be reassigned. Deploy and confirm in the emulator that a signed in user cannot update another user's document by sending their own id."
effort = "low"
why = "Checking the stored owner means a caller cannot claim a document by writing their own id into it."

[[option]]
id = "ownership-taken-from-the-incoming-document"
violates = true
label = "An update rule trusts the owner field in the document the caller sends"
directive = "Authorise an update by comparing the caller to the owner field of the document being written."
why = "A signed in user can update any document under the path by sending their own id in the owner field, because the rule compares the caller to what the caller sent instead of to what is stored. That reassigns the document to them. Firebase's update example checks the stored document."
