id = "ARCH-HOT-READ-CACHE-1"
title = "Hot reads sit behind a TTL cache with explicit write-side invalidation"
domain = "api-layer"
layer = "universal"
enforcement = "structured"
kind = "default_with_exceptions"
inspectable = true
default = true
verification = "grounded"

[[sources]]
url = "https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside"
title = "Azure Architecture Center — Cache-Aside pattern"

[decision]
question = "What position does the project take on: Hot reads sit behind a TTL cache with explicit write-side invalidation?"
default = "hot-reads-sit-behind-a-ttl-cache-with-explicit-write-side-invalidation"
why = "Cache hits are typically sub-millisecond while a database round trip is tens of milliseconds; the speedup is on the order of 20 to 50 times for the common path, free per request once warmed. Explicit invalidation on the write side keeps stale-read windows short, and the TTL catches the cases the invalidation logic misses: cross-service writes, missed code paths, schema-level changes, manual DB edits. TTL length is a per-service call against staleness tolerance; the rule commits to having a TTL, not to a specific value. Skipping the cache layer entirely makes every request pay the database round trip; it works fine at low volume but accumulates latency cost as the system grows, and there is no graceful migration once the hot reads become a bottleneck. Cache with TTL only and no write-side invalidation is simpler to implement but produces longer windows of stale reads, and a request that just made a change cannot reflect it until the TTL expires, which surfaces as 'why did my update not stick' UX bugs. Cache with invalidation only and no TTL is correct under explicit writes but unsafe when something changes outside the invalidation paths (backfill scripts, replication catch-up, manual DB edits, third-party data ingest), because the cache then carries indefinitely stale data with no backstop."

[[option]]
id = "hot-reads-sit-behind-a-ttl-cache-with-explicit-write-side-invalidation"
label = "Hot reads sit behind a TTL cache with explicit write-side invalidation"
directive = "Read paths with high request volume and slowly-changing data sit behind a cache with a TTL. Writes that affect those reads explicitly invalidate the relevant cache keys. The TTL is the backstop for missed invalidations, not the primary mechanism. Apply to directory listings, profile lookups, RBAC and permission resolutions, and similar read-heavy endpoints. Do NOT apply to mutating paths, reads that are unsafe if stale (in-flight auth decisions, idempotency-key lookups), or paths where the caller expects to see their own just-completed change immediately."
remediation = """
Add a cache with a TTL in front of the hot read path, and add explicit cache-key invalidation to every write path that changes the underlying data. Treat the TTL as the backstop for a missed invalidation, not the primary staleness control. Verify by writing new data through the write path and confirming the next read reflects it immediately (via invalidation), not only after the TTL expires.
"""
why = "Cache hits are typically sub-millisecond while a database round trip is tens of milliseconds; the speedup is on the order of 20 to 50 times for the common path, free per request once warmed."

[[option]]
id = "hot-reads-run-directly-against-the-database-with"
violates = true
label = "No cache layer"
directive = "hot reads run directly against the database with no cache layer; every read request pays the full database round trip"
remediation = """
Put a cache in front of this read path with BOTH controls: a TTL so entries expire on a fixed schedule, and explicit cache-key invalidation on every write path that changes the data behind it. Running the read uncached is a deliberate choice only where the database load is measured and acceptable; otherwise the read re-queries on every request and the cost grows with traffic. Verify by confirming a cached entry is served without a database query, that a write invalidates it immediately, and that an entry still expires on its own if an invalidation is ever missed.
"""
why = "No cache layer makes every request pay the full database round trip; it works fine at low volume but accumulates latency cost as the system grows, and there is no graceful migration once hot reads become a bottleneck."

[[option]]
id = "hot-reads-sit-behind-a-ttl-cache-with-no-write-s"
violates = true
label = "TTL only, no invalidation"
directive = "hot reads sit behind a TTL cache with no write-side invalidation; the TTL is the only mechanism that controls staleness"
remediation = """
Add explicit cache-key invalidation to every write path that changes the data behind this read path, keeping the existing TTL as the backstop. With the TTL alone, a write is invisible to readers until the entry happens to expire, so the staleness window is the TTL rather than zero no matter how fresh the data needs to be. Verify by writing new data and confirming the very next read reflects it, rather than waiting out the TTL.
"""
why = "A TTL-only cache produces longer stale-read windows, and a request that just made a change cannot reflect it until the TTL expires, which surfaces as 'why did my update not stick' UX bugs."

[[option]]
id = "hot-reads-sit-behind-a-cache-with-explicit-write"
violates = true
label = "Invalidation only, no TTL"
directive = "hot reads sit behind a cache with explicit write-side invalidation but no TTL; the cache trusts the invalidation paths to cover every change"
remediation = """
Set a TTL on this cache's entries as a backstop alongside the existing write-path invalidation. Without one, correctness depends on every current and future write path remembering to invalidate: the first one that forgets serves a stale entry indefinitely, with no expiry to recover it and nothing to signal the omission. Verify by confirming an entry expires on its own after the TTL even when no invalidation call runs.
"""
why = "Invalidation-only caching is unsafe when something changes outside the invalidation paths (backfill scripts, manual DB edits, third-party data ingest), because the cache then carries indefinitely stale data with no backstop."
