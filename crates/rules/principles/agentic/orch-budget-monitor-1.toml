id = "ORCH-BUDGET-MONITOR-1"
version = 4
title = "Budget self-monitoring"
domain = "agentic"
layer = "universal"
enforcement = "prose"
kind = "defect"
inspectable = false
default = true
verification = "grounded"

[[sources]]
url = "https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/"
title = "OWASP Top 10 for LLM Applications, LLM10:2025 Unbounded Consumption (quotas, resource limits and timeouts keep model use from running up unbounded cost)"

[[sources]]
url = "AGENTS.md"
title = "Project policy: an autonomous run tracks its own spend against a cap, and a wrapper enforces a hard limit before each model call"

[decision]
question = "How should an autonomous run cap its spend?"
default = "rolling-window-plus-per-session-caps"
why = "An unattended routine needs a real ceiling; per-run caps prevent runaway, and the rolling cap is the operational guard. Running with no budget caps is acceptable only for attended, short runs where a human can intervene before spend escalates; an unattended routine has neither property, and one stuck loop or runaway request pattern can burn arbitrarily much money before the next human glance at the monitor. A per-session cap alone bounds any single run but lets independent runs accumulate unbounded spend across a window, so it leaves the aggregate runaway case uncovered."

[[option]]
id = "rolling-window-plus-per-session-caps"
label = "rolling-window + per-session caps, enforced by a wrapper"
directive = "Track spend in a rolling window against a safety threshold, with per-session caps, and self-check periodically during a run. A wrapper enforces hard limits before invoking the model."
remediation = """
Wrap the agent invocation with a spend monitor that tracks cost in a rolling window against a configured safety threshold, and set a hard per-session cap the wrapper enforces before each model call. Have the run self-check its remaining budget periodically rather than only at the start. Verify by running past the threshold in a test session and confirming the wrapper halts the run instead of letting spend continue unbounded.
"""
why = "A rolling-window cap plus per-session caps covers both the single-run runaway and the cross-run accumulation cases, and the wrapper makes the limit non-bypassable."

[[option]]
id = "per-session-cap-only"
violates = true
label = "per-session cap only"
directive = "Each autonomous run enforces a single per-session spend cap and halts when it is reached, with no rolling-window safety threshold across runs."
why = "Independent runs can still accumulate unbounded spend across a window: a per-session cap bounds any single run but does not cover the aggregate runaway case."

[[option]]
id = "no-budget-caps"
violates = true
label = "no budget caps"
directive = "The autonomous run operates with no budget caps and no rolling-window safety threshold."
why = "Unattended routines can escalate spend with nothing to stop them. Running without caps is only tolerable for attended, short runs where a human can intervene in time."
