id = "ORCH-CLEAR-WINNER-1"
version = 3
title = "The clear-winner test — decide vs. stop"
domain = "agentic"
layer = "universal"
enforcement = "prose"
kind = "decision"
inspectable = false
default = true
verification = "policy"

[[sources]]
url = "AGENTS.md"
title = "Project policy: before stopping to ask a person, apply a documented convention or a guiding principle that settles the choice"

[decision]
question = "When an agent faces a choice between several valid options, how does it decide whether to proceed or stop for a human?"
default = "the-clear-winner-test-decide-vs-stop"
why = "Most language/framework choices have a canonical answer; stopping on those wastes the human's attention. The test separates textbook choices (apply) from genuine judgment calls (escalate). Stopping on every multi-option choice blocks the routine constantly on textbook decisions that have a single defensible answer, draining the human attention the rule exists to conserve. Auto-deciding everything drifts into bad one-way-door calls, since the calculus of high confidence on a textbook choice does not carry across to confidence on a structural change with no canonical answer."

[[option]]
id = "the-clear-winner-test-decide-vs-stop"
label = "The agent decides on its own when a documented convention or a guiding principle settles the choice, and stops for a human only when neither does"
directive = "Before stopping for a human, run the test. (a) Is there a documented convention? Apply it, cite it, continue. (b) Does a guiding principle (e.g. robustness) break the tie? Apply the winner, document it, continue. Stop only if neither resolves it."
remediation = """
Before an autonomous run escalates a choice to a human, have it check for a documented project convention or a guiding principle (such as robustness) that already resolves the tie; apply and cite that instead of stopping. Reserve the human-escalation path for choices where neither a convention nor a principle settles the question. Verify by reviewing a sample of past escalations and confirming none of them had a citable convention the agent missed.
"""
why = "Most language/framework choices have a canonical answer; stopping on those wastes the human's attention."

[[option]]
id = "the-agent-stops-and-escalates-to-a-human-reviewe"
label = "Stop on every choice"
directive = "the agent stops and escalates to a human reviewer on every multi-option choice, regardless of whether a documented convention or a guiding principle would resolve it"
why = "Stopping on every multi-option choice blocks the routine constantly on textbook decisions that have a single defensible answer, draining the human attention the rule exists to conserve."

[[option]]
id = "the-agent-auto-decides-on-every-multi-option-cho"
label = "Auto-decide on every choice"
directive = "the agent auto-decides on every multi-option choice, regardless of whether the call is reversible or how far it travels in the architecture"
why = "Auto-deciding everything removes the human gate on structural changes; a confident agent can produce a bad one-way-door call whose calculus does not carry across to reversible textbook choices."
