url = "docs/OVERNIGHT_DECISIONS.md"
title = "Decisions log, DECISIONS MADE, 2026-10-21: the clone detector and the three rules built on it are in V1 scope"

[decision]
question = "Where does the project build a UI mechanism, such as a spinner, a retry control or an outside-click dismiss, that several components need?"
default = "repeated-ui-mechanisms-are-one-shared-component"
why = "A mechanism that is written out again in each component has no single owner. A fix or an accessibility improvement lands in the copy someone happened to open, the others keep the old behaviour, and the screens slowly stop behaving alike. One shared hook or component in the shared UI module gives the mechanism one address, so a change is one edit and every screen picks it up."

[[option]]
id = "repeated-ui-mechanisms-are-one-shared-component"
label = "A UI mechanism that several components need is built once as a shared hook or component and used by each of them"
directive = "Build a UI mechanism that more than one component needs (a loading spinner, a retry control, a menu host, an empty state, a focus trap, an outside-click dismiss, a scroll lock) once, as a hook or a component in the shared UI module, and use it in each place that needs it. Do not hand-write the same mechanism again inside another component. When copies already exist, extract the mechanism and replace each copy with a use of it."
remediation = """
Extract the mechanism into one hook or component in the shared UI module, replace each copy listed in the finding with a use of it, and pass what differs (labels, class names, event names) as arguments or props. Verify by searching the repository for the mechanism's distinctive call, such as the event name or the hook it uses: it should appear only in the shared module, and the affected screens should still behave as before.
"""
effort = "low"
why = "Extracting a repeated mechanism is a mechanical edit: one hook or component, one use per listed place. Afterwards a fix or an improvement to the mechanism reaches every screen at once."

[[option]]
id = "ui-mechanisms-are-hand-written-per-component"
violates = true
label = "The same UI mechanism is hand-written again in each component that needs it"
directive = "Write a UI mechanism inside each component that needs it."
why = "Copies of one UI mechanism drift apart. A fix or an accessibility improvement lands in the copy someone happened to open and the others keep the old behaviour, so screens that should behave alike slowly stop doing so, and a reader cannot tell which copy is the intended one."
