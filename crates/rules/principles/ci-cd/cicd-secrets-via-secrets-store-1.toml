id = "CICD-SECRETS-VIA-SECRETS-STORE-1"
title = "CI job secrets are injected from the platform's encrypted secrets store, scoped to the jobs that need them; never a plaintext literal in the workflow file"
tag = "stack"
domain = "ci-cd"
layer = "universal"
enforcement = "structured"
default = true
verification = "grounded"
qualifies = "Enforced by a scan over CI workflow definitions (.github/workflows/*.yml and equivalents) for an `env:` block, a `with:` input, or an inline command assigning what looks like a live credential (a vocabulary match similar to SEC-NO-HARDCODED-SECRETS-1/SEC-NO-VENDOR-TOKEN-1's heuristic, applied to YAML rather than application source) as a literal string, rather than a reference to the platform's secrets context (`${{ secrets.NAME }}` on GitHub Actions, or the equivalent on GitLab CI/CircleCI/Azure Pipelines). A second, independent check is scope: a secret referenced in a job that does not need it (a lint/test job pulling in a deploy credential 'just in case') is also a finding distinct from the literal-vs-reference check, since narrower scoping limits the blast radius of a compromised job regardless of how the secret is injected. Conformance holds when every credential used in CI flows through the platform's secrets store and each job references only the secrets its own steps actually use; it fails when a credential is a literal in the workflow file, or when a job's access to a secret is broader than what its own steps require."

[[sources]]
url = "https://cwe.mitre.org/data/definitions/798.html"
title = "CWE-798: Use of Hard-coded Credentials"

[[sources]]
url = "https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions"
title = "GitHub docs — Using secrets in GitHub Actions: secrets are encrypted and only exposed to the jobs/steps that explicitly reference them"

[[sources]]
url = "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
title = "OWASP Secrets Management Cheat Sheet"

[decision]
question = "Does every CI job that needs a credential reference it from the platform's encrypted secrets store (scoped only to the jobs/environments that actually need it), or does any workflow embed the literal credential value directly in the workflow definition?"
default = "secrets-store-reference-scoped-to-needing-jobs"
why = """
A CI workflow file is source code: it is committed, reviewed in pull requests (where CI itself often posts a diff
comment), browsable in the repository's history forever, and — depending on the repository's visibility and access
controls — potentially readable by a far larger audience than the application's own source. A credential pasted
directly into a workflow's `env:` block or a step's inline command is exposed to every one of those readers exactly
as if it had been committed to application source, which `SEC-NO-HARDCODED-SECRETS-1` and `SEC-NO-VENDOR-TOKEN-1`
already forbid there — CI YAML is not a special exemption from the same principle, it is simply a different file
extension the same mistake shows up in.

Beyond the literal-vs-reference question, SCOPE matters independently: every CI platform's secrets mechanism lets a
secret be made available only to the specific jobs, environments, or branches that need it, rather than to the
entire workflow by default. A deploy credential referenced in a `lint` or `test` job that never actually deploys
widens the blast radius of that job being compromised (a malicious dependency executing during `npm test`, for
example) to include a credential that job had no legitimate reason to touch. Scoping each secret to only the job(s)
whose steps actually consume it means a compromise of one job exposes only what that job was scoped to, not every
credential the project owns.
"""

[[option]]
id = "secrets-store-reference-scoped-to-needing-jobs"
label = "Every credential is injected via the platform's encrypted secrets context, scoped only to the job(s) that actually use it"
directive = """
Every CI credential (an API key, a cloud deployment identity, a database password, a signing key) is stored in the
CI platform's encrypted secrets store (GitHub Actions repository/environment secrets, or the equivalent on the
project's CI platform) and referenced in the workflow only via the platform's secrets-context syntax
(`${{ secrets.NAME }}` on GitHub Actions), never as a literal value in the workflow YAML, a committed script, or an
inline command. Each secret is scoped (via a GitHub Environment, a protected/masked CI variable, or the platform
equivalent) to only the job or jobs whose steps actually consume it — a job that does not deploy does not have
access to the deploy credential, even though it could technically be made available workflow-wide.
"""
remediation = """
Move the credential out of the workflow file and into the CI platform's encrypted secrets store, and reference it
via the platform's secrets-context syntax instead of a literal value. Scope the secret (via an Environment or
equivalent) to only the job(s) whose steps actually use it, removing it from jobs that referenced it unnecessarily.
Rotate the credential, since its prior plaintext presence in the workflow file means it must be treated as already
disclosed. Verify by confirming the workflow file contains no literal credential value, and that a job which does
not need the secret cannot read it (the platform's own scoping prevents it, not merely convention).
"""
effort = "medium"
why = "A workflow file is reviewed, diffed, and retained in git history exactly like application source, so a credential pasted into it is disclosed exactly as surely as one hardcoded in source; scoping each secret to only the jobs that need it additionally limits how much a single compromised job can expose, rather than making every CI credential reachable from every job by default."

[[option]]
id = "secret-literal-in-workflow-yaml"
label = "A credential is pasted directly into the workflow file's env block or an inline command, rather than referenced from the secrets store"
directive = "A CI workflow sets an API key, deployment credential, or other secret as a literal string value in an env: block or directly in a step's run command, rather than referencing it from the platform's encrypted secrets context."
why = "Rejected: a workflow file is committed, code-reviewed, and retained in git history exactly like any other source file, so a literal credential in it is disclosed to every reader of the repository and its history, through the same mechanism SEC-NO-HARDCODED-SECRETS-1 and SEC-NO-VENDOR-TOKEN-1 already forbid for application source — CI YAML gets no special exemption."

[[option]]
id = "secrets-store-reference-but-unscoped-workflow-wide"
label = "Reference every secret from the platform's secrets store correctly, but make all secrets available workflow-wide rather than scoping each to the job(s) that need it"
directive = "Every credential is correctly referenced via the CI platform's secrets context rather than a literal value, but no job-level or environment-level scoping is applied — every job in the workflow can reference every secret the repository has configured, regardless of whether that job's own steps use it."
why = "Rejected as incomplete: this closes the literal-value disclosure risk but leaves the blast-radius problem open — a single compromised job (a malicious transitive dependency executing arbitrary code during a build or test step, for example) can read and exfiltrate every secret the project has configured, not just the ones its own task legitimately needed. Scoping each secret to the job(s) that actually use it is a second, independent control that a correct secrets-store reference does not provide on its own."
