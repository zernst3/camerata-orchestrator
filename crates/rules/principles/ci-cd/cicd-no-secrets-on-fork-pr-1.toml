id = "CICD-NO-SECRETS-ON-FORK-PR-1"
title = "A workflow that checks out and executes an untrusted fork PR's own code never has secrets available to it; pull_request_target is never combined with a checkout of the PR's head ref"
tag = "stack"
domain = "ci-cd"
layer = "universal"
enforcement = "structured"
default = true
verification = "grounded"
qualifies = "Enforced by a scan over workflows triggered on `pull_request_target` (or, on platforms with an equivalent 'runs with base-repo context/secrets even for fork PRs' trigger) for a checkout step that checks out the PR's HEAD ref (`ref: ${{ github.event.pull_request.head.sha }}` or equivalent) followed by a build/test/install step that executes code from that checkout, in a workflow that also has repository/environment secrets available to it. The companion, safer trigger `pull_request` (which runs with no secrets for a fork PR, by GitHub's own design) is explicitly NOT a match. Conformance holds when a pull_request_target workflow either never checks out the fork's own head ref at all (limiting itself to trusted base-branch content, e.g. posting a label or comment) or, if it must build/test fork code, does so with secrets explicitly withheld from that step; it fails when both the untrusted checkout and secret availability are present in the same job."

[[sources]]
url = "https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/"
title = "GitHub Security Lab — Preventing pwn requests: pull_request_target combined with checking out and executing the PR's head gives untrusted fork code access to the workflow's secrets and write permissions"

[[sources]]
url = "https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#pull_request_target"
title = "GitHub docs — Events that trigger workflows: pull_request_target runs in the context of the base repository, with its secrets, even when triggered by a fork PR"

[[sources]]
url = "https://cwe.mitre.org/data/definitions/829.html"
title = "CWE-829: Inclusion of Functionality from Untrusted Control Sphere"

[decision]
question = "Does a workflow triggered by pull_request_target avoid checking out and executing a fork PR's own head-ref code while secrets are available to it, or does it combine the two — giving an external contributor's PR code a path to the base repository's secrets and write-scoped token?"
default = "never-combine-fork-checkout-with-secrets-on-pull-request-target"
why = """
`pull_request` and `pull_request_target` look superficially interchangeable but differ in exactly the dimension
that matters here: a `pull_request`-triggered workflow from a FORK runs with a read-only token and NO access to the
base repository's secrets — GitHub's own deliberate design, specifically so that a malicious contributor's PR
cannot exfiltrate anything by modifying the workflow or the code it runs. `pull_request_target`, by contrast, runs
in the BASE repository's context, with its full secrets and a write-scoped token, specifically so maintainers can do
things like post a label or a comment on a fork PR that requires write access the fork itself doesn't have. GitHub
Security Lab's own writeup names the resulting trap directly as a 'pwn request': a workflow that uses
`pull_request_target` for that legitimate reason, and THEN ALSO checks out and executes the fork PR's own head
commit (to run its tests, build its code, or lint its changes) hands every secret and the write-scoped token to code
an anonymous external contributor controls, because the checkout step pulls in whatever the fork PR's author wrote,
and the base repository's trigger context is what executes it.

This is not a subtle misconfiguration that only shows up under unusual conditions — it is a documented, named
attack pattern specifically because the combination is easy to reach for without realizing the implication: a
maintainer wants 'build and test fork PRs the same way we test everything else' AND 'be able to label/comment on
them,' and `pull_request_target` looks like the trigger that unlocks both, when in fact the write-access half and
the execute-untrusted-code half need to be kept in separate jobs/workflows entirely.
"""

[[option]]
id = "never-combine-fork-checkout-with-secrets-on-pull-request-target"
label = "Keep pull_request_target scoped to trusted base-branch actions only (labeling, commenting); build/test the fork's own code via pull_request with no secrets"
directive = """
A `pull_request_target`-triggered workflow is scoped ONLY to actions that operate on trusted, base-repository
content and do not require checking out or executing the fork PR's own head commit — labeling the PR, posting a
comment, triaging based on metadata the event payload itself provides. Building, testing, linting, or otherwise
executing the fork PR's own code happens in a SEPARATE workflow triggered by plain `pull_request`, which GitHub
runs with no access to the base repository's secrets and a read-only token for a fork PR, by design. If a
build/test result from the fork's code genuinely needs to trigger a privileged action (posting a status comment
with results, for example), that is done via a second, separate `workflow_run`-triggered job that reads the
artifact the first job produced, rather than giving the first job secrets directly.
"""
remediation = """
Split this workflow into two: a pull_request_target-triggered job that performs only the trusted, base-repository
action (labeling, commenting) with no checkout of the fork's own head ref, and a separate pull_request-triggered
job that builds/tests/lints the fork PR's own code with the default no-secrets, read-only-token context GitHub
already applies to fork PRs under that trigger. If a privileged follow-up action needs to depend on the build/test
result, use a workflow_run-triggered job that reads the artifact rather than giving the build job secrets directly.
Verify by confirming no single job checks out the PR's own head ref AND has secrets/write-token access
simultaneously.
"""
effort = "high"
why = "pull_request_target's entire reason to exist is running with the base repository's secrets and write-scoped token even for a fork PR; combining that with executing the fork's own code hands an anonymous external contributor exactly what GitHub's pull_request trigger is specifically designed to deny them, through a documented, named attack pattern rather than an obscure edge case."

[[option]]
id = "pull-request-target-checks-out-and-executes-fork-head-with-secrets"
label = "A pull_request_target workflow checks out the fork PR's own head commit and runs its build/test/install steps, with secrets available to the job"
directive = "A workflow triggered on pull_request_target checks out the incoming PR's head ref (rather than only the base branch) and runs build, test, or lint steps against that checked-out code, in a job that also has repository/environment secrets available to it."
why = "Rejected: this is the exact combination GitHub Security Lab names as a 'pwn request' — the trigger exists to grant secrets/write-access for fork PRs specifically so maintainers do not need to, but combining that grant with executing the fork's own untrusted code hands those secrets and that write-scoped token to anonymous external contributors through nothing more than opening a pull request, no account compromise or additional exploitation required."
