id = "CICD-NO-SECRET-LOGGING-1"
title = "CI steps never print the environment or a secret's value; a derived secret is masked, and shell debug tracing is never enabled around a secret-bearing command"
tag = "stack"
domain = "ci-cd"
layer = "universal"
enforcement = "structured"
default = true
verification = "grounded"
qualifies = "Enforced by a scan over CI workflow step commands for an unconditional environment dump (`env`, `printenv`, `export` with no arguments) in a job that has secrets available to it, an explicit echo/print of a secrets-context reference or a variable known to hold one, or shell tracing (`set -x`, `bash -x`, a `sh -x` invocation) enabled around a command line that itself contains or constructs a secret value. Conformance holds when no step command echoes or dumps a secret-bearing variable or the full environment, and any secret value computed/derived at runtime (rather than referenced directly from the secrets context, which platforms mask automatically) is explicitly registered with the platform's masking mechanism before it can appear in any subsequent log line; it fails when any of the above appear in a job with secrets available, even if the specific run that was scanned happened not to trigger the leak (the capability to leak is the defect, not only an observed instance)."

[[sources]]
url = "https://cwe.mitre.org/data/definitions/532.html"
title = "CWE-532: Insertion of Sensitive Information into Log File"

[[sources]]
url = "https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions#storing-secrets"
title = "GitHub docs — Using secrets in GitHub Actions: 'GitHub automatically redacts secrets printed to the log, but... avoid printing secrets directly, [which] can be disabled if a secret is transformed in some way'"

[decision]
question = "Do CI step commands avoid printing the environment or a secret's value entirely, mask any derived/transformed secret value explicitly, and avoid shell debug tracing around secret-bearing commands, or can any step's output capture a secret into the build log?"
default = "no-env-dumps-explicit-masking-no-debug-tracing-around-secrets"
why = """
`CICD-SECRETS-VIA-SECRETS-STORE-1` ensures a credential is never a literal in the workflow file; this rule closes a
DIFFERENT leak path that persists even when every secret is correctly stored and referenced — the CI platform's own
automatic log redaction is a pattern-match against the EXACT string value it was given via the secrets context, and
that match breaks the moment the value is transformed in any way before it reaches a log line. A secret that is
base64-encoded, concatenated with another string, split and reassembled, or passed through a command whose own
debug/trace output prints its full argument list (`set -x` before a `curl` call carrying an Authorization header,
for example) produces log output the platform's redaction never sees as the secret it actually is, because the
printed string no longer matches byte-for-byte.

Separately, and more bluntly: a step that runs `env` or `printenv` for debugging purposes dumps every environment
variable available to that step, including every secret the job has access to, in one line — no transformation
required, just an unconditional dump that is easy to add temporarily while debugging a CI failure and easy to
forget to remove afterward. CI logs are frequently retained for a long window, sometimes readable by a broader
audience than the repository's own write-access list (public repos, or CI platforms with broad log-viewing
permissions), and once a secret value has appeared in a log line, the standard remedy is the same as a hardcoded
secret: rotate it, because viewing-access to CI logs is rarely audited as tightly as access to the secrets store
itself.
"""

[[option]]
id = "no-env-dumps-explicit-masking-no-debug-tracing-around-secrets"
label = "No unconditional environment dumps; explicitly mask any derived secret value; never enable shell debug tracing around a command carrying a secret"
directive = """
No CI step command runs an unconditional environment dump (`env`, `printenv`, bare `export`) in a job that has any
secret available to it. Any secret value that is transformed, derived, or reconstructed at runtime (rather than
used exactly as the secrets context provided it) is explicitly registered with the CI platform's masking mechanism
(GitHub Actions' `::add-mask::` workflow command, or the platform equivalent) immediately after it is computed and
before any step that might print it runs. Shell debug/trace flags (`set -x`, `bash -x`) are never enabled for a
command whose arguments include or construct a secret value; where trace output is needed for debugging a specific
step, it is scoped narrowly and the secret-bearing portion of the command is excluded or the flag is disabled again
immediately around that specific invocation.
"""
remediation = """
Remove any unconditional `env`/`printenv` debugging step from the workflow, or scope it to a job that genuinely has
no secrets available. Add an explicit mask registration (e.g. GitHub Actions' ::add-mask:: command) immediately
after any step that derives or transforms a secret value, before that value can reach a subsequent log line.
Disable shell debug/trace flags around any command whose arguments include a secret, or restructure the command so
the secret is passed via an environment variable the trace output does not expand. Verify by triggering the
workflow and inspecting the full build log for the secret's literal value in any form, including a
base64/URL-encoded or otherwise transformed representation.
"""
effort = "medium"
why = "A CI platform's automatic log redaction only catches an EXACT string match against a secrets-context value, so any transformation of that value before it is printed defeats the automatic protection entirely; explicit masking closes that gap, and removing unconditional environment dumps closes the simpler but equally damaging mistake of printing every secret a job has access to in one line."

[[option]]
id = "env-dumps-for-debugging-no-masking-no-trace-discipline"
label = "Debug CI failures by printing the full environment, with no masking of derived secrets and no restriction on shell debug tracing"
directive = "CI workflow steps freely run env/printenv for debugging, secret values that are transformed or derived at runtime are not explicitly masked, and shell debug/trace flags are left enabled around commands that may carry a secret in their arguments."
why = "Rejected: an unconditional environment dump prints every secret a job has access to, in one line, with no transformation needed to defeat the platform's automatic redaction (because nothing was transformed — it never applied to this printed representation in the first place either way). A derived secret value evades automatic redaction by construction, and debug tracing that echoes full command lines captures exactly the secret-bearing arguments the platform's masking was supposed to catch."

[[option]]
id = "rely-on-automatic-platform-redaction-only"
label = "Rely solely on the CI platform's automatic secret redaction, with no explicit masking of derived values and no review of step commands for env dumps"
directive = "The project trusts the CI platform's built-in log redaction to catch any secret value that might appear in a log line, performing no explicit masking of transformed/derived secrets and no review of workflow steps for commands that dump the environment or enable debug tracing."
why = "Rejected as insufficient on its own: automatic redaction matches the exact string the secrets context handed to the step, and a value that has been encoded, concatenated, or otherwise transformed before being printed no longer matches that string, so the platform's own documentation is explicit that this exact scenario can defeat automatic redaction. Relying on it alone leaves derived-secret leakage and environment-dump leakage both unaddressed."
