id = "ARCH-EXPAND-CONTRACT-1"
title = "Expand-then-contract for breaking schema changes"
tag = "stack"
domain = "sql"
layer = "universal"
enforcement = "prose"
default = true
verification = "grounded"

[[sources]]
url = "https://martinfowler.com/bliki/ParallelChange.html"
title = "Martin Fowler — Parallel Change (Expand/Migrate/Contract pattern)"

[[sources]]
url = "https://martinfowler.com/articles/evodb.html"
title = "Pramod Sadalage & Martin Fowler — Evolutionary Database Design (Transition Phase / parallel-change for schema refactorings)"

[decision]
question = "What position does the project take on: Expand-then-contract for breaking schema changes?"
default = "expand-then-contract-for-breaking-schema-changes"
why = "With live users, a single deploy can't be paired with a breaking schema change without an incompatibility window. Shipping a breaking schema change in a single deploy opens a window where running application code expects one schema shape and the database has another, and any request that hits during that window fails in a way that the application cannot defend against."

[[option]]
id = "expand-then-contract-for-breaking-schema-changes"
label = "Expand-then-contract for breaking schema changes"
directive = "Split breaking changes (drop/rename/NOT-NULL) across releases: expand (add new, write both), migrate reads, then contract (drop old). Migrations are schema-only; never seed user data in a migration."
remediation = """
Split the breaking schema change (drop, rename, or a new NOT NULL) into separate releases: first expand by adding the new column/table and writing to both old and new shapes, then migrate reads over to the new shape, and only in a later release contract by dropping the old column. Never seed user data inside the migration itself. Verify by confirming the application can run against both the pre- and post-expand schema during the rollout window, with no release requiring the drop and the dependent code change to land simultaneously.
"""
why = "With live users, a single deploy can't be paired with a breaking schema change without an incompatibility window."

[[option]]
id = "breaking-schema-changes-drop-rename-not-null-add"
label = "Breaking schema changes ship in a single deploy"
directive = "breaking schema changes (drop, rename, NOT-NULL additions) ship in a single deploy without an expand-then-contract split, applying the destructive change in the same release as the application code that depends on the new shape"
why = "Simpler to execute (one deploy, one migration) but opens an incompatibility window where running application code expects one schema shape and the database has another. Any request that lands during that window fails in a way the application cannot catch or retry."
