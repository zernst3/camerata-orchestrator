[package]
name = "camerata-llm"
edition.workspace = true
license.workspace = true
authors.workspace = true
version = "0.0.0"

[lints]
workspace = true

# The LLM/provider stack (Phase B of the headless-core extraction): the `LlmPort`
# completion seam, the `Llm` Anthropic transport (CLI + API + Message Batches), the
# `OpenRouterCompleter`, the provider-selecting `build_completer` factory + chain
# fallback, the OS-keychain credential store, the model registry (static Claude +
# OpenRouter discovery), the per-provider rate limiter, and the cumulative usage
# ledger. Extracted from `camerata-server` so the provider stack is reusable outside
# the Axum adapter; the server re-exports everything here so its module paths
# (`crate::llm::*`, `crate::credentials::*`, ...) keep resolving unchanged.

[dependencies]
# Pure-serde wire DTOs (Phase A): `LlmResponse`, the credential wire shapes + name
# consts + `CredentialError`, the registry wire shapes, and `DEFAULT_MODEL`.
camerata-api-types = { path = "../api-types" }
tokio = { workspace = true, features = ["time", "io-util", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# One-shot warning when a request carried fields its model rejects (see `conform_messages_body`).
tracing = { workspace = true }
# Object-safe async trait for the `LlmPort` completion seam.
async-trait = { workspace = true }
# HTTP transport for the Anthropic Messages/Batches APIs + the OpenRouter
# chat-completions + model-discovery endpoints. Same version/features as the server.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# OS-keychain credential storage (macOS Keychain / Windows Credential Manager /
# Secret Service) for the `KeyringCredentialStore`. The version lives in the workspace table.
# The base entry below enables NO backend; each platform's REAL store is switched on in its
# own target table so a platform only pulls its own backend. Without one of these keyring 3
# falls back to a non-persistent MOCK store and saved credentials silently vanish.
keyring = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

# Linux: Secret Service (GNOME Keyring / KWallet) over D-Bus. `crypto-rust` avoids an OpenSSL
# system dependency and `vendored` builds libdbus from source, so CI and dev machines need no
# libdbus-1-dev.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
# Mock Anthropic /v1/models server for the pagination tests (same version as the other crates).
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
# Env-mutating tests (PATH / CAMERATA_* overrides) use EnvGuard (restore-on-drop) and the
# workspace-wide `#[serial_test::serial(process_env)]` key; see crates/test-env.
serial_test = "3"
camerata-test-env = { path = "../test-env" }
