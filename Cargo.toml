[workspace]
resolver = "2"
members = [
    "crates/api-types",   # pure-serde wire-contract leaf crate (Phase A of the DTO extraction); no camerata deps
    "crates/secrets",     # leaf crate: the one secret-shape detector + redactor shared by the gateway, the scan floor, the chat scrubber and the export release gate (no camerata deps)
    "crates/liveness",    # leaf crate: LivenessTracker + mtime probe + HeartbeatFn (no camerata deps)
    "crates/core",        # orchestrator brain: roles, tasks, DAG, coordination (zero model calls)
    "crates/orchestrator", # package `camerata-orchestrator-core`: the confidence-dial engine —
                            # effect-signature decision-CLASS classifier (pure, no model self-report).
                            # Named -core to avoid colliding with the repo/binary name
                            # "camerata-orchestrator". See the product-owner vibe-mode design notes,
                            # "Architect-orchestrator design (decided 2026-07-10)".
    "crates/app-core",    # framework-agnostic backend app-orchestration (RUST-HEADLESS-CORE-1); no axum dep
    "crates/intake",      # PO-mode: intake form schema + LeadEngineer (architect-abstracted second level)
    "crates/gateway",     # layer-1 real-time governance gate: Rust MCP server (VERIFIED)
    "crates/agent",       # agent runtime: drives `claude -p` subprocesses, parses stream-json
    "crates/rules",       # rule corpus loader, enforcement_kind, rule-subset selection
    "crates/persistence", # SQLite state + JSON provenance
    "crates/checks",      # layer-2 post-task gate: CheckRunner + ESLint subprocess
    "crates/camerata-check", # Layer-3 CI-parity: standalone bin distributing the native
                             # architectural-checker registry (`camerata-checks::arch_checker`)
                             # for a CLIENT's own CI, no Camerata server/binary needed. See
                             # docs/design/2026-07-26_architectural-executor-feasibility.md §2.4
                             # and the "Pass 5 landed" note. Depends on camerata-checks +
                             # camerata-rules only — NEVER camerata-server.
    "crates/llm",         # LLM/provider stack: LlmPort seam + Llm/OpenRouter transports, credentials, model registry, rate limiter, usage ledger (Phase B; deps: api-types only)
    "crates/fleet",       # reusable governed-fleet build logic (used by CLI + UI)
    "crates/server",      # Axum HTTP/WS the cockpit talks to (embedded in orchestrator)
    "crates/client",      # typed HTTP client over the BFF's /api/* routes (shared by MCP + CLI adapters)
    "crates/mcp",         # first MCP adapter rung: rmcp stdio server exposing first-rung verbs via camerata-client (Phase E)
    "crates/source-check", # corpus source freshness (Part A of the freshness routine): fetch every rule `[[sources]]` url, record ok/redirected/dead/unreachable, hash cited sections against a sidecar, render the report. Never edits a rule.
    "crates/cli",         # binary entrypoint wiring it all together
    "crates/ui",          # Dioxus cockpit (separate process) — the thin rendering ADAPTER
    "crates/ui-core",     # framework-agnostic UI logic/state (RUST-HEADLESS-CORE-1); no dioxus dep
    "crates/preview",     # local-first `dx serve` live-preview adapter: status parser + process manager + edit-verify fallback (docs/spikes/2026-07-09_dioxus-live-preview-spike.md)
    "crates/worktracker", # WorkItemProvider port: canonical shapes, sync policy, native provider
    "crates/maintenance", # Tier-2 standing post-publish ops agent (upgrades, security, rotation)
    "crates/deploy",          # Tier-2 BYO-infra publish: DeployTarget seam + local + Azure adapter
    "crates/linter-registry", # citation validator: canonical linter rule-id lists + corpus scan report
    "crates/scaffold",        # Rust-fullstack PWA scaffolder (Part 1): vetted Dioxus-fullstack skeleton + ScaffoldStrategy fit-check seam (the product-owner vibe-mode design notes)
    "crates/test-env",    # TEST SUPPORT ONLY (dev-dependency of env-mutating test suites): EnvGuard RAII env-var override + the `process_env` serial-key discipline test
    "tools/corpus-verifier",  # MAINTAINER-ONLY repo-governance tool: promote rules grounded -> verified via branch + PR. NOT part of the shipped app; never a dependency of any app crate.
]
# `crates/scaffold/templates/skeleton` is an embedded template tree (its Cargo.toml
# contains `{{PLACEHOLDER}}` tokens and is `include_str!`'d as data by
# `crates/scaffold/src/skeleton.rs`, never invoked as a real package) — excluded so
# it's never mistaken for a workspace member.
exclude = ["crates/scaffold/templates/skeleton"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# unwrap_used is now denied workspace-wide. clippy.toml sets allow-unwrap-in-tests = true
# so #[test] fns and #[cfg(test)] modules are exempt. Integration tests under
# crates/*/tests/ carry a file-level #![allow(clippy::unwrap_used)] for the same reason.
# The remaining frontier (pedantic, expect_used, panic) is tracked in the strict-frontier
# CI job but is not yet denied here.
unwrap_used = "deny"

[workspace.package]
edition = "2021"
# Source-available, noncommercial. Deliberately NOT permissive: the code is fully
# readable, but commercial / competing use is reserved to the copyright holder. You
# can always loosen a license later; you cannot tighten one already shipped, so this
# starts reserved. See LICENSE.
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Zachary Ernst"]

[workspace.dependencies]
# OS-keychain credential storage, declared ONCE so the crates cannot drift. keyring 3 has NO
# platform backend by default: with no backend feature it silently falls back to an in-memory
# MOCK store in which every `Entry` is independent (a `get` after a `set` returns nothing), so
# nothing is ever persisted. The real per-platform backend features are therefore enabled in
# the one crate that uses keyring (crates/llm/Cargo.toml, target-specific tables) and guarded
# by `credentials::tests::production_keyring_store_is_not_the_mock*`.
keyring = { version = "3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
thiserror = "2"
async-trait = "0.1"
# Disk-space query (a single statvfs call) — used by the disk-headroom preflight guard
# (Decision: 2026-06-22_dogfood_disk_safety). Deliberately a workspace dep so server,
# checks, and agent can all share the same version without version skew.
fs2 = "0.4"
# Gitignore-aware directory walker (ripgrep's ignore crate). Used by the brownfield
# local-scan path to skip gitignored files (feature: scan-hygiene). A workspace dep so
# the version is pinned in one place; only server consumes it today.
ignore = "0.4"
# SHA-256 for the enforcement-catch-ledger content_hash. Preimage-resistant so the
# ledger stays safe to share/port as proof (a hashed code slice that MIGHT contain a
# secret cannot be brute-forced back). Workspace dep so gateway + persistence agree.
sha2 = "0.10"
# Structured logging (Phase H1: governance-event-trail foundation). `tracing` is the
# facade any crate can emit through; `tracing-subscriber` (with `env-filter`) is the
# STARTUP-ONLY subscriber the two binary entrypoints (server, gateway) install once.
# Library crates should depend on `tracing` alone, never `tracing-subscriber` — only a
# `main()` installs a global subscriber.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ---------------------------------------------------------------------------
# Build profiles — disk footprint
# ---------------------------------------------------------------------------
# Context: on 2026-10-17 this workspace's `target/` reached 222 GiB across
# 836,209 files and filled the machine's data volume. It was not a leak. Cargo
# has no garbage collector: artifacts are content-hashed, so every change to a
# shared crate mints a NEW hashed artifact for everything downstream and the old
# one is never reclaimed. `target/` is an append-only log of every build ever
# run, and only `cargo clean` (all-or-nothing) removes anything.
#
# This workspace multiplies that: 26 crates, 80 test targets, 839 locked deps,
# and agent-driven runs that re-run the full suite many times per session. Each
# run mints a fresh generation of every test binary plus its dependency closure.
#
# `debug = "line-tables-only"` is the lever. Cargo's dev/test default is full
# debuginfo, which on macOS also defaults to `split-debuginfo = "unpacked"` —
# per-codegen-unit `.o` files next to each artifact, which is where the
# three-quarters-of-a-million file count came from. Debuginfo, not code, was the
# bulk of those 222 GiB.
#
# The trade, taken deliberately: panics and backtraces KEEP file and line
# numbers, which is what we actually read. What is given up is variable
# inspection under a debugger (lldb). We do not step through this workspace in a
# debugger; `RUST_BACKTRACE=1` plus `tracing` is the debugging surface here.
#
# This bounds how large a single generation is. It does NOT reclaim old
# generations — that is `cargo sweep --time 7`, run on a schedule, which is the
# GC cargo lacks (it deletes artifacts untouched for N days rather than all of
# them, so there is no full cold rebuild afterward).
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
