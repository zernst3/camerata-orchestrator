name: CI

# Camerata governs its own source the way it governs the agents: mechanically, in
# CI, on every push and pull request. The whole thesis is "examples are not
# enforcement, the gate is", so this gate runs on Camerata's own code.

on:
  push:
    # Feature and fix branches are gated on every push, not only once a PR is
    # opened: long-lived branches that were never gated drifted months out of
    # compliance before anyone saw a red build.
    branches: [main, "feat/**", "fix/**"]
  pull_request:

# Least privilege: nothing here writes to the repository, issues or packages.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Third-party actions are pinned to full commit SHAs (a tag can be moved, a SHA cannot);
# the version each SHA corresponds to is the trailing comment.

jobs:
  govern:
    name: Camerata governs its own code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Gate 0: this repository is public, so no tracked file may name a personal home
      # directory or the private fixture folder. Seconds long and needs no toolchain, so
      # it runs before anything is installed.
      - name: Personal path gate
        run: ./scripts/ci-gate.sh "Personal path gate" ./scripts/check-personal-paths.sh

      - name: Free disk space
        run: ./scripts/ci-free-disk.sh

      - name: Install system packages
        run: ./scripts/ci-apt-deps.sh

      - name: Install typst (pinned)
        run: ./scripts/ci-install-typst.sh

      # Pinned, not floating: the gate must mean the same thing on every run. The version is
      # read from rust-toolchain.toml, the same file rustup uses locally, so CI and a
      # developer's machine cannot drift. On `stable` (1.99) clippy reports
      # `double_must_use` on every `#[async_trait]` trait and rustc reports a redundant glob
      # import as unused, neither of which 1.95 does. Bump the toml deliberately, together
      # with whatever the new toolchain flags.
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0 branch
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Every gate below runs through scripts/ci-gate.sh, which runs the command
      # unchanged and, on failure, re-emits the tail of its output as annotations
      # (readable without a login on a public repo). It never changes a verdict.

      # Gate 1: formatting is mechanically enforced (no "looks fine to me").
      - name: Format gate
        run: ./scripts/ci-gate.sh "Format gate" cargo fmt --all -- --check

      # Gate 2: zero warnings, and `unsafe_code = "forbid"` is enforced at compile
      # time via the workspace lint table, so unsafe code cannot land.
      - name: Clippy gate (deny all warnings)
        run: ./scripts/ci-gate.sh "Clippy gate" cargo clippy --workspace --all-targets -- -D warnings

      # Gate 3: SELF-MEASUREMENT (W6 / I1 + I2). Runs BEFORE the full suite, deliberately.
      #
      # Every defect on docs/plans/2026-10-09_audit-findings-tracker.md was found by paying
      # for an external graded run against benchmark repos while this very suite stayed green.
      # The engine had elaborate honesty machinery and no self-measurement machinery. These
      # are the checks that would have caught them: artifact parity across the PDF, the
      # workbook and findings.json; row conservation at every pipeline stage; no silent
      # non-execution of a rule, pass or tool tier.
      #
      # It runs first because it is seconds long and because its failures are the expensive
      # kind — a graded sweep of four repos costs roughly $26 and four hours. Failing here
      # fails the build before anyone spends that. Deterministic, no network, no model calls.
      #
      # These tests also run again inside the workspace suite below; the duplication is the
      # point, so the signal is named rather than buried among ~1900 other tests.
      - name: Self-measurement gate (parity, conservation, non-execution)
        run: ./scripts/ci-gate.sh "Self-measurement gate" ./scripts/self-measurement.sh

      # Gate 4: the test suite must pass.
      - name: Test gate
        run: ./scripts/ci-gate.sh "Test gate" cargo test --workspace --locked

  # A non-blocking informational pass that surfaces the STRICTER bar Camerata is
  # working toward (expect/panic removal, pedantic), without failing the build
  # today. Honest staging, in the same spirit as docs/ENFORCEMENT.md: the
  # blocking gate above is real; this is the tracked, not-yet-denied frontier.
  #
  # Note: unwrap_used is NO LONGER in this job. It is now denied in the blocking
  # gate via [workspace.lints.clippy] unwrap_used = "deny" in Cargo.toml.
  strict-frontier:
    name: Strict frontier (informational, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # This job deliberately tracks the NEWEST stable as an early warning, so it overrides
      # the rust-toolchain.toml pin that the blocking job and local builds use.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free disk space
        run: ./scripts/ci-free-disk.sh
      - name: Install system packages
        run: ./scripts/ci-apt-deps.sh
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # branch-per-version action, toolchain set below
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (pedantic + restriction, report only)
        run: >
          ./scripts/ci-gate.sh "Strict frontier"
          cargo clippy --workspace --all-targets --
          -W clippy::pedantic
          -W clippy::expect_used
          -W clippy::panic
