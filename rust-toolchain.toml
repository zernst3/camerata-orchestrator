# The one place the Rust toolchain is pinned. rustup reads it for local builds, and the CI
# workflow reads the same `channel` line (see .github/workflows/ci.yml), so the two cannot
# drift. The 1.99 findings were fixed ahead of the bump (expanded `#[async_trait]`
# declarations and four lint fixes). Bump it deliberately, together with whatever the next
# toolchain's rustc and clippy flag.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
